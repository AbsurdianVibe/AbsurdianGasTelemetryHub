<script>
  /**
   * Client-side application controller for Absurdian Gas Telemetry Hub.
   */

  let myDailyQuotaChartInstance = null;
  let myPeakDurationChartInstance = null;
  let myActiveViewName = 'overview';
  const myTabScrollPositions_ = {};

  const MY_STORAGE_KEY_VIEW_STATE = 'myGasTelemetryHub_viewState';
  const MY_STORAGE_KEY_PROCESSES = 'myGasTelemetryHub_cachedProcesses';
  const MY_STORAGE_KEY_LAST_SYNC = 'myGasTelemetryHub_lastSync';
  const MY_STORAGE_KEY_SETTINGS = 'myGasTelemetryHub_settings';
  const MY_STORAGE_KEY_PROJECT_COLORS = 'myGasTelemetryHub_projectColors';
  const MY_STORAGE_KEY_HIDDEN_PROJECTS = 'myGasTelemetryHub_hiddenProjects';

  /**
   * Promise wrapper for google.script.run server calls.
   * @param {string} myMethodName - Remote function name.
   * @param {...*} myArgs - Arguments to pass.
   * @return {Promise<*>} Server response promise.
   */
  function myCallServer(myMethodName, ...myArgs) {
    return new Promise(function (myResolve, myReject) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        myReject(new Error('google.script.run is not available in local mode.'));
        return;
      }
      const myRunner = google.script.run
        .withSuccessHandler(myResolve)
        .withFailureHandler(myReject);
      myRunner[myMethodName].apply(myRunner, myArgs);
    });
  }

  /**
   * Switch active navigation tab and section.
   * @param {string} myTabKey - Target tab key.
   */
  function mySwitchView(myTabKey) {
    if (myActiveViewName && myActiveViewName !== myTabKey) {
      myTabScrollPositions_[myActiveViewName] = window.scrollY;
    }
    myActiveViewName = myTabKey;
    ['overview', 'projects', 'settings'].forEach(function (myKey) {
      const myNavBtn = document.getElementById('myNavTab' + myKey.charAt(0).toUpperCase() + myKey.slice(1));
      const myViewSec = document.getElementById('myView' + myKey.charAt(0).toUpperCase() + myKey.slice(1));
      if (myKey === myTabKey) {
        if (myNavBtn) myNavBtn.classList.add('my-active');
        if (myViewSec) myViewSec.classList.add('my-active');
      } else {
        if (myNavBtn) myNavBtn.classList.remove('my-active');
        if (myViewSec) myViewSec.classList.remove('my-active');
      }
    });

    const myTimeBar = document.getElementById('myTimeWindowBar');
    if (myTimeBar) {
      myTimeBar.style.display = (myTabKey === 'settings') ? 'none' : 'flex';
    }

    const myResBar = document.getElementById('myTimeResolutionsBar');
    if (myResBar) {
      myResBar.style.display = (myTabKey === 'overview') ? 'flex' : 'none';
    }

    mySaveViewState_();

    const myTargetScrollY = myTabScrollPositions_[myTabKey] || 0;
    window.requestAnimationFrame(function () {
      document.documentElement.style.scrollBehavior = 'auto';
      window.scrollTo(0, myTargetScrollY);
      window.requestAnimationFrame(function () {
        document.documentElement.style.scrollBehavior = '';
      });
    });
  }

  /**
   * Format duration in seconds to human readable string.
   * @param {number} mySec - Duration in seconds.
   * @return {string} Formatted duration.
   */
  function myFormatDurationClient(mySec) {
    if (!mySec || isNaN(mySec)) return '0.0s';
    if (mySec < 60) return mySec.toFixed(1) + 's';
    const myMins = Math.floor(mySec / 60);
    const myRemainder = (mySec % 60).toFixed(0);
    if (myMins < 60) return myMins + 'm ' + myRemainder + 's';
    return Math.floor(myMins / 60) + 'h ' + (myMins % 60) + 'm';
  }

  /**
   * Format duration in seconds to fixed-width MM:SS.0s mask.
   * @param {number} mySec - Duration in seconds.
   * @return {string} Formatted duration with mask 00:00.0s.
   */
  function myFormatDurationFixed_(mySec) {
    if (!mySec || isNaN(mySec)) return '00:00.0s';
    const myTotalTenths = Math.round(Math.max(0, Number(mySec)) * 10);
    const myTenths = myTotalTenths % 10;
    const myTotalSec = Math.floor(myTotalTenths / 10);
    const mySeconds = myTotalSec % 60;
    const myMins = Math.floor(myTotalSec / 60);
    const myPad2 = function (n) { return (n < 10) ? '0' + n : '' + n; };
    return myPad2(myMins) + ':' + myPad2(mySeconds) + '.' + myTenths + 's';
  }

  /**
   * Render KPI summary cards and progress bars.
   * @param {Object} mySummary - Summary metrics object.
   */
  function myRenderKpis(mySummary) {
    const myQuotaPct = (typeof mySummary.lastFullDayQuotaPercent !== 'undefined') ?
      mySummary.lastFullDayQuotaPercent : (mySummary.todayQuotaPercent || 0);
    const myQuotaSec = (typeof mySummary.lastFullDayQuotaSec !== 'undefined') ?
      mySummary.lastFullDayQuotaSec : (mySummary.todayQuotaSec || 0);
    const myDayKey = mySummary.lastFullDayKey || '';

    const myQuotaBadge = document.getElementById('myKpiQuotaBadge');
    const myQuotaVal = document.getElementById('myKpiQuotaVal');
    const myQuotaBar = document.getElementById('myKpiQuotaBar');
    const myQuotaSub = document.getElementById('myKpiQuotaSub');

    myQuotaVal.innerText = myQuotaSec + 's (' + myQuotaPct + '%)';
    myQuotaBadge.innerText = myQuotaPct + '%';
    myQuotaBar.style.width = Math.min(100, myQuotaPct) + '%';
    if (myQuotaSub && myDayKey) {
      myQuotaSub.innerText = 'Doba ' + myDayKey + ' • Limit: ' + mySummary.todayQuotaLimitSec + 's (90 min)';
    }

    myQuotaBar.className = 'my-progress-fill';
    myQuotaBadge.className = 'my-badge';
    if (myQuotaPct >= 90) {
      myQuotaBar.classList.add('my-crit');
      myQuotaBadge.classList.add('my-badge-danger');
    } else if (myQuotaPct >= 70) {
      myQuotaBar.classList.add('my-warn');
      myQuotaBadge.classList.add('my-badge-danger');
    } else {
      myQuotaBadge.classList.add('my-badge-success');
    }

    document.getElementById('myKpiTotalDurationVal').innerText = myFormatDurationClient(mySummary.totalDurationSec);
    document.getElementById('myKpiTotalRunsVal').innerText = mySummary.totalRuns.toLocaleString();
    document.getElementById('myKpiFailureRateVal').innerText = mySummary.failureRate + '%';
    document.getElementById('myKpiFailureRateSub').innerText = mySummary.totalFailures + ' awarii / timeoutów';
  }

  const MY_CHART_COLOR_PALETTE = Object.freeze([
    { fill: 'hsla(217, 91%, 60%, 0.45)', border: 'hsl(217, 91%, 60%)' }, // Blue
    { fill: 'hsla(142, 71%, 45%, 0.45)', border: 'hsl(142, 71%, 45%)' }, // Green
    { fill: 'hsla(260, 80%, 65%, 0.45)', border: 'hsl(260, 80%, 65%)' }, // Purple
    { fill: 'hsla(38, 92%, 50%, 0.45)', border: 'hsl(38, 92%, 50%)' },   // Amber
    { fill: 'hsla(330, 80%, 60%, 0.45)', border: 'hsl(330, 80%, 60%)' }, // Pink
    { fill: 'hsla(180, 70%, 45%, 0.45)', border: 'hsl(180, 70%, 45%)' }, // Teal
    { fill: 'hsla(280, 70%, 50%, 0.45)', border: 'hsl(280, 70%, 50%)' }, // Indigo
    { fill: 'hsla(15, 85%, 55%, 0.45)', border: 'hsl(15, 85%, 55%)' },   // Coral
    { fill: 'hsla(80, 75%, 45%, 0.45)', border: 'hsl(80, 75%, 45%)' }    // Lime
  ]);

  let myProjectColorRegistry_ = {};
  let myHiddenProjects_ = {};

  /**
   * Restore project colors registry from localStorage.
   */
  function myRestoreProjectColors_() {
    try {
      const myRaw = localStorage.getItem(MY_STORAGE_KEY_PROJECT_COLORS);
      if (myRaw) {
        myProjectColorRegistry_ = JSON.parse(myRaw) || {};
      }
    } catch (myErr) {
      myProjectColorRegistry_ = {};
    }
  }

  /**
   * Save project colors registry to localStorage.
   */
  function mySaveProjectColors_() {
    try {
      localStorage.setItem(MY_STORAGE_KEY_PROJECT_COLORS, JSON.stringify(myProjectColorRegistry_));
    } catch (myErr) {
      // Ignore storage errors
    }
  }

  /**
   * Restore hidden projects registry from localStorage.
   */
  function myRestoreHiddenProjects_() {
    try {
      const myRaw = localStorage.getItem(MY_STORAGE_KEY_HIDDEN_PROJECTS);
      if (myRaw) {
        myHiddenProjects_ = JSON.parse(myRaw) || {};
      }
    } catch (myErr) {
      myHiddenProjects_ = {};
    }
  }

  /**
   * Save hidden projects registry to localStorage.
   */
  function mySaveHiddenProjects_() {
    try {
      localStorage.setItem(MY_STORAGE_KEY_HIDDEN_PROJECTS, JSON.stringify(myHiddenProjects_));
    } catch (myErr) {
      // Ignore storage errors
    }
  }

  /**
   * Deterministically get consistent color palette for a project and persist it.
   * @param {string} myProjectName - Name of the project.
   * @return {Object} Color entry with fill and border.
   */
  function myGetProjectColor_(myProjectName) {
    if (!myProjectColorRegistry_[myProjectName]) {
      const myAssignedCount = Object.keys(myProjectColorRegistry_).length;
      myProjectColorRegistry_[myProjectName] = MY_CHART_COLOR_PALETTE[myAssignedCount % MY_CHART_COLOR_PALETTE.length];
      mySaveProjectColors_();
    }
    return myProjectColorRegistry_[myProjectName];
  }

  const MY_GAS_DAILY_QUOTA_SEC = 5400;
  const MY_GAS_MAX_EXECUTION_SEC = 360;

  const MY_CHART_MODE = Object.freeze({
    STACKED: 'STACKED',
    OVERLAY: 'OVERLAY'
  });

  const MY_LIMIT_LINE_STYLE = Object.freeze({
    borderColor: 'hsl(0, 75%, 60%)',
    borderWidth: 2,
    borderDash: [6, 6],
    pointRadius: 0,
    fill: false
  });

  /**
   * Build limit reference line dataset.
   * @param {number} myPointsCount - Number of data points.
   * @param {number} myLimitValue - Limit value in seconds.
   * @param {string} myToggleId - DOM checkbox toggle ID.
   * @param {string} myLabel - Dataset label text.
   * @return {Object} Chart.js dataset for limit line.
   */
  function myBuildLimitDataset_(myPointsCount, myLimitValue, myToggleId, myLabel) {
    const myToggle = document.getElementById(myToggleId);
    const myIsHidden = myToggle ? !myToggle.checked : false;
    const myData = [];
    for (let myI = 0; myI < myPointsCount; myI++) {
      myData.push(myLimitValue);
    }
    return {
      label: myLabel,
      data: myData,
      borderColor: MY_LIMIT_LINE_STYLE.borderColor,
      borderWidth: MY_LIMIT_LINE_STYLE.borderWidth,
      borderDash: MY_LIMIT_LINE_STYLE.borderDash,
      pointRadius: MY_LIMIT_LINE_STYLE.pointRadius,
      fill: false,
      tension: 0,
      stack: 'myLimitStack',
      isLimitLine: true,
      hidden: myIsHidden
    };
  }

  const MY_DAILY_KEY_LENGTH = 10;
  const MY_MIN_TICK_GAP_PX = 70;
  const MY_MIN_DAY_BOUNDARY_GAP_PX = 24;
  const MY_BOUNDARY_TICK_STUB_PX = 5;
  const MY_TICK_FONT_SIZE_PX = 11;
  const MY_TICK_FONT_WEIGHT_BOLD = '700';
  const MY_TICK_FONT_WEIGHT_NORMAL = '400';
  const MY_HARMONIC_SUBDAILY_STEPS_MIN = Object.freeze([720, 360, 180, 60, 30, 15, 5, 1]);
  const MY_HARMONIC_DAILY_DAY_STRIDES = Object.freeze([10, 5, 3, 2, 1]);
  const MY_TICK_TRANSITION = Object.freeze({
    NONE: 'none',
    DAY: 'day',
    MONTH: 'month',
    YEAR: 'year'
  });
  const MY_ANCHOR_PRIORITY = Object.freeze({
    [MY_TICK_TRANSITION.YEAR]: 1,
    [MY_TICK_TRANSITION.MONTH]: 2,
    [MY_TICK_TRANSITION.DAY]: 3
  });
  const MY_CHANGE_TRANSITIONS = Object.freeze({
    [MY_TICK_TRANSITION.MONTH]: true,
    [MY_TICK_TRANSITION.YEAR]: true
  });
  const MY_X_GRID_STYLES = Object.freeze({
    [MY_TICK_TRANSITION.NONE]: Object.freeze({
      color: 'hsla(217, 33%, 30%, 0.2)',
      tickColor: 'hsla(217, 33%, 30%, 0.2)',
      lineWidth: 1
    }),
    [MY_TICK_TRANSITION.DAY]: Object.freeze({
      color: 'hsla(217, 33%, 42%, 0.36)',
      tickColor: 'hsla(215, 25%, 55%, 0.55)',
      lineWidth: 1
    }),
    [MY_TICK_TRANSITION.MONTH]: Object.freeze({
      color: 'hsla(215, 35%, 56%, 0.6)',
      tickColor: 'hsla(213, 30%, 82%, 0.85)',
      lineWidth: 1.5
    }),
    [MY_TICK_TRANSITION.YEAR]: Object.freeze({
      color: 'hsla(213, 45%, 72%, 0.85)',
      tickColor: 'hsla(210, 40%, 98%, 0.95)',
      lineWidth: 2
    })
  });
  const MY_MONTH_SHORT_NAMES = Object.freeze([
    'sty', 'lut', 'mar', 'kwi', 'maj', 'cze',
    'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'
  ]);
  const MY_TICK_TEMPLATE_DAILY_FIRST = '00 maj 0000';
  const MY_TICK_TEMPLATE_DAILY_REST = '00 maj';
  const MY_TICK_TEMPLATE_SUBDAILY_FIRST = Object.freeze(['00:00', '00 maj 0000']);
  const MY_TICK_TEMPLATE_SUBDAILY_REST = Object.freeze(['00:00', '00 maj']);

  /**
   * Split bucket key string into calendar and time parts.
   * @param {string} myBucketKey - Raw bucket key string.
   * @return {Object|null} Parsed parts or null.
   */
  function myParseBucketParts_(myBucketKey) {
    if (!myBucketKey || typeof myBucketKey !== 'string') return null;
    const myYmd = myBucketKey.slice(0, MY_DAILY_KEY_LENGTH);
    const myIsDaily = myBucketKey.length <= MY_DAILY_KEY_LENGTH;
    const myYear = myYmd.slice(0, 4);
    const myMonthStr = myYmd.slice(5, 7);
    const myDayStr = myYmd.slice(8, 10);
    const myTime = myIsDaily ? '' : myBucketKey.slice(MY_DAILY_KEY_LENGTH + 1);
    const myDayMonth = myDayStr + ' ' + (MY_MONTH_SHORT_NAMES[Number(myMonthStr) - 1] || myMonthStr);
    const myMinuteOfDay = myIsDaily ? -1 : (Number(myTime.slice(0, 2)) * 60 + Number(myTime.slice(3, 5)));
    return {
      year: myYear,
      yearMonth: myYmd.slice(0, 7),
      dayMonth: myDayMonth,
      fullDate: myDayMonth + ' ' + myYear,
      ymd: myYmd,
      day: Number(myDayStr),
      time: myTime,
      minuteOfDay: myMinuteOfDay,
      isDaily: myIsDaily
    };
  }

  /**
   * Determine calendar boundary transition level from previous tick.
   * @param {Object} myCurrParts - Current tick date parts.
   * @param {Object|null} myPrevParts - Previous tick date parts.
   * @return {string} Transition tier key from MY_TICK_TRANSITION.
   */
  function myGetTickTransitionLevel_(myCurrParts, myPrevParts) {
    if (!myPrevParts) return MY_TICK_TRANSITION.NONE;
    if (myCurrParts.year !== myPrevParts.year) return MY_TICK_TRANSITION.YEAR;
    if (myCurrParts.yearMonth !== myPrevParts.yearMonth) return MY_TICK_TRANSITION.MONTH;
    if (myCurrParts.ymd !== myPrevParts.ymd) return MY_TICK_TRANSITION.DAY;
    return MY_TICK_TRANSITION.NONE;
  }

  /**
   * Get X-axis grid style matching visible tick calendar transition level.
   * @param {Object} myCtx - Chart.js scriptable scale context.
   * @return {Object} Grid style with color, tickColor and lineWidth.
   */
  function myGetXGridStyle_(myCtx) {
    const myTransition = myCtx && myCtx.tick && myCtx.tick.myGridTransition;
    return (myTransition && MY_X_GRID_STYLES[myTransition]) || MY_X_GRID_STYLES[MY_TICK_TRANSITION.NONE];
  }

  /**
   * Collect exact calendar transitions and parsed parts across raw bucket labels.
   * @param {Array<string>} myLabels - Full bucket label keys.
   * @return {Object} Transitions, boundary entries, parsed parts and daily flag.
   */
  function myCollectCalendarBoundaries_(myLabels) {
    const myTransitions = [];
    const myBoundaries = [];
    const myPartsList = [];
    let myPrevParts = null;
    let myIsDaily = false;
    for (let myIdx = 0; myIdx < myLabels.length; myIdx++) {
      const myCurrParts = myParseBucketParts_(myLabels[myIdx]);
      myPartsList.push(myCurrParts);
      if (!myCurrParts) {
        myTransitions.push(MY_TICK_TRANSITION.NONE);
        continue;
      }
      if (!myPrevParts) myIsDaily = myCurrParts.isDaily;
      const myTransition = myGetTickTransitionLevel_(myCurrParts, myPrevParts);
      myTransitions.push(myTransition);
      if (myTransition !== MY_TICK_TRANSITION.NONE) {
        myBoundaries.push({ index: myIdx, transition: myTransition });
      }
      myPrevParts = myCurrParts;
    }
    return {
      transitions: myTransitions,
      boundaries: myBoundaries,
      partsList: myPartsList,
      isDaily: myIsDaily
    };
  }

  /**
   * Build map of bucket indices currently rendered as visible X-axis ticks.
   * @param {Object} myXScale - Chart.js X scale instance.
   * @return {Object} Lookup map of visible tick bucket indices.
   */
  function myGetVisibleTickIndexMap_(myXScale) {
    const myVisibleMap = {};
    if (!myXScale || !myXScale.ticks) return myVisibleMap;
    myXScale.ticks.forEach(function (myTick) {
      myVisibleMap[myTick.value] = true;
    });
    return myVisibleMap;
  }

  /**
   * Check whether skipped sub-daily day boundaries have enough pixel spacing.
   * @param {Object} myCalendarData - Precomputed calendar boundaries metadata.
   * @param {number} myAreaWidthPx - Chart plot area width in pixels.
   * @return {boolean} True when skipped day lines can render without clutter.
   */
  function myShouldDrawSkippedDays_(myCalendarData, myAreaWidthPx) {
    if (myCalendarData.isDaily || !myCalendarData.boundaries.length) return false;
    return (myAreaWidthPx / myCalendarData.boundaries.length) >= MY_MIN_DAY_BOUNDARY_GAP_PX;
  }

  /**
   * Stroke one vertical calendar boundary line and axis tick stub.
   * @param {CanvasRenderingContext2D} myCtx - Canvas 2D context.
   * @param {Object} myArea - Chart.js plot area bounds.
   * @param {number} myRawX - Unaligned X pixel coordinate.
   * @param {string} myTransition - Transition tier key.
   */
  function myStrokeCalendarBoundaryLine_(myCtx, myArea, myRawX, myTransition) {
    if (myRawX <= myArea.left || myRawX >= myArea.right) return;
    const myStyle = MY_X_GRID_STYLES[myTransition];
    const myX = (myStyle.lineWidth === 1) ? (Math.round(myRawX) + 0.5) : myRawX;

    myCtx.lineWidth = myStyle.lineWidth;
    myCtx.setLineDash([]);
    myCtx.strokeStyle = myStyle.color;
    myCtx.beginPath();
    myCtx.moveTo(myX, myArea.top);
    myCtx.lineTo(myX, myArea.bottom);
    myCtx.stroke();

    myCtx.strokeStyle = myStyle.tickColor;
    myCtx.beginPath();
    myCtx.moveTo(myX, myArea.bottom);
    myCtx.lineTo(myX, myArea.bottom + MY_BOUNDARY_TICK_STUB_PX);
    myCtx.stroke();
  }

  /**
   * Draw vertical calendar boundary lines skipped by visible tick selection.
   * @param {Object} myChart - Chart.js instance.
   * @param {Object} myCalendarData - Precomputed transitions and boundaries.
   */
  function myDrawSkippedBoundaryGrid_(myChart, myCalendarData) {
    const myArea = myChart.chartArea;
    const myXScale = myChart.scales && myChart.scales.x;
    if (!myArea || !myXScale || !myCalendarData || !myCalendarData.boundaries.length) return;

    const myVisibleTicks = myGetVisibleTickIndexMap_(myXScale);
    const myShowSkippedDays = myShouldDrawSkippedDays_(myCalendarData, myArea.width);
    const myCtx = myChart.ctx;
    myCtx.save();
    myCalendarData.boundaries.forEach(function (myBoundary) {
      if (myVisibleTicks[myBoundary.index]) return;
      if (myBoundary.transition === MY_TICK_TRANSITION.DAY && !myShowSkippedDays) return;
      myStrokeCalendarBoundaryLine_(myCtx, myArea, myXScale.getPixelForValue(myBoundary.index), myBoundary.transition);
    });
    myCtx.restore();
  }

  /**
   * Get short date text for tick based on change from previous visible tick.
   * @param {Object} myCurrParts - Current tick date parts.
   * @param {Object|null} myPrevParts - Previous visible tick date parts.
   * @return {string} Date anchor string or empty string.
   */
  function myFormatCalendarAnchor_(myCurrParts, myPrevParts) {
    if (!myPrevParts || myCurrParts.year !== myPrevParts.year) return myCurrParts.fullDate;
    return myCurrParts.ymd !== myPrevParts.ymd ? myCurrParts.dayMonth : '';
  }

  /**
   * Build final 1-line or 2-line label for one visible tick.
   * @param {Object} myCurrParts - Current tick date parts.
   * @param {Object|null} myPrevParts - Previous visible tick date parts.
   * @return {string|Array<string>} Formatted tick label.
   */
  function myFormatSingleVisibleTick_(myCurrParts, myPrevParts) {
    const myAnchor = myFormatCalendarAnchor_(myCurrParts, myPrevParts);
    if (myCurrParts.isDaily) return myAnchor || myCurrParts.dayMonth;
    return myAnchor ? [myCurrParts.time, myAnchor] : myCurrParts.time;
  }

  /**
   * Sort unique numeric indices in ascending order.
   * @param {Array<number>} myIndices - Bucket indices list.
   * @return {Array<number>} Sorted unique bucket indices.
   */
  function mySortUniqueIndicesAsc_(myIndices) {
    return Array.from(new Set(myIndices)).sort(function (myA, myB) {
      return myA - myB;
    });
  }

  /**
   * Filter and sort boundary entries by visual anchor priority.
   * @param {Array<Object>} myBoundaries - Raw calendar boundaries.
   * @param {boolean} myIsDaily - True when resolution is daily.
   * @return {Array<Object>} Sorted boundary entries.
   */
  function myGetSortedAnchorCandidates_(myBoundaries, myIsDaily) {
    return myBoundaries
      .filter(function (myEntry) {
        return !myIsDaily || myEntry.transition !== MY_TICK_TRANSITION.DAY;
      })
      .sort(function (myA, myB) {
        return (MY_ANCHOR_PRIORITY[myA.transition] - MY_ANCHOR_PRIORITY[myB.transition]) || (myA.index - myB.index);
      });
  }

  /**
   * Check if candidate index keeps minimum pixel gap from existing ticks.
   * @param {number} myCandidateIdx - Candidate bucket index.
   * @param {Array<number>} myExistingIndices - Accepted bucket indices.
   * @param {Object} myXScale - Chart.js X scale instance.
   * @return {boolean} True when candidate keeps MY_MIN_TICK_GAP_PX.
   */
  function myHasPixelClearance_(myCandidateIdx, myExistingIndices, myXScale) {
    const myCandidatePx = myXScale.getPixelForValue(myCandidateIdx);
    for (let myI = 0; myI < myExistingIndices.length; myI++) {
      if (Math.abs(myCandidatePx - myXScale.getPixelForValue(myExistingIndices[myI])) < MY_MIN_TICK_GAP_PX) {
        return false;
      }
    }
    return true;
  }

  /**
   * Check if all adjacent tick indices satisfy minimum pixel gap.
   * @param {Array<number>} mySortedIndices - Sorted bucket indices.
   * @param {Object} myXScale - Chart.js X scale instance.
   * @return {boolean} True when all neighbors clear MY_MIN_TICK_GAP_PX.
   */
  function myHasAllNeighborClearance_(mySortedIndices, myXScale) {
    for (let myI = 1; myI < mySortedIndices.length; myI++) {
      if (Math.abs(myXScale.getPixelForValue(mySortedIndices[myI]) - myXScale.getPixelForValue(mySortedIndices[myI - 1])) < MY_MIN_TICK_GAP_PX) {
        return false;
      }
    }
    return true;
  }

  /**
   * Select non-colliding priority anchor indices starting from index zero.
   * @param {Object} myCalendarData - Precomputed boundaries metadata.
   * @param {Object} myXScale - Chart.js X scale instance.
   * @return {Array<number>} Sorted priority anchor indices.
   */
  function mySelectPriorityAnchors_(myCalendarData, myXScale) {
    const myAnchors = [0];
    const myCandidates = myGetSortedAnchorCandidates_(myCalendarData.boundaries, myCalendarData.isDaily);
    for (let myI = 0; myI < myCandidates.length; myI++) {
      const myCandidateIdx = myCandidates[myI].index;
      if (myHasPixelClearance_(myCandidateIdx, myAnchors, myXScale)) {
        myAnchors.push(myCandidateIdx);
      }
    }
    return mySortUniqueIndicesAsc_(myAnchors);
  }

  /**
   * Test whether bucket parts match a harmonic ladder step.
   * @param {Object|null} myParts - Parsed bucket parts.
   * @param {number} myStep - Minute step or day stride.
   * @param {boolean} myIsDaily - True when resolution is daily.
   * @return {boolean} True when bucket fits on the rung.
   */
  function myMatchesHarmonicRung_(myParts, myStep, myIsDaily) {
    if (!myParts) return false;
    if (myIsDaily) return (myParts.day - 1) % myStep === 0;
    return myParts.minuteOfDay % myStep === 0;
  }

  /**
   * Test whether bucket index fits harmonic rung and clears anchors.
   * @param {Array<Object|null>} myPartsList - Parsed parts aligned with labels.
   * @param {number} myIdx - Bucket index to check.
   * @param {Array<number>} myAnchors - Priority anchor indices.
   * @param {number} myStep - Harmonic step or day stride.
   * @param {boolean} myIsDaily - True when resolution is daily.
   * @param {Object} myXScale - Chart.js X scale instance.
   * @return {boolean} True when bucket should join rung candidates.
   */
  function myIsEligibleRungIndex_(myPartsList, myIdx, myAnchors, myStep, myIsDaily, myXScale) {
    if (!myMatchesHarmonicRung_(myPartsList[myIdx], myStep, myIsDaily)) return false;
    return myHasPixelClearance_(myIdx, myAnchors, myXScale);
  }

  /**
   * Collect harmonic rung candidates combined with priority anchors.
   * @param {Array<Object|null>} myPartsList - Parsed parts aligned with labels.
   * @param {Array<number>} myAnchors - Priority anchor indices.
   * @param {number} myStep - Harmonic step or day stride.
   * @param {boolean} myIsDaily - True when resolution is daily.
   * @param {Object} myXScale - Chart.js X scale instance.
   * @return {Array<number>} Sorted unique indices for this rung.
   */
  function myCollectRungCandidates_(myPartsList, myAnchors, myStep, myIsDaily, myXScale) {
    const myCandidate = myAnchors.slice();
    for (let myIdx = 0; myIdx < myPartsList.length; myIdx++) {
      if (myIsEligibleRungIndex_(myPartsList, myIdx, myAnchors, myStep, myIsDaily, myXScale)) {
        myCandidate.push(myIdx);
      }
    }
    return mySortUniqueIndicesAsc_(myCandidate);
  }

  /**
   * Get ordered harmonic ladder rungs for current chart resolution.
   * @param {boolean} myIsDaily - True when resolution is daily.
   * @return {Array<number>} Descending array of harmonic steps.
   */
  function myGetHarmonicRungs_(myIsDaily) {
    return myIsDaily ? MY_HARMONIC_DAILY_DAY_STRIDES : MY_HARMONIC_SUBDAILY_STEPS_MIN;
  }

  /**
   * Climb harmonic rungs until adjacent ticks violate MY_MIN_TICK_GAP_PX.
   * @param {Array<number>} myAnchors - Priority anchor indices.
   * @param {Object} myCalendarData - Precomputed boundaries and parts.
   * @param {Object} myXScale - Chart.js X scale instance.
   * @return {Array<number>} Best non-overlapping harmonic tick indices.
   */
  function myRefineWithHarmonicLadder_(myAnchors, myCalendarData, myXScale) {
    const myRungs = myGetHarmonicRungs_(myCalendarData.isDaily);
    let myAccepted = myAnchors;
    for (let myI = 0; myI < myRungs.length; myI++) {
      const myCandidate = myCollectRungCandidates_(
        myCalendarData.partsList,
        myAnchors,
        myRungs[myI],
        myCalendarData.isDaily,
        myXScale
      );
      if (!myHasAllNeighborClearance_(myCandidate, myXScale)) break;
      myAccepted = myCandidate;
    }
    return myAccepted;
  }

  /**
   * Collect evenly spaced bucket indices by fixed index stride.
   * @param {Array<number>} myBaseIndices - Initial accepted indices.
   * @param {number} myLabelsCount - Total number of buckets.
   * @param {number} myStepIdx - Bucket index stride.
   * @param {Object} myXScale - Chart.js X scale instance.
   * @return {Array<number>} Sorted unique indices with uniform additions.
   */
  function myCollectUniformIndices_(myBaseIndices, myLabelsCount, myStepIdx, myXScale) {
    const myResult = myBaseIndices.slice();
    for (let myIdx = myStepIdx; myIdx < myLabelsCount; myIdx += myStepIdx) {
      if (myHasPixelClearance_(myIdx, myResult, myXScale)) {
        myResult.push(myIdx);
      }
    }
    return mySortUniqueIndicesAsc_(myResult);
  }

  /**
   * Fill axis uniformly when harmonic ladder leaves at most one tick.
   * @param {Array<number>} myIndices - Indices from harmonic ladder.
   * @param {number} myLabelsCount - Total number of buckets.
   * @param {Object} myXScale - Chart.js X scale instance.
   * @return {Array<number>} Selected or uniformly filled indices.
   */
  function myApplyFallbackUniformTicks_(myIndices, myLabelsCount, myXScale) {
    if (myIndices.length > 1) return myIndices;
    const mySpanPx = Math.abs(myXScale.getPixelForValue(myLabelsCount - 1) - myXScale.getPixelForValue(0));
    if (mySpanPx < MY_MIN_TICK_GAP_PX) return myIndices;
    return myCollectUniformIndices_(
      myIndices,
      myLabelsCount,
      Math.max(1, Math.ceil((myLabelsCount - 1) / Math.floor(mySpanPx / MY_MIN_TICK_GAP_PX))),
      myXScale
    );
  }

  /**
   * Build one Chart.js tick object from current and previous parts.
   * @param {number} myIdx - Bucket index.
   * @param {Object} myCurrParts - Current bucket date parts.
   * @param {Object|null} myPrevParts - Previous visible tick date parts.
   * @param {Array<string>} myTransitions - Exact calendar transitions.
   * @return {Object} Chart.js tick descriptor.
   */
  function myCreateTickDescriptor_(myIdx, myCurrParts, myPrevParts, myTransitions) {
    return {
      value: myIdx,
      major: false,
      label: myFormatSingleVisibleTick_(myCurrParts, myPrevParts),
      myIsChange: Boolean(MY_CHANGE_TRANSITIONS[myGetTickTransitionLevel_(myCurrParts, myPrevParts)]),
      myGridTransition: myPrevParts ? myTransitions[myIdx] : MY_TICK_TRANSITION.NONE
    };
  }

  /**
   * Build sorted Chart.js tick descriptors with delta labels and styles.
   * @param {Array<number>} myIndices - Selected bucket indices.
   * @param {Object} myCalendarData - Precomputed transitions and parts.
   * @return {Array<Object>} Formatted Chart.js tick array.
   */
  function myBuildVisibleTickObjects_(myIndices, myCalendarData) {
    const myTicks = [];
    let myPrevParts = null;
    for (let myI = 0; myI < myIndices.length; myI++) {
      const myCurrParts = myCalendarData.partsList[myIndices[myI]];
      if (!myCurrParts) continue;
      myTicks.push(myCreateTickDescriptor_(myIndices[myI], myCurrParts, myPrevParts, myCalendarData.transitions));
      myPrevParts = myCurrParts;
    }
    return myTicks;
  }

  /**
   * Align X-axis ticks to calendar boundaries and harmonic sub-ticks.
   * @param {Object} myScale - Chart.js scale instance.
   * @param {Array<string>} myLabels - Full bucket label keys.
   * @param {Object} myCalendarData - Precomputed boundaries, transitions and parts.
   */
  function myApplyPostSkipDeltaTicks_(myScale, myLabels, myCalendarData) {
    if (!myScale || !myLabels.length || !myCalendarData) return;
    myScale.ticks = myBuildVisibleTickObjects_(
      myApplyFallbackUniformTicks_(
        myRefineWithHarmonicLadder_(mySelectPriorityAnchors_(myCalendarData, myScale), myCalendarData, myScale),
        myLabels.length,
        myScale
      ),
      myCalendarData
    );
  }

  /**
   * Render time-series chart for project metrics (stacked area or overlay multi-line).
   * @param {string} myCanvasId - Canvas element ID.
   * @param {Object|null} myExistingInstance - Existing Chart.js instance.
   * @param {Array<Object>} myDailySeries - Time bucket series.
   * @param {string} myProjectFieldKey - Field in bucket holding project map.
   * @param {string} [myChartMode] - STACKED or OVERLAY mode.
   * @param {Object} [myLimitOptions] - Limit line configuration.
   * @return {Object|null} New Chart.js instance.
   */
  function myRenderTimeSeriesChart_(myCanvasId, myExistingInstance, myDailySeries, myProjectFieldKey, myChartMode, myLimitOptions) {
    const myCanvas = document.getElementById(myCanvasId);
    if (!myCanvas) return null;
    const myCtx = myCanvas.getContext('2d');

    if (myExistingInstance) {
      if (myExistingInstance._myDragSelection) {
        myExistingInstance._myDragSelection = null;
      }
      myExistingInstance.destroy();
    }
    myRemoveChartRangeBadgeButtons_();

    const myIsOverlay = myChartMode === MY_CHART_MODE.OVERLAY;
    const myLabels = myDailySeries.map(function (d) { return d.dayKey || d.bucketKey; });
    const myCalendarData = myCollectCalendarBoundaries_(myLabels);

    const myProjectNames = [];
    myDailySeries.forEach(function (myDay) {
      const myMap = myDay[myProjectFieldKey];
      if (!myMap) return;
      Object.keys(myMap).forEach(function (myP) {
        if (myProjectNames.indexOf(myP) === -1) {
          myProjectNames.push(myP);
        }
      });
    });
    myProjectNames.sort();

    const myOrderedProjects = myIsOverlay ? myProjectNames : myProjectNames.slice().reverse();

    const myDatasets = myOrderedProjects.map(function (myProjName) {
      const myColor = myGetProjectColor_(myProjName);
      const myBridgeColor = myColor.border.replace('hsl(', 'hsla(').replace(')', ', 0.3)');
      const myData = myDailySeries.map(function (myDay) {
        const myMap = myDay[myProjectFieldKey];
        if (!myMap || typeof myMap[myProjName] === 'undefined') {
          return myIsOverlay ? null : 0;
        }
        return Number(myMap[myProjName].toFixed(1));
      });

      return {
        label: myProjName,
        data: myData,
        fnNames: myIsOverlay ? myDailySeries.map(function (myDay) {
          return (myDay.byProjectMaxFn && myDay.byProjectMaxFn[myProjName]) || '';
        }) : undefined,
        borderColor: myColor.border,
        backgroundColor: myIsOverlay ? 'transparent' : myColor.fill,
        fill: !myIsOverlay,
        tension: 0.1,
        borderWidth: 2,
        pointRadius: myIsOverlay ? 1 : function (myCtx) {
          return (myCtx && myCtx.raw > 0) ? (myLabels.length > 50 ? 0 : 2) : 0;
        },
        pointHoverRadius: myIsOverlay ? undefined : function (myCtx) {
          return (myCtx && myCtx.raw > 0) ? 4 : 0;
        },
        spanGaps: myIsOverlay,
        segment: myIsOverlay ? {
          borderColor: function (myCtx) {
            const myIsBridge = Boolean(
              (myCtx.p0 && myCtx.p0.skip) ||
              (myCtx.p1 && myCtx.p1.skip) ||
              (typeof myCtx.p0DataIndex === 'number' && typeof myCtx.p1DataIndex === 'number' && Math.abs(myCtx.p1DataIndex - myCtx.p0DataIndex) > 1)
            );
            return myIsBridge ? myBridgeColor : undefined;
          }
        } : {
          borderColor: function (myCtx) {
            const myVal0 = (typeof myCtx.p0DataIndex === 'number') ? myData[myCtx.p0DataIndex] : 0;
            const myVal1 = (typeof myCtx.p1DataIndex === 'number') ? myData[myCtx.p1DataIndex] : 0;
            const myIsZeroSegment = (myVal0 <= 0 && myVal1 <= 0);
            return myIsZeroSegment ? 'transparent' : undefined;
          }
        },
        stack: myIsOverlay ? undefined : 'myProjectStack',
        hidden: !!myHiddenProjects_[myProjName]
      };
    });

    if (myDatasets.length === 0) {
      myDatasets.push({
        label: 'Brak aktywności',
        data: myDailySeries.map(function () { return 0; }),
        borderColor: 'hsl(217, 91%, 60%)',
        backgroundColor: myIsOverlay ? 'transparent' : 'hsla(217, 91%, 60%, 0.1)',
        fill: !myIsOverlay,
        tension: 0.1,
        borderWidth: 2,
        pointRadius: 0
      });
    }

    if (myLimitOptions && myLabels.length > 0) {
      myDatasets.push(myBuildLimitDataset_(
        myLabels.length,
        myLimitOptions.limitValue,
        myLimitOptions.toggleId,
        myLimitOptions.label
      ));
    }

    const MY_TOOLTIP_CURSOR_OFFSET_X = 20;
    if (window.Chart && Chart.Tooltip && Chart.Tooltip.positioners) {
      Chart.Tooltip.positioners.myFollowCursor = function (myElements, myEventPosition) {
        if (!myElements || !myElements.length || !myEventPosition || typeof myEventPosition.x === 'undefined') {
          return false;
        }
        if (this.chart && this.chart._myDragSelection && this.chart._myDragSelection.isDragging) {
          return false;
        }
        const myChartArea = this.chart && this.chart.chartArea;
        const myRightBoundary = myChartArea ? myChartArea.right : ((this.chart && this.chart.width) || 800);
        const myTooltipWidth = this.width || 180;
        const myIsFlippedToLeft = (myEventPosition.x + MY_TOOLTIP_CURSOR_OFFSET_X + myTooltipWidth > myRightBoundary);
        const myOffsetX = myIsFlippedToLeft ? -MY_TOOLTIP_CURSOR_OFFSET_X : MY_TOOLTIP_CURSOR_OFFSET_X;

        return {
          x: myEventPosition.x + myOffsetX,
          y: myEventPosition.y,
          xAlign: myIsFlippedToLeft ? 'right' : 'left'
        };
      };
    }

    const myCalendarBoundaryGridPlugin = {
      id: 'myCalendarBoundaryGrid',
      beforeDatasetsDraw: function (myChart) {
        myDrawSkippedBoundaryGrid_(myChart, myCalendarData);
      }
    };

    const myVerticalGuideLinePlugin = {
      id: 'myVerticalGuideLine',
      beforeDatasetsDraw: function (myChart) {
        if (!myChart.tooltip) return;
        if (myChart._myDragSelection && myChart._myDragSelection.isDragging) return;
        const myActive = typeof myChart.tooltip.getActiveElements === 'function'
          ? myChart.tooltip.getActiveElements()
          : myChart.tooltip._active;
        if (!myActive || !myActive.length || !myActive[0].element) return;

        const myX = myActive[0].element.x;
        const myChartArea = myChart.chartArea;
        if (!myChartArea) return;

        const myCtx = myChart.ctx;
        myCtx.save();
        myCtx.beginPath();
        myCtx.moveTo(myX, myChartArea.top);
        myCtx.lineTo(myX, myChartArea.bottom);
        myCtx.lineWidth = 1;
        myCtx.setLineDash([4, 4]);
        myCtx.strokeStyle = 'hsla(215, 20%, 65%, 0.45)';
        myCtx.stroke();
        myCtx.restore();
      }
    };

    const myDragSelectionPlugin = {
      id: 'myDragSelectionPlugin',
      afterDraw: function (myChart) {
        const myDrag = myChart._myDragSelection;
        if (!myDrag || (!myDrag.isDragging && !myDrag.isFrozen)) return;

        const myArea = myChart.chartArea;
        if (!myArea) return;

        const myXScale = myChart.scales.x;
        const myLabelsList = myChart.data.labels || [];
        if (!myLabelsList.length) return;

        const myRawLeft = Math.max(myArea.left, Math.min(myDrag.startX, myDrag.currentX));
        const myRawRight = Math.min(myArea.right, Math.max(myDrag.startX, myDrag.currentX));
        if (myRawRight - myRawLeft < 3) return;

        let myStartIdx;
        let myEndIdx;

        if (myDrag.isFrozen && myDrag.startIdx !== undefined && myDrag.endIdx !== undefined) {
          myStartIdx = myDrag.startIdx;
          myEndIdx = myDrag.endIdx;
        } else {
          const myIdx1 = Math.round(myXScale.getValueForPixel(myRawLeft));
          const myIdx2 = Math.round(myXScale.getValueForPixel(myRawRight));
          myStartIdx = Math.max(0, Math.min(myLabelsList.length - 1, Math.min(myIdx1, myIdx2)));
          myEndIdx = Math.max(0, Math.min(myLabelsList.length - 1, Math.max(myIdx1, myIdx2)));
          if (myStartIdx === myEndIdx) {
            if (myEndIdx < myLabelsList.length - 1) {
              myEndIdx++;
            } else if (myStartIdx > 0) {
              myStartIdx--;
            }
          }
        }

        const myLeft = myXScale.getPixelForValue(myStartIdx);
        const myRight = myXScale.getPixelForValue(myEndIdx);
        const myWidth = myRight - myLeft;
        if (myWidth < 1) return;

        const myCtx = myChart.ctx;
        myCtx.save();

        myCtx.fillStyle = 'hsla(217, 91%, 60%, 0.18)';
        myCtx.fillRect(myLeft, myArea.top, myWidth, myArea.bottom - myArea.top);

        myCtx.strokeStyle = 'hsl(217, 91%, 60%)';
        myCtx.lineWidth = 1.5;
        myCtx.setLineDash([3, 3]);
        myCtx.beginPath();
        myCtx.moveTo(myLeft, myArea.top);
        myCtx.lineTo(myLeft, myArea.bottom);
        myCtx.moveTo(myRight, myArea.top);
        myCtx.lineTo(myRight, myArea.bottom);
        myCtx.stroke();

        if (myDrag.isFrozen) {
          const myMidY = (myArea.top + myArea.bottom) / 2;
          myCtx.fillStyle = 'hsl(217, 91%, 60%)';
          myCtx.beginPath();
          if (typeof myCtx.roundRect === 'function') {
            myCtx.roundRect(myLeft - 2, myMidY - 14, 4, 28, 2);
            myCtx.roundRect(myRight - 2, myMidY - 14, 4, 28, 2);
          } else {
            myCtx.rect(myLeft - 2, myMidY - 14, 4, 28);
            myCtx.rect(myRight - 2, myMidY - 14, 4, 28);
          }
          myCtx.fill();
        }

        if (!myDrag.isFrozen) {
          const myBadgeText = (myLabelsList[myStartIdx] || '') + ' → ' + (myLabelsList[myEndIdx] || '') + '  ↵';
          myCtx.font = '600 11px Inter, sans-serif';
          const myTextWidth = myCtx.measureText(myBadgeText).width;
          const myBadgeWidth = myTextWidth + 24;
          const myBadgeHeight = 24;
          let myBadgeX = myLeft + (myWidth - myBadgeWidth) / 2;
          myBadgeX = Math.max(myArea.left + 4, Math.min(myArea.right - myBadgeWidth - 4, myBadgeX));
          const myBadgeY = myArea.top + 8;

          myCtx.save();
          myCtx.shadowColor = 'hsla(222, 47%, 5%, 0.6)';
          myCtx.shadowBlur = 8;
          myCtx.shadowOffsetY = 3;

          myCtx.fillStyle = 'hsl(222, 40%, 15%)';
          myCtx.strokeStyle = 'hsla(217, 33%, 30%, 0.8)';
          myCtx.lineWidth = 1;
          myCtx.setLineDash([]);
          myCtx.beginPath();
          if (typeof myCtx.roundRect === 'function') {
            myCtx.roundRect(myBadgeX, myBadgeY, myBadgeWidth, myBadgeHeight, 6);
          } else {
            myCtx.rect(myBadgeX, myBadgeY, myBadgeWidth, myBadgeHeight);
          }
          myCtx.fill();
          myCtx.stroke();
          myCtx.restore();

          myCtx.fillStyle = 'hsl(210, 40%, 98%)';
          myCtx.textAlign = 'center';
          myCtx.textBaseline = 'middle';
          myCtx.fillText(myBadgeText, myBadgeX + myBadgeWidth / 2, myBadgeY + myBadgeHeight / 2);
        }

        myCtx.restore();
      }
    };

    const myChartAreaBorderPlugin = {
      id: 'myChartAreaBorder',
      afterDatasetsDraw: function (myChart) {
        const myChartArea = myChart.chartArea;
        if (!myChartArea) return;
        const myCtx = myChart.ctx;
        myCtx.save();
        myCtx.strokeStyle = 'hsla(217, 33%, 45%, 0.8)';
        myCtx.lineWidth = 1;
        myCtx.setLineDash([]);
        myCtx.strokeRect(
          Math.floor(myChartArea.left) + 0.5,
          Math.floor(myChartArea.top) + 0.5,
          Math.floor(myChartArea.width),
          Math.floor(myChartArea.height)
        );
        myCtx.restore();
      }
    };

    const myTooltipDividerPlugin = {
      id: 'myTooltipDivider',
      afterTooltipDraw: function (myChart, myArgs) {
        const myTooltip = myArgs && myArgs.tooltip;
        if (!myTooltip || myTooltip.opacity === 0) return;
        if (!myTooltip.footer || !myTooltip.footer.length) return;

        const myOpts = myTooltip.options || {};
        const myPad = (typeof myOpts.padding === 'number') ? myOpts.padding : 6;
        const myMarginTop = (typeof myOpts.footerMarginTop === 'number') ? myOpts.footerMarginTop : 8;
        const myLineHeight = 14;
        const myY = Math.round(myTooltip.y + myTooltip.height - myPad - myLineHeight - (myMarginTop / 2)) + 0.5;

        const myCtx = myChart.ctx;
        myCtx.save();
        myCtx.strokeStyle = 'hsla(217, 33%, 60%, 0.7)';
        myCtx.lineWidth = 1;
        myCtx.beginPath();
        myCtx.moveTo(myTooltip.x + myPad, myY);
        myCtx.lineTo(myTooltip.x + myTooltip.width - myPad, myY);
        myCtx.stroke();
        myCtx.restore();
      }
    };

    const MY_X_TICK_COLOR_SPECS = Object.freeze({
      CHANGE: Object.freeze({ cssVar: '--my-text-medium', fallback: 'hsl(213, 30%, 82%)' }),
      NORMAL: Object.freeze({ cssVar: '--my-text-secondary', fallback: 'hsl(215, 20%, 65%)' })
    });
    const myRootStyles = getComputedStyle(document.documentElement);
    /**
     * Resolve CSS custom property color with fallback literal.
     * @param {Object} myColorSpec - Token name and fallback color pair.
     * @return {string} Resolved CSS color string.
     */
    const myResolveXTickColor = function (myColorSpec) {
      return myRootStyles.getPropertyValue(myColorSpec.cssVar).trim() || myColorSpec.fallback;
    };
    const myXTickColors = Object.freeze({
      change: myResolveXTickColor(MY_X_TICK_COLOR_SPECS.CHANGE),
      normal: myResolveXTickColor(MY_X_TICK_COLOR_SPECS.NORMAL)
    });

    const myChartInstance = new Chart(myCtx, {
      type: 'line',
      data: {
        labels: myLabels,
        datasets: myDatasets
      },
      plugins: [myCalendarBoundaryGridPlugin, myVerticalGuideLinePlugin, myDragSelectionPlugin, myChartAreaBorderPlugin, myTooltipDividerPlugin],
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            position: 'top',
            onClick: function (myEvent, myLegendItem, myLegend) {
              const myChart = myLegend.chart;
              const myDs = myChart.data.datasets[myLegendItem.datasetIndex];
              if (!myDs || myDs.isLimitLine) return;
              const myProjName = myDs.label;
              const myIsVisible = myChart.isDatasetVisible(myLegendItem.datasetIndex);

              if (myIsVisible) {
                myHiddenProjects_[myProjName] = true;
              } else {
                delete myHiddenProjects_[myProjName];
              }
              mySaveHiddenProjects_();

              [myDailyQuotaChartInstance, myPeakDurationChartInstance].forEach(function (myInst) {
                if (!myInst) return;
                myInst.data.datasets.forEach(function (d, myIdx) {
                  if (d.label === myProjName) {
                    if (myHiddenProjects_[myProjName]) {
                      myInst.hide(myIdx);
                    } else {
                      myInst.show(myIdx);
                    }
                  }
                });
              });
            },
            labels: {
              color: 'hsl(215, 20%, 65%)',
              font: { size: 11 },
              boxWidth: myIsOverlay ? 16 : 10,
              boxHeight: myIsOverlay ? 2 : 10,
              usePointStyle: myIsOverlay,
              pointStyle: myIsOverlay ? 'line' : undefined,
              pointStyleWidth: myIsOverlay ? 16 : undefined,
              sort: function (a, b) {
                return a.text.localeCompare(b.text);
              },
              filter: function (myLegendItem, myChartData) {
                const myDs = myChartData.datasets[myLegendItem.datasetIndex];
                return !myDs || !myDs.isLimitLine;
              }
            }
          },
          tooltip: {
            position: 'myFollowCursor',
            animation: { duration: 0 },
            usePointStyle: myIsOverlay,
            boxWidth: myIsOverlay ? 14 : 10,
            boxHeight: myIsOverlay ? 14 : 10,
            itemSort: function (a, b) {
              return a.dataset.label.localeCompare(b.dataset.label);
            },
            filter: function (myTooltipItem) {
              if (!myTooltipItem.dataset || myTooltipItem.dataset.isLimitLine) return false;
              if (!myIsOverlay && (!myTooltipItem.raw || myTooltipItem.raw <= 0)) return false;
              return true;
            },
            callbacks: {
              title: function (myTooltipItems) {
                if (!myTooltipItems || !myTooltipItems.length) return '';
                return myLabels[myTooltipItems[0].dataIndex] || '';
              },
              labelPointStyle: myIsOverlay ? function () {
                return { pointStyle: 'line', rotation: 0 };
              } : undefined,
              labelColor: function (myCtxItem) {
                const myDs = myCtxItem.dataset;
                const myBorder = (myDs && myDs.borderColor) ? myDs.borderColor : 'hsl(217, 91%, 60%)';
                const myFill = (myDs && myDs.backgroundColor) ? myDs.backgroundColor : myBorder;
                return {
                  borderColor: myBorder,
                  backgroundColor: myIsOverlay ? myBorder : myFill,
                  borderWidth: 2
                };
              },
              label: function (myCtxItem) {
                if (myCtxItem.raw === null || typeof myCtxItem.raw === 'undefined') return '';
                if (!myIsOverlay && myCtxItem.raw <= 0) return null;
                if (myCtxItem.dataset && myCtxItem.dataset.isLimitLine) return null;
                const myFnName = (myIsOverlay && myCtxItem.dataset.fnNames) ? myCtxItem.dataset.fnNames[myCtxItem.dataIndex] : '';
                const myFnSuffix = myFnName ? ' (' + myFnName + ')' : '';
                return ' ' + myFormatDurationFixed_(myCtxItem.raw) + ' - ' + myCtxItem.dataset.label + myFnSuffix;
              },
              footer: function (myTooltipItems) {
                if (myIsOverlay || !myTooltipItems || !myTooltipItems.length) return '';
                let myTotalSec = 0;
                myTooltipItems.forEach(function (myIt) {
                  if (myIt && typeof myIt.raw === 'number') {
                    myTotalSec += myIt.raw;
                  }
                });
                if (myTotalSec <= 0) return '';
                return myFormatDurationFixed_(myTotalSec) + ' - Suma';
              }
            }
          }
        },
        scales: {
          x: {
            stacked: !myIsOverlay,
            grid: {
              color: function (myCtx) {
                return myGetXGridStyle_(myCtx).color;
              },
              tickColor: function (myCtx) {
                return myGetXGridStyle_(myCtx).tickColor;
              },
              lineWidth: function (myCtx) {
                return myGetXGridStyle_(myCtx).lineWidth;
              }
            },
            afterFit: function (myScale) {
              myApplyPostSkipDeltaTicks_(myScale, myLabels, myCalendarData);
            },
            ticks: {
              color: function (myCtx) {
                return (myCtx && myCtx.tick && myCtx.tick.myIsChange) ? myXTickColors.change : myXTickColors.normal;
              },
              font: function (myCtx) {
                const myIsBold = Boolean(myCtx.tick && myCtx.tick.myIsChange);
                return {
                  size: MY_TICK_FONT_SIZE_PX,
                  weight: myIsBold ? MY_TICK_FONT_WEIGHT_BOLD : MY_TICK_FONT_WEIGHT_NORMAL
                };
              },
              autoSkip: false,
              maxRotation: 0,
              minRotation: 0,
              callback: function (myVal, myIdx) {
                const myIsDaily = Boolean(myLabels[0] && myLabels[0].length <= MY_DAILY_KEY_LENGTH);
                if (myIsDaily) {
                  return myIdx === 0 ? MY_TICK_TEMPLATE_DAILY_FIRST : MY_TICK_TEMPLATE_DAILY_REST;
                }
                return myIdx === 0 ? MY_TICK_TEMPLATE_SUBDAILY_FIRST : MY_TICK_TEMPLATE_SUBDAILY_REST;
              }
            }
          },
          y: {
            stacked: !myIsOverlay,
            beginAtZero: true,
            grid: { color: 'hsla(217, 33%, 30%, 0.2)' },
            ticks: {
              color: 'hsl(215, 20%, 65%)',
              font: { size: 11 },
              callback: function (myVal) {
                const myM = Math.floor(myVal / 60);
                const myS = Math.round(myVal % 60);
                return myM + ':' + (myS < 10 ? '0' : '') + myS;
              }
            }
          }
        }
      }
    });

    myCanvas._myChartInstance = myChartInstance;
    myCanvas.style.cursor = 'crosshair';

    if (!myCanvas._myDragEventsBound) {
      myCanvas._myDragEventsBound = true;

      myCanvas.addEventListener('pointerdown', function (myEvt) {
        const myInst = myCanvas._myChartInstance;
        if (!myInst || !myInst.chartArea) return;
        const myRect = myCanvas.getBoundingClientRect();
        const myX = myEvt.clientX - myRect.left;
        const myY = myEvt.clientY - myRect.top;
        const myArea = myInst.chartArea;
        if (myX < myArea.left || myX > myArea.right || myY < myArea.top || myY > myArea.bottom) {
          return;
        }

        const myDrag = myInst._myDragSelection;

        if (myDrag && myDrag.isFrozen) {
          const myHitEdge = myGetChartSelectionEdge_(myDrag, myX);
          if (myHitEdge) {
            const myMinX = Math.min(myDrag.startX, myDrag.currentX);
            const myMaxX = Math.max(myDrag.startX, myDrag.currentX);
            myCanvas.setPointerCapture(myEvt.pointerId);
            myDrag.isDragging = true;
            myDrag.isFrozen = false;
            myDrag.isResizing = myHitEdge;
            myDrag.pointerId = myEvt.pointerId;
            myDrag.startX = (myHitEdge === 'left') ? myMaxX : myMinX;
            myDrag.currentX = myX;
            myRemoveChartRangeBadgeButtons_();
            return;
          }
        }

        myDismissChartDragSelection_();
        myCanvas.setPointerCapture(myEvt.pointerId);
        myInst._myDragSelection = {
          isDragging: true,
          isFrozen: false,
          isResizing: null,
          pointerId: myEvt.pointerId,
          startX: myX,
          currentX: myX
        };
        if (myInst.tooltip) {
          myInst.tooltip.setActiveElements([], { x: 0, y: 0 });
        }
      });

      myCanvas.addEventListener('pointermove', function (myEvt) {
        const myInst = myCanvas._myChartInstance;
        if (!myInst || !myInst.chartArea) return;
        const myRect = myCanvas.getBoundingClientRect();
        const myX = Math.max(myInst.chartArea.left, Math.min(myInst.chartArea.right, myEvt.clientX - myRect.left));
        const myDrag = myInst._myDragSelection;

        if (myDrag && myDrag.isDragging) {
          myDrag.currentX = myX;
          if (myInst.tooltip) {
            myInst.tooltip.setActiveElements([], { x: 0, y: 0 });
          }
          myInst.render();
          return;
        }

        if (myDrag && myDrag.isFrozen) {
          const myHitEdge = myGetChartSelectionEdge_(myDrag, myX);
          myCanvas.style.cursor = myHitEdge ? 'ew-resize' : 'crosshair';
          return;
        }

        myCanvas.style.cursor = 'crosshair';
      });

      const myEndDragHandler = function (myEvt) {
        const myInst = myCanvas._myChartInstance;
        if (!myInst || !myInst._myDragSelection || !myInst._myDragSelection.isDragging) return;
        const myDrag = myInst._myDragSelection;
        try {
          myCanvas.releasePointerCapture(myEvt.pointerId);
        } catch (myErr) { /* ignore */ }
        myDrag.isDragging = false;
        myDrag.isResizing = null;

        const myRect = myCanvas.getBoundingClientRect();
        const myX = Math.max(myInst.chartArea.left, Math.min(myInst.chartArea.right, myEvt.clientX - myRect.left));
        const myMinPixel = Math.min(myDrag.startX, myX);
        const myMaxPixel = Math.max(myDrag.startX, myX);
        const myDist = myMaxPixel - myMinPixel;

        const myLabelsList = myInst.data.labels || [];
        if (myDist >= 15 && myLabelsList.length > 1) {
          const myXScale = myInst.scales.x;
          const myIdx1 = Math.round(myXScale.getValueForPixel(myMinPixel));
          const myIdx2 = Math.round(myXScale.getValueForPixel(myMaxPixel));
          let myStartIdx = Math.max(0, Math.min(myLabelsList.length - 1, Math.min(myIdx1, myIdx2)));
          let myEndIdx = Math.max(0, Math.min(myLabelsList.length - 1, Math.max(myIdx1, myIdx2)));

          if (myStartIdx === myEndIdx) {
            if (myEndIdx < myLabelsList.length - 1) {
              myEndIdx++;
            } else if (myStartIdx > 0) {
              myStartIdx--;
            }
          }

          const mySnappedLeft = myXScale.getPixelForValue(myStartIdx);
          const mySnappedRight = myXScale.getPixelForValue(myEndIdx);

          myDrag.isFrozen = true;
          myDrag.startX = mySnappedLeft;
          myDrag.currentX = mySnappedRight;
          myDrag.startIdx = myStartIdx;
          myDrag.endIdx = myEndIdx;
          myCanvas.style.cursor = 'crosshair';
          myInst.render();

          myShowChartRangeBadgeButton_(myCanvas, myInst, myStartIdx, myEndIdx);
          return;
        }

        myInst._myDragSelection = null;
        myCanvas.style.cursor = 'crosshair';
        myInst.render();
      };

      myCanvas.addEventListener('pointerup', myEndDragHandler);
      myCanvas.addEventListener('pointercancel', myEndDragHandler);

      myCanvas.addEventListener('pointerleave', function () {
        const myInst = myCanvas._myChartInstance;
        if (!myInst || !myInst._myDragSelection || !myInst._myDragSelection.isDragging) {
          myCanvas.style.cursor = 'crosshair';
        }
      });
    }

    return myChartInstance;
  }

  /**
   * Determine whether horizontal coordinate hits an active selection edge.
   * @param {Object} myDrag - Selection state.
   * @param {number} myX - Pointer X coordinate.
   * @param {number} [myThreshold=8] - Hit test distance tolerance in px.
   * @return {'left'|'right'|null} Hit edge identifier or null.
   */
  function myGetChartSelectionEdge_(myDrag, myX, myThreshold = 8) {
    if (!myDrag || !myDrag.isFrozen) return null;
    const myMinX = Math.min(myDrag.startX, myDrag.currentX);
    const myMaxX = Math.max(myDrag.startX, myDrag.currentX);
    if (Math.abs(myX - myMinX) <= myThreshold) return 'left';
    if (Math.abs(myX - myMaxX) <= myThreshold) return 'right';
    return null;
  }

  /**
   * Remove any range badge buttons from DOM.
   */
  function myRemoveChartRangeBadgeButtons_() {
    document.querySelectorAll('.my-chart-range-badge').forEach(function (myEl) {
      myEl.remove();
    });
  }

  /**
   * Dismiss active drag selection and restore cursor.
   * @param {Object} [myTargetChart] - Optional chart to dismiss.
   */
  function myDismissChartDragSelection_(myTargetChart) {
    const myCharts = myTargetChart ? [myTargetChart] : [myDailyQuotaChartInstance, myPeakDurationChartInstance];
    myCharts.forEach(function (myInst) {
      if (!myInst) return;
      if (myInst.canvas) {
        myInst.canvas.style.cursor = 'crosshair';
      }
      if (myInst._myDragSelection) {
        myInst._myDragSelection = null;
        myInst.render();
      }
    });
    myRemoveChartRangeBadgeButtons_();
  }

  /**
   * Render interactive range badge button on top of frozen selection.
   * @param {HTMLCanvasElement} myCanvas - Chart canvas element.
   * @param {Object} myChart - Chart.js instance.
   * @param {number} myStartIdx - Start bucket index.
   * @param {number} myEndIdx - End bucket index.
   */
  function myShowChartRangeBadgeButton_(myCanvas, myChart, myStartIdx, myEndIdx) {
    const myWrapper = myCanvas.parentElement;
    if (!myWrapper) return;

    myRemoveChartRangeBadgeButtons_();

    const myDrag = myChart._myDragSelection;
    if (!myDrag) return;

    const myArea = myChart.chartArea;
    const myXScale = myChart.scales.x;
    const myLeft = myXScale.getPixelForValue(myStartIdx);
    const myRight = myXScale.getPixelForValue(myEndIdx);
    const myWidth = myRight - myLeft;

    const myLabelsList = myChart.data.labels || [];
    const myText = (myLabelsList[myStartIdx] || '') + ' → ' + (myLabelsList[myEndIdx] || '') + '  ↵';

    const myBtn = document.createElement('button');
    myBtn.type = 'button';
    myBtn.className = 'my-chart-range-badge';
    myBtn.title = 'Kliknij lub wciśnij Enter, aby zastosować zakres';
    myBtn.innerText = myText;

    const myCanvasWidth = myCanvas.offsetWidth || myArea.right;
    const myCenterX = myLeft + myWidth / 2;
    const myClampedLeft = Math.max(90, Math.min(myCanvasWidth - 90, myCenterX));
    myBtn.style.left = myClampedLeft + 'px';
    myBtn.style.top = (myArea.top + 8) + 'px';

    myBtn.addEventListener('pointerdown', function (myEvt) {
      myEvt.stopPropagation();
    });

    myBtn.addEventListener('click', function (myEvt) {
      myEvt.stopPropagation();
      myCommitActiveChartSelection_(myChart);
    });

    myWrapper.appendChild(myBtn);
  }

  /**
   * Commit active chart selection and apply corresponding time window.
   * @param {Object} [myTargetChart] - Optional chart instance.
   * @return {boolean} True if active selection was committed.
   */
  function myCommitActiveChartSelection_(myTargetChart) {
    const myCharts = myTargetChart ? [myTargetChart] : [myDailyQuotaChartInstance, myPeakDurationChartInstance];
    for (let myI = 0; myI < myCharts.length; myI++) {
      const myInst = myCharts[myI];
      if (myInst && myInst._myDragSelection && myInst._myDragSelection.isFrozen) {
        const myDrag = myInst._myDragSelection;
        const myLabelsList = myInst.data.labels || [];
        const myStartIdx = myDrag.startIdx;
        const myEndIdx = myDrag.endIdx;
        myDismissChartDragSelection_(myInst);
        myApplyTimeWindowFromChartIndices_(myLabelsList, myStartIdx, myEndIdx);
        return true;
      }
    }
    return false;
  }

  /**
   * Parse bucket label string into local Date instance.
   * @param {string} myKey - Bucket label key.
   * @return {Date} Date instance.
   */
  function myParseBucketKeyToDate_(myKey) {
    if (!myKey) return new Date();
    if (myKey.length === 10) {
      return new Date(myKey + 'T00:00:00');
    }
    return new Date(myKey.replace(' ', 'T') + ':00');
  }

  /**
   * Apply global time window from chart drag selection indices.
   * @param {Array<string>} myLabels - Chart x-axis label keys.
   * @param {number} myStartIdx - Start bucket index.
   * @param {number} myEndIdx - End bucket index.
   */
  function myApplyTimeWindowFromChartIndices_(myLabels, myStartIdx, myEndIdx) {
    if (!myLabels || myLabels.length === 0) return;
    const myStartBucket = myLabels[myStartIdx];
    const myEndBucket = myLabels[myEndIdx];
    if (!myStartBucket || !myEndBucket) return;

    const myStartDate = myParseBucketKeyToDate_(myStartBucket);
    let myEndDate = myParseBucketKeyToDate_(myEndBucket);

    if (myEndBucket.length === 10) {
      myEndDate.setHours(23, 59, 59, 999);
    } else {
      const myStepMs = myEffectiveChartStepMs_ || myGetClientBucketStepMs_(myGlobalResolution || '1h');
      myEndDate = new Date(myEndDate.getTime() + myStepMs - 1000);
    }

    const myNow = new Date();
    if (myEndDate.getTime() > myNow.getTime()) {
      myEndDate = myNow;
    }

    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    if (myFromEl) myFromEl.value = myToDatetimeInputValue(myStartDate);
    if (myToEl) myToEl.value = myToDatetimeInputValue(myEndDate);

    myApplyTimeWindow();
  }

  /**

  function myBindLimitToggle_(myToggleId, myGetInstance) {
    const myToggle = document.getElementById(myToggleId);
    if (!myToggle || myToggle.dataset.initialized) return;
    myToggle.dataset.initialized = 'true';
    myToggle.addEventListener('change', function () {
      const myChart = myGetInstance();

        const myLimitDs = myChart.data.datasets.find(function (d) {
          return d.isLimitLine;
        });
        if (myLimitDs) {
          myLimitDs.hidden = !myToggle.checked;
          myChart.update();
        }
      }
      mySaveViewState_();
    });

  let myGlobalFromIso = '';
  let myGlobalToIso = '';
  let myGlobalResolution = 'auto';
  let myGlobalPresetDays = 30;
  let myAppliedFromInputValue_ = '';
  let myAppliedToInputValue_ = '';
  let myLoadedSettings_ = null;

  let myCachedProcesses_ = [];

  let myClientLastSync_ = '';
  let myLastFreshnessCheckMs_ = 0;

  /**
   * Toggle dashboard loading overlay.
   * @param {boolean} myIsLoading - Loading state.
   * @param {string} [myMessage] - Optional message.
   */
  function mySetDashboardLoadingState_(myIsLoading, myMessage) {
    const myOverlay = document.getElementById('myDashboardLoadingOverlay');
    const myText = document.getElementById('myDashboardLoadingText');
    if (myText && myMessage) myText.innerText = myMessage;
    if (myOverlay) {
      if (myIsLoading) myOverlay.classList.add('my-active');
      else myOverlay.classList.remove('my-active');
    }
