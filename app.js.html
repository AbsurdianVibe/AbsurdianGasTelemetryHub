  /**
   * Save processes array and sync timestamp to localStorage.
   */
  function mySaveProcessesToStorage_() {
    try {
      localStorage.setItem(MY_STORAGE_KEY_LAST_SYNC, myClientLastSync_ || '');
      localStorage.setItem(MY_STORAGE_KEY_SETTINGS, JSON.stringify(mySettings_));
      localStorage.setItem(MY_STORAGE_KEY_PROCESSES, JSON.stringify(myCachedProcesses_));
    } catch (myErr) {
      // Ignore quota exceeded
    }
  }

  /**
   * Restore processes array from localStorage.
   * @return {boolean} True if restored.
   */
  function myRestoreProcessesFromStorage_() {
    try {
      const myRaw = localStorage.getItem(MY_STORAGE_KEY_PROCESSES);
      const mySync = localStorage.getItem(MY_STORAGE_KEY_LAST_SYNC);
      const mySettingsRaw = localStorage.getItem(MY_STORAGE_KEY_SETTINGS);
      if (mySettingsRaw) {
        mySettings_ = JSON.parse(mySettingsRaw);
        myLoadedSettings_ = {
          retentionDays: Number(mySettings_.retentionDays) || 30,
          quotaLimitSec: Number(mySettings_.quotaLimitSec) || 5400
        };
        const myRetEl = document.getElementById('myInputRetention');
        const myRetDisp = document.getElementById('myRetentionDisplay');
        const myQuotaEl = document.getElementById('myInputQuota');
        if (myRetEl) myRetEl.value = myLoadedSettings_.retentionDays;
        if (myRetDisp) myRetDisp.innerText = myLoadedSettings_.retentionDays;
        if (myQuotaEl) myQuotaEl.value = myLoadedSettings_.quotaLimitSec;
        myCheckSettingsDirtyState_();
      }
      if (myRaw) {
        myCachedProcesses_ = JSON.parse(myRaw);
        myClientLastSync_ = mySync || '';
        myUpdateCachedMaxTime_();
        myUpdateSyncStatusDisplay_(myClientLastSync_);
        return myCachedProcesses_.length > 0;
      }
    } catch (myErr) {
      myCachedProcesses_ = [];
    }
    return false;
  }

  /**
   * Prune cached processes older than retention threshold.
   */
  function myPruneClientExpiredRows_() {
    if (!mySettings_ || !mySettings_.retentionDays || !myCachedProcesses_ || myCachedProcesses_.length === 0) return;
    const myCutoffMs = Date.now() - (Number(mySettings_.retentionDays) * 86400000);
    const myInitialCount = myCachedProcesses_.length;
    myCachedProcesses_ = myCachedProcesses_.filter(function (p) {
      return new Date(p.startTime).getTime() >= myCutoffMs;
    });
    if (myCachedProcesses_.length !== myInitialCount) {
      myUpdateCachedMaxTime_();
      mySaveProcessesToStorage_();
    }
  }

  /**
   * Recalculate highest startTime in cached processes.
   */
  function myUpdateCachedMaxTime_() {
    let myMaxMs = 0;
    myCachedProcesses_.forEach(function (myP) {
      const myMs = new Date(myP.startTime).getTime();
      if (myMs > myMaxMs) myMaxMs = myMs;
    });
    myCachedMaxTime_ = myMaxMs > 0 ? new Date(myMaxMs).toISOString() : '';
  }

  /**
   * Highlight active preset button.
   * @param {number|string|null} myPresetKey - Preset key or null.
   */
  function myHighlightPresetBtn_(myPresetKey) {
    document.querySelectorAll('.my-time-presets .my-pill-btn').forEach(function (myBtn) {
      myBtn.classList.remove('my-active-preset');
    });
    if (myPresetKey) {
      const myId = (myPresetKey === 'all') ? 'myPresetBtnAll' : ('myPresetBtn' + myPresetKey + 'd');
      const myBtn = document.getElementById(myId);
      if (myBtn) myBtn.classList.add('my-active-preset');
    }
  }

  /**
   * Highlight active resolution button and refresh >1000 bucket constraints.
   * @param {string} myResKey - Resolution key.
   */
  function myHighlightResolutionBtn_(myResKey) {
    myUpdateResolutionButtonsState_(myGlobalFromIso, myGlobalToIso, myResKey);
  }

  /**
   * Persist current view state into browser localStorage.
   */
  function mySaveViewState_() {
    try {
      const myDailyToggle = document.getElementById('myToggleDailyQuotaLimitLine');
      const myPeakToggle = document.getElementById('myToggleLimitLine');
      const myState = {
        activeTab: myActiveViewName,
        presetDays: myGlobalPresetDays,
        fromIso: myGlobalFromIso,
        toIso: myGlobalToIso,
        resolution: myGlobalResolution,
        showDailyLimit: myDailyToggle ? myDailyToggle.checked : true,
        showPeakLimit: myPeakToggle ? myPeakToggle.checked : true,
        tabScrollPositions: myTabScrollPositions_
      };
      localStorage.setItem(MY_STORAGE_KEY_VIEW_STATE, JSON.stringify(myState));
    } catch (myErr) {
      // Ignore storage errors in private browsing
    }
  }

  /**
   * Restore view state from browser localStorage.
   * @return {boolean} True if state was restored.
   */
  function myRestoreViewState_() {
    try {
      const myRaw = localStorage.getItem(MY_STORAGE_KEY_VIEW_STATE);
      if (!myRaw) return false;
      const myState = JSON.parse(myRaw);
      if (!myState || typeof myState !== 'object') return false;

      let myRestored = false;

      if (myState.tabScrollPositions && typeof myState.tabScrollPositions === 'object') {
        Object.assign(myTabScrollPositions_, myState.tabScrollPositions);
      }

      if (typeof myState.showDailyLimit === 'boolean') {
        const myDailyToggle = document.getElementById('myToggleDailyQuotaLimitLine');
        if (myDailyToggle) myDailyToggle.checked = myState.showDailyLimit;
      }

      if (typeof myState.showPeakLimit === 'boolean') {
        const myPeakToggle = document.getElementById('myToggleLimitLine');
        if (myPeakToggle) myPeakToggle.checked = myState.showPeakLimit;
      }

      if (myState.resolution) {
        myGlobalResolution = myState.resolution;
        myHighlightResolutionBtn_(myGlobalResolution);
        myRestored = true;
      }

      if (myState.presetDays) {
        myGlobalPresetDays = myState.presetDays;
        const myDays = (myState.presetDays === 'all') ?
          ((mySettings_ && mySettings_.retentionDays) ? mySettings_.retentionDays : 30) :
          Number(myState.presetDays);
        const myNow = new Date();
        const myStart = new Date();
        myStart.setDate(myStart.getDate() - myDays);

        const myFromVal = myToDatetimeInputValue(myStart);
        const myToVal = myToDatetimeInputValue(myNow);

        document.getElementById('myInputTimeFrom').value = myFromVal;
        document.getElementById('myInputTimeTo').value = myToVal;

        myAppliedFromInputValue_ = myFromVal;
        myAppliedToInputValue_ = myToVal;

        myGlobalFromIso = myStart.toISOString();
        myGlobalToIso = myNow.toISOString();
        myHighlightPresetBtn_(myGlobalPresetDays);
        myRestored = true;
      } else if (myState.fromIso && myState.toIso) {
        myGlobalPresetDays = null;
        myHighlightPresetBtn_(null);
        myGlobalFromIso = myState.fromIso;
        myGlobalToIso = myState.toIso;
        const myFromVal = myToDatetimeInputValue(new Date(myGlobalFromIso));
        const myToVal = myToDatetimeInputValue(new Date(myGlobalToIso));
        document.getElementById('myInputTimeFrom').value = myFromVal;
        document.getElementById('myInputTimeTo').value = myToVal;
        myAppliedFromInputValue_ = myFromVal;
        myAppliedToInputValue_ = myToVal;
        myRestored = true;
      }

      if (myState.activeTab && ['overview', 'projects', 'settings'].includes(myState.activeTab)) {
        mySwitchView(myState.activeTab);
        myRestored = true;
      } else {
        mySwitchView('overview');
      }

      return myRestored;
    } catch (myErr) {
      return false;
    }
    return false;
  }

  /**
   * Set dynamic or manual resolution and refresh views.
   * @param {string} myResKey - Target resolution (auto, max, 1d, 1h, 30m, 15m, 5m, 1m).
   */
  function mySetResolution(myResKey) {
    const myTargetRes = myResKey || 'auto';
    if (!myIsClientResolutionAllowed_(myTargetRes, myGlobalFromIso, myGlobalToIso)) return;
    myGlobalResolution = myTargetRes;
    myUpdateResolutionButtonsState_(myGlobalFromIso, myGlobalToIso);
    mySaveViewState_();
    myRenderFromLocalCache_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
  }

  const MY_MS_PER_DAY = 86400000;
  const MY_DEFAULT_RETENTION_DAYS = 30;
  const MY_DATETIME_MASK_LENGTH = 16;
  const MY_MIN_YEAR = 1970;
  const MY_MAX_YEAR = 9999;

  /**
   * Pad number to 2 digits with leading zero.
   * @param {number} myVal - Number to pad.
   * @return {string} Padded 2-char string.
   */
  function myPadZero2_(myVal) {
    return String(myVal).padStart(2, '0');
  }

  /**
   * Pad number to 4 digits with leading zeros.
   * @param {number} myVal - Number to pad.
   * @return {string} Padded 4-char string.
   */
  function myPadZero4_(myVal) {
    return String(myVal).padStart(4, '0');
  }

  /**
   * Convert Date object to ISO local string YYYY-MM-DDTHH:mm for native picker anchors.
   * @param {Date} myDate - Date instance.
   * @return {string} ISO local datetime string.
   */
  function myToIsoDatetimeLocal_(myDate) {
    return new Date(myDate.getTime() - (myDate.getTimezoneOffset() * 60000)).toISOString().slice(0, MY_DATETIME_MASK_LENGTH);
  }

  /**
   * Convert Date object to masked input string dd.MM.yyyy HH:mm.
   * @param {Date} myDate - Date instance.
   * @return {string} Masked datetime string.
   */
  function myToDatetimeInputValue(myDate) {
    if (!myDate || isNaN(myDate.getTime())) return '';
    return myPadZero2_(myDate.getDate()) + '.' +
      myPadZero2_(myDate.getMonth() + 1) + '.' +
      myPadZero4_(myDate.getFullYear()) + ' ' +
      myPadZero2_(myDate.getHours()) + ':' +
      myPadZero2_(myDate.getMinutes());
  }

  /**
   * Parse masked string dd.MM.yyyy HH:mm or ISO string into a normalized Date object.
   * @param {string} myValStr - Input text value.
   * @return {Date|null} Parsed Date instance or null.
   */
  function myParseDatetimeInputValue_(myValStr) {
    if (!myValStr || typeof myValStr !== 'string') return null;
    const myTrimmed = myValStr.trim();
    const myMatch = /^(\d{1,2})\.(\d{1,2})\.(\d{1,4})\s+(\d{1,2}):(\d{1,2})$/.exec(myTrimmed);
    if (!myMatch) {
      const myFallback = new Date(myTrimmed);
      return isNaN(myFallback.getTime()) ? null : myFallback;
    }

    const myYear = Math.max(MY_MIN_YEAR, Math.min(MY_MAX_YEAR, Number(myMatch[3])));
    const myMonth = Math.max(1, Math.min(12, Number(myMatch[2])));
    const myMaxDay = new Date(myYear, myMonth, 0).getDate();
    const myDay = Math.max(1, Math.min(myMaxDay, Number(myMatch[1])));
    const myHour = Math.max(0, Math.min(23, Number(myMatch[4])));
    const myMin = Math.max(0, Math.min(59, Number(myMatch[5])));
    return new Date(myYear, myMonth - 1, myDay, myHour, myMin, 0, 0);
  }

  /**
   * Assign input value only when different from current DOM value.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @param {string} myNextVal - New formatted string value.
   */
  function mySetInputValueIfChanged_(myInputEl, myNextVal) {
    if (myInputEl && myInputEl.value !== myNextVal) {
      myInputEl.value = myNextVal;
    }
  }

  /**
   * Compute allowable retention window bounds in milliseconds.
   * @return {{ minMs: number, maxMs: number }} Lower and upper timestamp bounds.
   */
  function myGetRetentionWindowBoundsMs_() {
    const myMaxMs = Date.now();
    const myRetention = (mySettings_ && mySettings_.retentionDays) ? Number(mySettings_.retentionDays) : MY_DEFAULT_RETENTION_DAYS;
    return {
      minMs: myMaxMs - (myRetention * MY_MS_PER_DAY),
      maxMs: myMaxMs
    };
  }

  /**
   * Set time window inputs and refresh dashboard based on day preset.
   * @param {number|string} myDaysCount - Lookback days count or 'all'.
   */
  function mySetTimeWindowPreset(myDaysCount) {
    let myDays = myDaysCount;
    if (myDaysCount === 'all') {
      myDays = (mySettings_ && mySettings_.retentionDays) ? mySettings_.retentionDays : MY_DEFAULT_RETENTION_DAYS;
    }
    myGlobalPresetDays = myDaysCount;
    const myNow = new Date();
    const myStart = new Date();
    myStart.setDate(myStart.getDate() - Number(myDays));

    const myFromVal = myToDatetimeInputValue(myStart);
    const myToVal = myToDatetimeInputValue(myNow);

    document.getElementById('myInputTimeFrom').value = myFromVal;
    document.getElementById('myInputTimeTo').value = myToVal;

    myAppliedFromInputValue_ = myFromVal;
    myAppliedToInputValue_ = myToVal;
    myUpdateTimeWindowInputBounds_();
    myCheckTimeWindowDirtyState_();

    myHighlightPresetBtn_(myDaysCount);

    myGlobalFromIso = myStart.toISOString();
    myGlobalToIso = myNow.toISOString();
    mySaveViewState_();

    myLoadDashboard(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
    myRecordTimeWindowHistory_();
  }

  /**
   * Clamp date between lower and upper bounds.
   * @param {Date} myTargetDate - Target date.
   * @param {Date} myMinDate - Lower bound.
   * @param {Date} myMaxDate - Upper bound.
   * @return {Date} Clamped date.
   */
  function myClampDate_(myTargetDate, myMinDate, myMaxDate) {
    const myTargetMs = myTargetDate.getTime();
    if (myTargetMs < myMinDate.getTime()) return new Date(myMinDate.getTime());
    if (myTargetMs > myMaxDate.getTime()) return new Date(myMaxDate.getTime());
    return myTargetDate;
  }

  /**
   * Synchronize hidden native picker input value with its paired masked text input.
   * @param {HTMLInputElement} myInputEl - Masked text input element.
   * @param {HTMLInputElement} myPickerEl - Native datetime-local picker element.
   */
  function mySyncPickerAnchorValue_(myInputEl, myPickerEl) {
    if (!myInputEl || !myPickerEl) return;
    const myDate = myParseDatetimeInputValue_(myInputEl.value);
    if (!myDate) return;
    mySetInputValueIfChanged_(myPickerEl, myToIsoDatetimeLocal_(myDate));
  }

  /**
   * Update min, max, and current value on native picker inputs based on retention and current time.
   */
  function myUpdateTimeWindowInputBounds_() {
    const myBounds = myGetRetentionWindowBoundsMs_();
    const myMinIso = myToIsoDatetimeLocal_(new Date(myBounds.minMs));
    const myMaxIso = myToIsoDatetimeLocal_(new Date(myBounds.maxMs));

    const myPairs = [
      { inputId: 'myInputTimeFrom', pickerId: 'myPickerTimeFrom' },
      { inputId: 'myInputTimeTo', pickerId: 'myPickerTimeTo' }
    ];

    myPairs.forEach(function (myPair) {
      const myInputEl = document.getElementById(myPair.inputId);
      const myPickerEl = document.getElementById(myPair.pickerId);
      if (!myPickerEl) return;
      if (document.activeElement !== myPickerEl) {
        myPickerEl.min = myMinIso;
        myPickerEl.max = myMaxIso;
        mySyncPickerAnchorValue_(myInputEl, myPickerEl);
      }
    });
  }

  /**
   * Validate and clamp input values to allowable bounds.
   * @param {HTMLInputElement} [myActiveInputEl] - Input being edited if any.
   */
  function myValidateAndClampInputs_(myActiveInputEl) {
    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    if (!myFromEl || !myToEl) return;

    const myBounds = myGetRetentionWindowBoundsMs_();
    const myMinDate = new Date(myBounds.minMs);
    const myNowDate = new Date(myBounds.maxMs);

    let myFromDate = myParseDatetimeInputValue_(myFromEl.value);
    let myToDate = myParseDatetimeInputValue_(myToEl.value);

    if (myToDate) {
      myToDate = myClampDate_(myToDate, myMinDate, myNowDate);
      mySetInputValueIfChanged_(myToEl, myToDatetimeInputValue(myToDate));
    }

    if (myFromDate) {
      myFromDate = myClampDate_(myFromDate, myMinDate, myNowDate);
      mySetInputValueIfChanged_(myFromEl, myToDatetimeInputValue(myFromDate));
    }

    if (myFromDate && myToDate && myFromDate.getTime() > myToDate.getTime()) {
      const mySyncSourceVal = (myActiveInputEl && myActiveInputEl.id === 'myInputTimeFrom') ? myFromEl.value : myToEl.value;
      mySetInputValueIfChanged_(myFromEl, mySyncSourceVal);
      mySetInputValueIfChanged_(myToEl, mySyncSourceVal);
    }

    const myFinalFrom = myParseDatetimeInputValue_(myFromEl.value);
    const myFinalTo = myParseDatetimeInputValue_(myToEl.value);
    if (myFinalFrom) myFromEl._myLastValidDateMs = myFinalFrom.getTime();
    if (myFinalTo) myToEl._myLastValidDateMs = myFinalTo.getTime();

    myUpdateTimeWindowInputBounds_();
  }

  /**
   * Check dirty state for time window inputs.
   */
  function myCheckTimeWindowDirtyState_() {
    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    const myApplyBtn = document.getElementById('myBtnApplyTimeWindow');
    const myCancelBtn = document.getElementById('myBtnCancelTimeWindow');
    if (!myApplyBtn || !myFromEl || !myToEl) return;

    const myIsDirty = (myFromEl.value !== myAppliedFromInputValue_ || myToEl.value !== myAppliedToInputValue_);
    myApplyBtn.disabled = !myIsDirty;
    if (myCancelBtn) {
      myCancelBtn.style.display = myIsDirty ? 'inline-flex' : 'none';
    }
  }

  /**
   * Revert time window inputs to currently applied values.
   */
  function myCancelTimeWindow() {
    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    if (myFromEl) myFromEl.value = myAppliedFromInputValue_;
    if (myToEl) myToEl.value = myAppliedToInputValue_;
    if (myGlobalPresetDays) {
      myHighlightPresetBtn_(myGlobalPresetDays);
    }
    myCheckTimeWindowDirtyState_();
  }

  /**
   * Read time window inputs and apply global filter.
   */
  function myApplyTimeWindow() {
    myValidateAndClampInputs_();

    const myFromVal = document.getElementById('myInputTimeFrom').value;
    const myToVal = document.getElementById('myInputTimeTo').value;
    const myFromDate = myParseDatetimeInputValue_(myFromVal);
    const myToDate = myParseDatetimeInputValue_(myToVal);

    myGlobalPresetDays = null;
    myHighlightPresetBtn_(null);

    myGlobalFromIso = myFromDate ? myFromDate.toISOString() : '';
    myGlobalToIso = myToDate ? myToDate.toISOString() : '';

    myAppliedFromInputValue_ = myFromVal;
    myAppliedToInputValue_ = myToVal;
    myCheckTimeWindowDirtyState_();

    mySaveViewState_();
    myLoadDashboard(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
    myRecordTimeWindowHistory_();
  }

  const MY_TIME_WINDOW_HISTORY_MAX = 50;
  const myTimeWindowHistory_ = [];
  let myTimeWindowHistoryIndex_ = -1;
  let myIsNavigatingHistory_ = false;

  /**
   * Update disabled states for undo and redo buttons.
   */
  function myUpdateTimeHistoryButtons_() {
    const myBtnUndo = document.getElementById('myBtnUndoTimeWindow');
    const myBtnRedo = document.getElementById('myBtnRedoTimeWindow');
    if (myBtnUndo) {
      myBtnUndo.disabled = (myTimeWindowHistoryIndex_ <= 0);
    }
    if (myBtnRedo) {
      myBtnRedo.disabled = (myTimeWindowHistoryIndex_ >= myTimeWindowHistory_.length - 1);
    }
  }

  /**
   * Record current time window state into history stack.
   */
  function myRecordTimeWindowHistory_() {
    if (myIsNavigatingHistory_) return;

    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    const myNewState = {
      fromIso: myGlobalFromIso,
      toIso: myGlobalToIso,
      fromVal: myFromEl ? myFromEl.value : '',
      toVal: myToEl ? myToEl.value : '',
      presetDays: myGlobalPresetDays
    };

    if (myTimeWindowHistoryIndex_ >= 0) {
      const myCurrent = myTimeWindowHistory_[myTimeWindowHistoryIndex_];
      if (myCurrent && myCurrent.fromIso === myNewState.fromIso && myCurrent.toIso === myNewState.toIso) {
        return;
      }
    }

    myTimeWindowHistory_.splice(myTimeWindowHistoryIndex_ + 1);
    myTimeWindowHistory_.push(myNewState);
    if (myTimeWindowHistory_.length > MY_TIME_WINDOW_HISTORY_MAX) {
      myTimeWindowHistory_.shift();
    }
    myTimeWindowHistoryIndex_ = myTimeWindowHistory_.length - 1;
    myUpdateTimeHistoryButtons_();
  }

  /**
   * Undo to previous time window state.
   */
  function myUndoTimeWindow() {
    if (myTimeWindowHistoryIndex_ <= 0) return;
    myTimeWindowHistoryIndex_--;
    myApplyHistoryState_(myTimeWindowHistory_[myTimeWindowHistoryIndex_]);
    myUpdateTimeHistoryButtons_();
  }

  /**
   * Redo to next time window state.
   */
  function myRedoTimeWindow() {
    if (myTimeWindowHistoryIndex_ >= myTimeWindowHistory_.length - 1) return;
    myTimeWindowHistoryIndex_++;
    myApplyHistoryState_(myTimeWindowHistory_[myTimeWindowHistoryIndex_]);
    myUpdateTimeHistoryButtons_();
  }

  /**
   * Apply time window state from history stack.
   * @param {Object} myState - Historic time window snapshot.
   */
  function myApplyHistoryState_(myState) {
    if (!myState) return;
    myIsNavigatingHistory_ = true;
    try {
      myGlobalFromIso = myState.fromIso;
      myGlobalToIso = myState.toIso;
      myGlobalPresetDays = myState.presetDays;

      const myFromEl = document.getElementById('myInputTimeFrom');
      const myToEl = document.getElementById('myInputTimeTo');
      const myFromVal = myState.fromIso ? myToDatetimeInputValue(new Date(myState.fromIso)) : myState.fromVal;
      const myToVal = myState.toIso ? myToDatetimeInputValue(new Date(myState.toIso)) : myState.toVal;
      if (myFromEl) myFromEl.value = myFromVal;
      if (myToEl) myToEl.value = myToVal;

      myAppliedFromInputValue_ = myFromVal;
      myAppliedToInputValue_ = myToVal;

      myHighlightPresetBtn_(myState.presetDays);
      myUpdateTimeWindowInputBounds_();
      myCheckTimeWindowDirtyState_();

      mySaveViewState_();
      myLoadDashboard(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
    } finally {
      myIsNavigatingHistory_ = false;
    }
  }

  const MY_DATETIME_SEGMENTS = [
    { index: 0, segment: 'day', start: 0, end: 2, maxLen: 2, defaultStr: '01', label: 'Dzień (±1)' },
    { index: 1, segment: 'month', start: 3, end: 5, maxLen: 2, defaultStr: '01', label: 'Miesiąc (±1)' },
    { index: 2, segment: 'year', start: 6, end: 10, maxLen: 4, defaultStr: '2026', label: 'Rok (±1)' },
    { index: 3, segment: 'hour', start: 11, end: 13, maxLen: 2, defaultStr: '00', label: 'Godzina (±1)' },
    { index: 4, segment: 'minute', start: 14, end: 16, maxLen: 2, defaultStr: '00', label: 'Minuta (±1)' }
  ];

  let myCachedMetricsBounds_ = null;

  window.addEventListener('resize', function () {
    myCachedMetricsBounds_ = null;
  });

  /**
   * Calculate and memoize text boundary metrics using offscreen Canvas.
   * @param {HTMLInputElement} myInputEl - Reference datetime input.
   * @return {Object} Cached boundary metrics.
   */
  function myGetMetricsBounds_(myInputEl) {
    if (myCachedMetricsBounds_) return myCachedMetricsBounds_;

    const myStyle = window.getComputedStyle(myInputEl);
    const myPaddingLeft = parseFloat(myStyle.paddingLeft) || 10;

    const myCanvas = document.createElement('canvas');
    const myCtx = myCanvas.getContext('2d');
    if (myCtx) {
      myCtx.font = myStyle.font || (myStyle.fontSize + ' ' + myStyle.fontFamily);
      myCachedMetricsBounds_ = {
        paddingLeft: myPaddingLeft,
        day: myCtx.measureText('03.').width,
        month: myCtx.measureText('03.06.').width,
        year: myCtx.measureText('03.06.2020 ').width,
        hour: myCtx.measureText('03.06.2020 23:').width,
        minute: myCtx.measureText('03.06.2020 23:24').width
      };
    } else {
      myCachedMetricsBounds_ = {
        paddingLeft: myPaddingLeft,
        day: 24,
        month: 48,
        year: 88,
        hour: 116,
        minute: 148
      };
    }
    return myCachedMetricsBounds_;
  }

  /**
   * Determine targeted date segment based on mouse offsetX and text metrics.
   * @param {number} myOffsetX - Mouse X offset.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @return {Object|null} Segment definition or null.
   */
  function myGetSegmentFromOffsetX_(myOffsetX, myInputEl) {
    const myBounds = myGetMetricsBounds_(myInputEl);
    const myTextX = myOffsetX - myBounds.paddingLeft;

    if (myTextX < 0 || myTextX > myBounds.minute + 10) return null;
    if (myTextX <= myBounds.day) return MY_DATETIME_SEGMENTS[0];
    if (myTextX <= myBounds.month) return MY_DATETIME_SEGMENTS[1];
    if (myTextX <= myBounds.year) return MY_DATETIME_SEGMENTS[2];
    if (myTextX <= myBounds.hour) return MY_DATETIME_SEGMENTS[3];
    return MY_DATETIME_SEGMENTS[4];
  }

  /**
   * Resolve segment definition from text caret index (0..16).
   * @param {number} myCaretPos - Caret selectionStart index.
   * @return {Object} Segment definition object.
   */
  function myGetSegmentFromCaret_(myCaretPos) {
    const myPos = (typeof myCaretPos === 'number' && !isNaN(myCaretPos)) ? myCaretPos : 0;
    for (let myI = 0; myI < MY_DATETIME_SEGMENTS.length; myI++) {
      if (myPos <= MY_DATETIME_SEGMENTS[myI].end) {
        return MY_DATETIME_SEGMENTS[myI];
      }
    }
    return MY_DATETIME_SEGMENTS[MY_DATETIME_SEGMENTS.length - 1];
  }

  /**
   * Adjust date by segment using isolated modular arithmetic without cascading.
   * @param {Date} myDate - Target date instance.
   * @param {string} mySegment - Target segment (day, month, year, hour, minute).
   * @param {number} myDelta - Step delta (+1, -1, +5, -5).
   * @return {Date} Modified date instance.
   */
  function myAdjustDateBySegment_(myDate, mySegment, myDelta) {
    const myNewDate = new Date(myDate.getTime());

    if (mySegment === 'minute') {
      const myNextMin = ((myDate.getMinutes() + myDelta) % 60 + 60) % 60;
      myNewDate.setMinutes(myNextMin);
      return myNewDate;
    }

    if (mySegment === 'hour') {
      const myNextHour = ((myDate.getHours() + myDelta) % 24 + 24) % 24;
      myNewDate.setHours(myNextHour);
      return myNewDate;
    }

    if (mySegment === 'day') {
      const myDaysInMonth = new Date(myDate.getFullYear(), myDate.getMonth() + 1, 0).getDate();
      const myNextDay = (((myDate.getDate() - 1 + myDelta) % myDaysInMonth + myDaysInMonth) % myDaysInMonth) + 1;
      myNewDate.setDate(myNextDay);
      return myNewDate;
    }

    if (mySegment === 'month') {
      const myNextMonth = ((myDate.getMonth() + myDelta) % 12 + 12) % 12;
      const myMaxDays = new Date(myDate.getFullYear(), myNextMonth + 1, 0).getDate();
      myNewDate.setDate(1);
      myNewDate.setMonth(myNextMonth);
      myNewDate.setDate(Math.min(myDate.getDate(), myMaxDays));
      return myNewDate;
    }

    if (mySegment === 'year') {
      const myNextYear = Math.max(MY_MIN_YEAR, Math.min(MY_MAX_YEAR, myDate.getFullYear() + myDelta));
      const myMaxDays = new Date(myNextYear, myDate.getMonth() + 1, 0).getDate();
      myNewDate.setDate(1);
      myNewDate.setFullYear(myNextYear);
      myNewDate.setDate(Math.min(myDate.getDate(), myMaxDays));
      return myNewDate;
    }

    return myNewDate;
  }

  /**
   * Clamp linked [fromMs, toMs] interval while preserving constant window span.
   * @param {number} myFromMs - Candidate start timestamp.
   * @param {number} myToMs - Candidate end timestamp.
   * @param {number} mySpanMs - Fixed span in milliseconds.
   * @return {{ fromMs: number, toMs: number }} Clamped interval.
   */
  function myClampLinkedRangeMs_(myFromMs, myToMs, mySpanMs) {
    const myBounds = myGetRetentionWindowBoundsMs_();
    let myNextFromMs = myFromMs;
    let myNextToMs = myToMs;

    if (myNextToMs > myBounds.maxMs) {
      myNextToMs = myBounds.maxMs;
      myNextFromMs = myNextToMs - mySpanMs;
    }
    if (myNextFromMs < myBounds.minMs) {
      myNextFromMs = myBounds.minMs;
      myNextToMs = myNextFromMs + mySpanMs;
    }
    return { fromMs: myNextFromMs, toMs: myNextToMs };
  }

  /**
   * Sync counterpart datetime input when linked mode is active.
   * @param {HTMLInputElement} mySourceEl - Changed input element.
   */
  function mySyncLinkedTimeWindowInput_(mySourceEl) {
    if (!myIsTimeWindowLinked_) return;

    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    if (!myFromEl || !myToEl) return;

    const myOtherEl = (mySourceEl.id === 'myInputTimeFrom') ? myToEl : myFromEl;
    const myCurrDate = myParseDatetimeInputValue_(mySourceEl.value);
    const myOtherDate = myParseDatetimeInputValue_(myOtherEl.value);
    if (!myCurrDate || !myOtherDate) return;

    const myCurrMs = myCurrDate.getTime();
    const myOtherMs = myOtherDate.getTime();
    const myPrevMs = mySourceEl._myLastValidDateMs || myCurrMs;
    const myDeltaMs = myCurrMs - myPrevMs;
    mySourceEl._myLastValidDateMs = myCurrMs;

    if (myDeltaMs === 0) return;

    const mySpanMs = Math.abs(myOtherMs - myPrevMs);
    const myRawFromMs = (mySourceEl.id === 'myInputTimeFrom') ? myCurrMs : (myCurrMs - mySpanMs);
    const myRawToMs = (mySourceEl.id === 'myInputTimeFrom') ? (myCurrMs + mySpanMs) : myCurrMs;
    const myClamped = myClampLinkedRangeMs_(myRawFromMs, myRawToMs, mySpanMs);

    mySetInputValueIfChanged_(myFromEl, myToDatetimeInputValue(new Date(myClamped.fromMs)));
    mySetInputValueIfChanged_(myToEl, myToDatetimeInputValue(new Date(myClamped.toMs)));
    myFromEl._myLastValidDateMs = myClamped.fromMs;
    myToEl._myLastValidDateMs = myClamped.toMs;
  }

  /**
   * Select character range of a datetime segment and reset its typing buffer.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @param {Object} mySeg - Segment descriptor from MY_DATETIME_SEGMENTS.
   */
  function mySelectDatetimeSegment_(myInputEl, mySeg) {
    if (!myInputEl || !mySeg) return;
    myInputEl._myActiveSegmentKey = mySeg.segment;
    myInputEl._myTypedDigitsCount = 0;
    myInputEl._myDigitBuffer = '';
    myInputEl._myIsUpdatingSelection = true;
    try {
      myInputEl.setSelectionRange(mySeg.start, mySeg.end);
    } finally {
      myInputEl._myIsUpdatingSelection = false;
    }
  }

  /**
   * Replace substring inside masked input for a specific segment and keep it highlighted.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @param {Object} mySeg - Target segment descriptor.
   * @param {string} mySegStr - Replacement segment text.
   */
  function myReplaceSegmentText_(myInputEl, mySeg, mySegStr) {
    const myBase = (myInputEl.value && myInputEl.value.length === MY_DATETIME_MASK_LENGTH) ?
      myInputEl.value :
      myToDatetimeInputValue(new Date());
    myInputEl.value = myBase.slice(0, mySeg.start) + mySegStr + myBase.slice(mySeg.end);
    myInputEl._myIsUpdatingSelection = true;
    try {
      myInputEl.setSelectionRange(mySeg.start, mySeg.end);
    } finally {
      myInputEl._myIsUpdatingSelection = false;
    }
  }

  /**
   * Commit active segment, normalize calendar bounds, sync linked window, and update dirty state.
   * @param {HTMLInputElement} myInputEl - Target input element.
   */
  function myCommitDatetimeSegment_(myInputEl) {
    if (!myInputEl) return;
    myInputEl._myIsSegmentDirty = false;
    myInputEl._myTypedDigitsCount = 0;
    myInputEl._myDigitBuffer = '';

    const myParsed = myParseDatetimeInputValue_(myInputEl.value);
    if (myParsed) {
      mySetInputValueIfChanged_(myInputEl, myToDatetimeInputValue(myParsed));
    }

    mySyncLinkedTimeWindowInput_(myInputEl);
    if (!myIsTimeWindowLinked_) {
      myValidateAndClampInputs_(myInputEl);
    }

    myGlobalPresetDays = null;
    myHighlightPresetBtn_(null);
    myCheckTimeWindowDirtyState_();
  }

  /**
   * Handle digit keystroke (0-9) inside an active datetime segment.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @param {Object} mySeg - Active segment descriptor.
   * @param {string} myDigit - Typed digit character ('0'-'9').
   */
  function myHandleDatetimeDigitKey_(myInputEl, mySeg, myDigit) {
    const myNextBuffer = ((myInputEl._myDigitBuffer || '') + myDigit).slice(-mySeg.maxLen);
    const myNextCount = (myInputEl._myTypedDigitsCount || 0) + 1;
    const myPadded = myNextBuffer.padStart(mySeg.maxLen, '0');

    myInputEl._myDigitBuffer = myNextBuffer;
    myInputEl._myTypedDigitsCount = myNextCount;
    myInputEl._myIsSegmentDirty = true;
    myReplaceSegmentText_(myInputEl, mySeg, myPadded);

    if (myNextCount >= mySeg.maxLen) {
      myCommitDatetimeSegment_(myInputEl);
      const myNextIdx = Math.min(MY_DATETIME_SEGMENTS.length - 1, mySeg.index + 1);
      mySelectDatetimeSegment_(myInputEl, MY_DATETIME_SEGMENTS[myNextIdx]);
    }
  }

  /**
   * Step active segment value up or down via ArrowUp / ArrowDown keys.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @param {Object} mySeg - Active segment descriptor.
   * @param {number} myDelta - Step direction (+1 or -1).
   */
  function myHandleDatetimeStepKey_(myInputEl, mySeg, myDelta) {
    if (myInputEl._myIsSegmentDirty) {
      myCommitDatetimeSegment_(myInputEl);
    }
    const myCurrDate = myParseDatetimeInputValue_(myInputEl.value) || new Date();
    const mySteppedDate = myAdjustDateBySegment_(myCurrDate, mySeg.segment, myDelta);
    myInputEl.value = myToDatetimeInputValue(mySteppedDate);
    myCommitDatetimeSegment_(myInputEl);
    mySelectDatetimeSegment_(myInputEl, mySeg);
  }

  /**
   * Reset active segment to its default minimum value on Backspace or Delete.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @param {Object} mySeg - Active segment descriptor.
   */
  function myHandleDatetimeClearKey_(myInputEl, mySeg) {
    myInputEl._myDigitBuffer = '';
    myInputEl._myTypedDigitsCount = 0;
    myInputEl._myIsSegmentDirty = true;
    myReplaceSegmentText_(myInputEl, mySeg, mySeg.defaultStr);
  }

  /**
   * Commit segment edits and move selection highlight to an adjacent segment.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @param {Object} mySeg - Current segment descriptor.
   * @param {number} myDir - Step direction (+1 or -1).
   * @param {boolean} myForceCommit - Force commit even when segment is clean.
   */
  function myMoveSegmentSelection_(myInputEl, mySeg, myDir, myForceCommit) {
    if (myForceCommit || myInputEl._myIsSegmentDirty) {
      myCommitDatetimeSegment_(myInputEl);
    }
    mySelectDatetimeSegment_(
      myInputEl,
      MY_DATETIME_SEGMENTS[Math.max(0, Math.min(MY_DATETIME_SEGMENTS.length - 1, mySeg.index + myDir))]
    );
  }

  /**
   * Handle keyboard navigation and masked editing on datetime text input.
   * @param {KeyboardEvent} myEvt - Keyboard event.
   * @param {HTMLInputElement} myInputEl - Target input element.
   */
  function myHandleDatetimeKeydown_(myEvt, myInputEl) {
    if (myEvt.ctrlKey || myEvt.metaKey || myEvt.altKey) return;

    const mySeg = myGetSegmentFromCaret_(myInputEl.selectionStart);

    if (/^[0-9]$/.test(myEvt.key)) {
      myEvt.preventDefault();
      myHandleDatetimeDigitKey_(myInputEl, mySeg, myEvt.key);
      return;
    }

    if (myEvt.key === 'ArrowLeft' || myEvt.key === 'ArrowRight' || myEvt.key === 'Enter') {
      myEvt.preventDefault();
      myMoveSegmentSelection_(
        myInputEl,
        mySeg,
        (myEvt.key === 'ArrowLeft' || (myEvt.key === 'Enter' && myEvt.shiftKey)) ? -1 : 1,
        myEvt.key === 'Enter'
      );
      return;
    }

    if (myEvt.key === 'ArrowUp' || myEvt.key === 'ArrowDown') {
      myEvt.preventDefault();
      myHandleDatetimeStepKey_(myInputEl, mySeg, (myEvt.key === 'ArrowUp') ? 1 : -1);
      return;
    }

    if (myEvt.key === 'Tab') {
      const myNextIdx = mySeg.index + (myEvt.shiftKey ? -1 : 1);
      if (myNextIdx >= 0 && myNextIdx < MY_DATETIME_SEGMENTS.length) {
        myEvt.preventDefault();
        myMoveSegmentSelection_(myInputEl, mySeg, myEvt.shiftKey ? -1 : 1, false);
      }
      return;
    }

    if (myEvt.key === 'Backspace' || myEvt.key === 'Delete') {
      myEvt.preventDefault();
      myHandleDatetimeClearKey_(myInputEl, mySeg);
      return;
    }

    if (myEvt.key.length === 1) {
      myEvt.preventDefault();
    }
  }

  /**
   * Detect segment focus change via caret selection and trigger validation on the previous segment.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @param {boolean} [myForceHighlight] - Whether to force segment range highlight.
   */
  function myHandleDatetimeSelectionChange_(myInputEl, myForceHighlight) {
    if (!myInputEl || myInputEl._myIsUpdatingSelection || document.activeElement !== myInputEl) return;

    const myNewSeg = myGetSegmentFromCaret_(myInputEl.selectionStart);
    const myPrevKey = myInputEl._myActiveSegmentKey;

    if (myPrevKey && myPrevKey !== myNewSeg.segment) {
      if (myInputEl._myIsSegmentDirty) {
        myCommitDatetimeSegment_(myInputEl);
      }
      mySelectDatetimeSegment_(myInputEl, myNewSeg);
      return;
    }

    if (!myPrevKey || myForceHighlight) {
      mySelectDatetimeSegment_(myInputEl, myNewSeg);
    }
  }

  /**
   * Handle clipboard paste into masked datetime input.
   * @param {ClipboardEvent} myEvt - Paste event.
   * @param {HTMLInputElement} myInputEl - Target input element.
   */
  function myHandleDatetimePaste_(myEvt, myInputEl) {
    myEvt.preventDefault();
    const myRaw = (myEvt.clipboardData || window.clipboardData).getData('text');
    const myParsed = myParseDatetimeInputValue_(myRaw);
    if (!myParsed) return;

    myInputEl.value = myToDatetimeInputValue(myParsed);
    myCommitDatetimeSegment_(myInputEl);
    mySelectDatetimeSegment_(myInputEl, myGetSegmentFromCaret_(myInputEl.selectionStart));
  }

  /**
   * Handle wheel event on datetime input using mouse position heuristic.
   * Updates input field value only without triggering server filter action.
   * @param {WheelEvent} myEvt - Wheel event.
   * @param {HTMLInputElement} myInputEl - Target input element.
   */
  function myHandleDatetimeWheel_(myEvt, myInputEl) {
    const mySegmentData = myGetSegmentFromOffsetX_(myEvt.offsetX, myInputEl);
    if (!mySegmentData) return;

    myEvt.preventDefault();
    if (myInputEl._myIsSegmentDirty) {
      myCommitDatetimeSegment_(myInputEl);
    }

    const myCurrDate = myParseDatetimeInputValue_(myInputEl.value) || new Date();
    const myStep = (myEvt.shiftKey && mySegmentData.segment === 'minute') ? 5 : 1;
    const myDelta = (myEvt.deltaY < 0 ? 1 : -1) * myStep;
    const myUnclampedDate = myAdjustDateBySegment_(myCurrDate, mySegmentData.segment, myDelta);

    const myBounds = myGetRetentionWindowBoundsMs_();
    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    const myFromDate = myFromEl ? myParseDatetimeInputValue_(myFromEl.value) : null;
    const myToDate = myToEl ? myParseDatetimeInputValue_(myToEl.value) : null;
    const mySpanMs = (myFromDate && myToDate) ? (myToDate.getTime() - myFromDate.getTime()) : 0;

    if (myIsTimeWindowLinked_ && mySpanMs > 0) {
      const myRawFromMs = (myInputEl.id === 'myInputTimeFrom') ? myUnclampedDate.getTime() : (myUnclampedDate.getTime() - mySpanMs);
      const myRawToMs = (myInputEl.id === 'myInputTimeFrom') ? (myUnclampedDate.getTime() + mySpanMs) : myUnclampedDate.getTime();
      const myClamped = myClampLinkedRangeMs_(myRawFromMs, myRawToMs, mySpanMs);

      mySetInputValueIfChanged_(myFromEl, myToDatetimeInputValue(new Date(myClamped.fromMs)));
      mySetInputValueIfChanged_(myToEl, myToDatetimeInputValue(new Date(myClamped.toMs)));
      if (myFromEl) myFromEl._myLastValidDateMs = myClamped.fromMs;
      if (myToEl) myToEl._myLastValidDateMs = myClamped.toMs;
    } else {
      const myNextDate = myClampDate_(myUnclampedDate, new Date(myBounds.minMs), new Date(myBounds.maxMs));
      mySetInputValueIfChanged_(myInputEl, myToDatetimeInputValue(myNextDate));
      myInputEl._myLastValidDateMs = myNextDate.getTime();
    }

    if (document.activeElement === myInputEl) {
      mySelectDatetimeSegment_(myInputEl, mySegmentData);
    }

    myUpdateTimeWindowInputBounds_();
    myInputEl.title = 'Kółko myszy: ' + mySegmentData.label;
    myGlobalPresetDays = null;
    myHighlightPresetBtn_(null);
    myCheckTimeWindowDirtyState_();
  }

  /**
   * Update input title tooltip on mouse hover over segments.
   * @param {MouseEvent} myEvt - Mouse event.
   * @param {HTMLInputElement} myInputEl - Target input.
   */
  function myHandleDatetimeMouseMove_(myEvt, myInputEl) {
    const mySegmentData = myGetSegmentFromOffsetX_(myEvt.offsetX, myInputEl);
    if (!mySegmentData) {
      myInputEl.title = '';
      return;
    }
    myInputEl.title = 'Kółko myszy: ' + mySegmentData.label + (mySegmentData.segment === 'minute' ? ' (Shift = ±5 min)' : '');
  }

  /**
   * Propagate date chosen in native calendar picker into paired masked text input.
   * @param {HTMLInputElement} myInputEl - Paired masked text input.
   * @param {HTMLInputElement} myPickerEl - Native datetime-local picker element.
   */
  function myHandlePickerAnchorChange_(myInputEl, myPickerEl) {
    if (!myInputEl || !myPickerEl || !myPickerEl.value) return;
    const myPickedDate = new Date(myPickerEl.value);
    if (isNaN(myPickedDate.getTime())) return;
    mySetInputValueIfChanged_(myInputEl, myToDatetimeInputValue(myPickedDate));
    myCommitDatetimeSegment_(myInputEl);
  }

  /**
   * Bind masked editing, caret selection, wheel, and picker listeners to a datetime input pair.
   * @param {string} myInputId - Masked text input ID.
   * @param {string} myPickerId - Native datetime-local picker button ID.
   */
  function myBindDatetimeInputEvents_(myInputId, myPickerId) {
    const myEl = document.getElementById(myInputId);
    const myPickerEl = document.getElementById(myPickerId);
    if (!myEl) return;

    myEl.addEventListener('pointerdown', function () {
      myEl._myIsPointerSelecting = true;
    });

    myEl.addEventListener('focus', function () {
      const myParsed = myParseDatetimeInputValue_(myEl.value);
      if (myParsed) myEl._myLastValidDateMs = myParsed.getTime();
      if (!myEl._myIsPointerSelecting) {
        const myInitIdx = myEl._myFocusLastSegmentOnce ? (MY_DATETIME_SEGMENTS.length - 1) : 0;
        myEl._myFocusLastSegmentOnce = false;
        mySelectDatetimeSegment_(myEl, MY_DATETIME_SEGMENTS[myInitIdx]);
      }
    });

    myEl.addEventListener('pointerup', function () {
      myEl._myIsPointerSelecting = false;
      myHandleDatetimeSelectionChange_(myEl, true);
    });

    myEl.addEventListener('selectionchange', function () {
      if (!myEl._myIsPointerSelecting) {
        myHandleDatetimeSelectionChange_(myEl, false);
      }
    });

    myEl.addEventListener('keydown', function (myEvt) {
      myHandleDatetimeKeydown_(myEvt, myEl);
    });

    myEl.addEventListener('paste', function (myEvt) {
      myHandleDatetimePaste_(myEvt, myEl);
    });

    myEl.addEventListener('wheel', function (myEvt) {
      myHandleDatetimeWheel_(myEvt, myEl);
    }, { passive: false });

    myEl.addEventListener('mousemove', function (myEvt) {
      myHandleDatetimeMouseMove_(myEvt, myEl);
    });

    myEl.addEventListener('blur', function () {
      myEl._myIsPointerSelecting = false;
      myCommitDatetimeSegment_(myEl);
      myEl._myActiveSegmentKey = null;
    });

    if (!myPickerEl) return;

    myPickerEl.addEventListener('pointerdown', function () {
      if (myEl._myIsSegmentDirty) myCommitDatetimeSegment_(myEl);
      myUpdateTimeWindowInputBounds_();
    });

    myPickerEl.addEventListener('focus', function () {
      myUpdateTimeWindowInputBounds_();
    });

    myPickerEl.addEventListener('keydown', function (myEvt) {
      if (myEvt.key === 'Tab' && myEvt.shiftKey) {
        myEl._myFocusLastSegmentOnce = true;
      }
    });

    myPickerEl.addEventListener('input', function () {
      if (document.activeElement === myPickerEl) {
        myHandlePickerAnchorChange_(myEl, myPickerEl);
      }
    });

    myPickerEl.addEventListener('change', function () {
      myHandlePickerAnchorChange_(myEl, myPickerEl);
    });
  }

  /**
   * Attach masked input, subelement focus validation, and wheel listeners to datetime inputs.
   */
  function myInitDatetimeWheelScrubbing_() {
    myRestoreTimeWindowLinkState_();
    myBindDatetimeInputEvents_('myInputTimeFrom', 'myPickerTimeFrom');
    myBindDatetimeInputEvents_('myInputTimeTo', 'myPickerTimeTo');
  }

  /**
   * Load dashboard data from backend and populate UI.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @param {string} [myResolution] - Resolution code.
   */
  /**
   * Calculate percentile from array of numbers.
   * @param {Array<number>} myNumbers - List of numbers.
   * @param {number} myPercentile - Target percentile.
   * @return {number} Percentile value.
   */
  function myClientCalculatePercentile_(myNumbers, myPercentile) {
    if (!myNumbers || myNumbers.length === 0) return 0;
    const mySorted = myNumbers.slice().sort(function (a, b) { return a - b; });
    const myIndex = Math.ceil((myPercentile / 100) * mySorted.length) - 1;
    return Number(mySorted[Math.max(0, myIndex)].toFixed(2));
  }

  /**
   * Resolve auto resolution for client duration.
   * @param {string} myFromIso - Start ISO.
   * @param {string} myToIso - End ISO.
   * @return {string} Resolution code.
   */
  function myResolveClientAutoResolution_(myFromIso, myToIso) {
    const myFromMs = myFromIso ? new Date(myFromIso).getTime() : 0;
    const myToMs = myToIso ? new Date(myToIso).getTime() : Date.now();
    const myDiffHours = Math.max(0, (myToMs - myFromMs) / 3600000);
    if (myDiffHours > 336) return '1d';
    if (myDiffHours > 72) return '1h';
    if (myDiffHours > 24) return '30m';
    if (myDiffHours > 6) return '15m';
    if (myDiffHours > 2) return '5m';
    return '1m';
  }

  const MY_MAX_CONTINUOUS_BUCKETS = 1000;
  let myEffectiveChartStepMs_ = 3600000;

  /**
   * Parse time range bounds into millisecond timestamps.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @return {Object} Start and end millisecond bounds.
   */
  function myParseClientRangeMs_(myFromIso, myToIso) {
    const myStartMs = myFromIso ? new Date(myFromIso).getTime() : 0;
    const myEndMs = myToIso ? new Date(myToIso).getTime() : Date.now();
    return {
      startMs: isNaN(myStartMs) ? 0 : myStartMs,
      endMs: isNaN(myEndMs) ? Date.now() : myEndMs
    };
  }

  /**
   * Get bucket step in milliseconds.
   * @param {string} myResolution - Resolution code or dynamic minute string.
   * @return {number} Milliseconds.
   */
  function myGetClientBucketStepMs_(myResolution) {
    if (myResolution === '1d') return 86400000;
    if (myResolution === '1h') return 3600000;
    if (myResolution && myResolution.endsWith('m')) {
      const myMins = parseInt(myResolution, 10);
      if (!isNaN(myMins) && myMins > 0) return myMins * 60000;
    }
    return 60000;
  }

  /**
   * Count bucket intervals in time range for given fixed resolution.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @param {string} myResolution - Target resolution code.
   * @return {number} Estimated bucket interval count.
   */
  function myEstimateClientBucketSteps_(myFromIso, myToIso, myResolution) {
    const myRange = myParseClientRangeMs_(myFromIso, myToIso);
    if (!myFromIso || myRange.endMs <= myRange.startMs) return 0;
    return Math.floor((myRange.endMs - myRange.startMs) / myGetClientBucketStepMs_(myResolution));
  }

  /**
   * Check whether resolution fits MY_MAX_CONTINUOUS_BUCKETS cap in given window.
   * @param {string} myResKey - Resolution key (auto, max, 1d, 1h, 30m, 15m, 5m, 1m).
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @return {boolean} True when resolution is permitted.
   */
  function myIsClientResolutionAllowed_(myResKey, myFromIso, myToIso) {
    if (!myResKey || myResKey === 'auto' || myResKey === 'max') return true;
    return myEstimateClientBucketSteps_(myFromIso, myToIso, myResKey) <= MY_MAX_CONTINUOUS_BUCKETS;
  }

  /**
   * Resolve whole-minute step keeping bucket count within MY_MAX_CONTINUOUS_BUCKETS.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @return {number} Minute step size (at least 1).
   */
  function myResolveClientMaxStepMinutes_(myFromIso, myToIso) {
    const myRange = myParseClientRangeMs_(myFromIso, myToIso);
    if (!myFromIso || myRange.endMs <= myRange.startMs) return 1;
    return Math.max(1, Math.ceil(((myRange.endMs - myRange.startMs) / 60000) / MY_MAX_CONTINUOUS_BUCKETS));
  }

  /**
   * Resolve effective client aggregation spec for auto, max, or fixed resolution.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @param {string} [myRequestedResolution] - Requested resolution key.
   * @return {Object} Effective aggregation descriptor.
   */
  function myResolveClientAggregationSpec_(myFromIso, myToIso, myRequestedResolution) {
    const myRange = myParseClientRangeMs_(myFromIso, myToIso);
    const myRes = myRequestedResolution || 'auto';

    if (myRes === 'auto') {
      const myAutoRes = myResolveClientAutoResolution_(myFromIso, myToIso);
      return {
        resolution: myAutoRes,
        label: myAutoRes,
        stepMs: myGetClientBucketStepMs_(myAutoRes),
        originMs: myRange.startMs,
        endMs: myRange.endMs,
        hasRange: Boolean(myFromIso),
        isDynamic: false
      };
    }

    if (myRes === 'max' || myEstimateClientBucketSteps_(myFromIso, myToIso, myRes) > MY_MAX_CONTINUOUS_BUCKETS) {
      const myStepMin = myResolveClientMaxStepMinutes_(myFromIso, myToIso);
      return {
        resolution: 'max',
        label: myStepMin + 'm',
        stepMs: myStepMin * 60000,
        originMs: Math.floor(myRange.startMs / 60000) * 60000,
        endMs: myRange.endMs,
        hasRange: Boolean(myFromIso),
        isDynamic: true
      };
    }

    return {
      resolution: myRes,
      label: myRes,
      stepMs: myGetClientBucketStepMs_(myRes),
      originMs: myRange.startMs,
      endMs: myRange.endMs,
      hasRange: Boolean(myFromIso),
      isDynamic: false
    };
  }

  /**
   * Build tooltip text describing resolution button limit or Max granularity.
   * @param {string} myResKey - Resolution key.
   * @param {boolean} myIsAllowed - Whether resolution fits bucket budget.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @return {string} Tooltip text or empty string.
   */
  function myBuildResolutionTooltip_(myResKey, myIsAllowed, myFromIso, myToIso) {
    if (myResKey === 'max') {
      return 'Maksymalna rozdzielczość (~' + MY_MAX_CONTINUOUS_BUCKETS + ' punktów; obecnie ' +
        myResolveClientMaxStepMinutes_(myFromIso, myToIso) + 'm)';
    }
    if (myIsAllowed) return '';
    return 'Przekracza limit ' + MY_MAX_CONTINUOUS_BUCKETS + ' punktów (' +
      myEstimateClientBucketSteps_(myFromIso, myToIso, myResKey) + ' pkt) — wykres używa trybu Max';
  }

  /**
   * Sync visibility, disabled state, and active pill highlight on resolution bar.
   * @param {string} myFromIso - Applied window start ISO timestamp.
   * @param {string} myToIso - Applied window end ISO timestamp.
   * @param {string} [myOverrideSelected] - Optional selected key override.
   */
  function myUpdateResolutionButtonsState_(myFromIso, myToIso, myOverrideSelected) {
    const mySelectedKey = myOverrideSelected || myGlobalResolution || 'auto';
    document.querySelectorAll('.my-res-btn').forEach(function (myBtn) {
      const myResKey = myBtn.dataset.res || myBtn.id.replace('myResBtn', '').toLowerCase();
      const myIsAllowed = myIsClientResolutionAllowed_(myResKey, myFromIso, myToIso);
      const myIsSelected = myResKey === mySelectedKey;
      myBtn.classList.toggle('my-res-hidden', !myIsAllowed && !myIsSelected);
      myBtn.disabled = !myIsAllowed;
      myBtn.classList.toggle('my-active-preset', myIsSelected);
      myBtn.title = myBuildResolutionTooltip_(myResKey, myIsAllowed, myFromIso, myToIso);
    });
  }

  /**
   * Format date into fixed-calendar or origin-anchored dynamic bucket key.
   * @param {Date|string|number} myDateVal - Date value.
   * @param {string|Object} myResolutionOrSpec - Resolution code or aggregation spec.
   * @return {string} Bucket key string.
   */
  function myGetClientBucketKey_(myDateVal, myResolutionOrSpec) {
    const myDate = new Date(myDateVal);
    if (isNaN(myDate.getTime())) return '';

    if (myResolutionOrSpec && typeof myResolutionOrSpec === 'object' && myResolutionOrSpec.isDynamic) {
      const myStepIdx = Math.max(0, Math.floor((myDate.getTime() - myResolutionOrSpec.originMs) / myResolutionOrSpec.stepMs));
      const myBucketDate = new Date(myResolutionOrSpec.originMs + (myStepIdx * myResolutionOrSpec.stepMs));
      return myBucketDate.getFullYear() + '-' + myPadZero2_(myBucketDate.getMonth() + 1) + '-' +
        myPadZero2_(myBucketDate.getDate()) + ' ' + myPadZero2_(myBucketDate.getHours()) + ':' +
        myPadZero2_(myBucketDate.getMinutes());
    }

    const myResolution = (myResolutionOrSpec && typeof myResolutionOrSpec === 'object') ? myResolutionOrSpec.resolution : myResolutionOrSpec;
    const myYmd = myDate.getFullYear() + '-' + myPadZero2_(myDate.getMonth() + 1) + '-' + myPadZero2_(myDate.getDate());
    if (myResolution === '1d') return myYmd;

    const myH = myPadZero2_(myDate.getHours());
    if (myResolution === '1h') return myYmd + ' ' + myH + ':00';

    const myStep = myResolution === '30m' ? 30 : (myResolution === '15m' ? 15 : (myResolution === '5m' ? 5 : 1));
    const myBucketM = Math.floor(myDate.getMinutes() / myStep) * myStep;
    return myYmd + ' ' + myH + ':' + myPadZero2_(myBucketM);
  }

  /**
   * Pre-fill empty continuous client buckets within MY_MAX_CONTINUOUS_BUCKETS cap.
   * @param {Object} mySeriesBuckets - Mutable bucket lookup map.
   * @param {Object} mySpec - Effective aggregation spec.
   */
  function myPrefillClientSeriesBuckets_(mySeriesBuckets, mySpec) {
    if (!mySpec.hasRange || mySpec.endMs < mySpec.originMs) return;
    const myStepsCount = Math.floor((mySpec.endMs - mySpec.originMs) / mySpec.stepMs);
    if (myStepsCount < 0 || myStepsCount > MY_MAX_CONTINUOUS_BUCKETS) return;

    for (let myCurrMs = mySpec.originMs; myCurrMs <= mySpec.endMs; myCurrMs += mySpec.stepMs) {
      const myFillKey = myGetClientBucketKey_(myCurrMs, mySpec);
      if (myFillKey && !mySeriesBuckets[myFillKey]) {
        mySeriesBuckets[myFillKey] = myCreateClientSeriesBucket_(myFillKey);
      }
    }
  }

  /**
   * Initialize empty client series bucket.
   * @param {string} myBucketKey - Bucket identifier.
   * @return {Object} Empty series bucket.
   */
  function myCreateClientSeriesBucket_(myBucketKey) {
    return {
      bucketKey: myBucketKey,
      triggerSec: 0,
      totalSec: 0,
      count: 0,
      byProject: {},
      byProjectMax: {},
      byProjectMaxFn: {}
    };
  }

  /**
   * In-memory aggregation engine running in browser RAM.
   * @param {Array<Object>} myProcesses - Cached processes.
   * @param {string} myFromIso - Start ISO.
   * @param {string} myToIso - End ISO.
   * @param {string} myRequestedResolution - Resolution code.
   * @return {Object} Aggregated DTO identical to backend format.
   */
  function myAggregateClientDataset_(myProcesses, myFromIso, myToIso, myRequestedResolution) {
    const myProjects = {};
    const mySeriesBuckets = {};
    let myTotalDurationSec = 0;
    let myTotalFailures = 0;
    let myLastFullDayQuotaSec = 0;

    const myPad = function (n) { return n < 10 ? '0' + n : '' + n; };
    const myYesterday = new Date(Date.now() - 86400000);
    const myLastFullDayKey = myYesterday.getFullYear() + '-' + myPad(myYesterday.getMonth() + 1) + '-' + myPad(myYesterday.getDate());

    const mySpec = myResolveClientAggregationSpec_(myFromIso, myToIso, myRequestedResolution);
    const myEffectiveResolution = mySpec.label;

    const myFromMs = myFromIso ? new Date(myFromIso).getTime() : 0;
    const myToMs = myToIso ? new Date(myToIso).getTime() : Infinity;

    myPrefillClientSeriesBuckets_(mySeriesBuckets, mySpec);

    let myFilteredCount = 0;
    myProcesses.forEach(function (myRow) {
      const myRowTimeMs = new Date(myRow.startTime).getTime();
      const myIsFail = myRow.processStatus === 'FAILED' || myRow.processStatus === 'TIMED_OUT';
      const myIsQuotaType = myRow.processType === 'TIME_DRIVEN' || myRow.processType === 'TRIGGER';

      const myRowDate = new Date(myRow.startTime);
      const myRowDay = myRowDate.getFullYear() + '-' + myPad(myRowDate.getMonth() + 1) + '-' + myPad(myRowDate.getDate());
      if (myRowDay === myLastFullDayKey && myIsQuotaType) {
        myLastFullDayQuotaSec += myRow.durationSec;
      }

      if (myRowTimeMs < myFromMs || myRowTimeMs > myToMs) return;

      myFilteredCount++;
      myTotalDurationSec += myRow.durationSec;
      if (myIsFail) myTotalFailures++;

      // 1. Time-series bucket accumulation
      const myBucketKey = myGetClientBucketKey_(myRow.startTime, mySpec);
      if (myBucketKey) {
        if (!mySeriesBuckets[myBucketKey]) {
          mySeriesBuckets[myBucketKey] = myCreateClientSeriesBucket_(myBucketKey);
        }
        mySeriesBuckets[myBucketKey].totalSec += myRow.durationSec;
        mySeriesBuckets[myBucketKey].count++;
        const myPrevMax = mySeriesBuckets[myBucketKey].byProjectMax[myRow.projectName] || 0;
        if (myRow.durationSec >= myPrevMax) {
          mySeriesBuckets[myBucketKey].byProjectMax[myRow.projectName] = myRow.durationSec;
          mySeriesBuckets[myBucketKey].byProjectMaxFn[myRow.projectName] = myRow.functionName;
        }
        if (myIsQuotaType) {
          mySeriesBuckets[myBucketKey].triggerSec += myRow.durationSec;
          mySeriesBuckets[myBucketKey].byProject[myRow.projectName] =
            (mySeriesBuckets[myBucketKey].byProject[myRow.projectName] || 0) + myRow.durationSec;
        }
      }

      // 2. Project & function breakdown
      if (!myProjects[myRow.projectName]) {
        myProjects[myRow.projectName] = {
          projectName: myRow.projectName,
          totalSec: 0,
          count: 0,
          failCount: 0,
          functions: {}
        };
      }
      const myProj = myProjects[myRow.projectName];
      myProj.totalSec += myRow.durationSec;
      myProj.count++;
      if (myIsFail) myProj.failCount++;

      if (!myProj.functions[myRow.functionName]) {
        myProj.functions[myRow.functionName] = {
          functionName: myRow.functionName,
          totalSec: 0,
          count: 0,
          minSec: Infinity,
          maxSec: 0,
          durations: [],
          statuses: {}
        };
      }
      const myFn = myProj.functions[myRow.functionName];
      myFn.totalSec += myRow.durationSec;
      myFn.count++;
      myFn.minSec = Math.min(myFn.minSec, myRow.durationSec);
      myFn.maxSec = Math.max(myFn.maxSec, myRow.durationSec);
      myFn.durations.push(myRow.durationSec);
      myFn.statuses[myRow.processStatus] = (myFn.statuses[myRow.processStatus] || 0) + 1;
    });

    const myQuotaLimitSec = (mySettings_ && mySettings_.quotaLimitSec) ? mySettings_.quotaLimitSec : 5400;

    const myProjectsList = Object.keys(myProjects).map(function (myProjName) {
      const myP = myProjects[myProjName];
      const myFunctionsList = Object.keys(myP.functions).map(function (myFnName) {
        const myF = myP.functions[myFnName];
        return {
          functionName: myF.functionName,
          count: myF.count,
          totalSec: Number(myF.totalSec.toFixed(2)),
          avgSec: Number((myF.totalSec / myF.count).toFixed(2)),
          minSec: myF.minSec === Infinity ? 0 : Number(myF.minSec.toFixed(2)),
          maxSec: Number(myF.maxSec.toFixed(2)),
          p95Sec: myClientCalculatePercentile_(myF.durations, 95),
          statuses: myF.statuses
        };
      }).sort(function (a, b) { return b.totalSec - a.totalSec; });

      return {
        projectName: myP.projectName,
        totalSec: Number(myP.totalSec.toFixed(2)),
        count: myP.count,
        failCount: myP.failCount,
        functions: myFunctionsList
      };
    }).sort(function (a, b) { return b.totalSec - a.totalSec; });

    const mySeriesList = Object.keys(mySeriesBuckets).sort().map(function (myK) {
      const myItem = mySeriesBuckets[myK];
      return {
        dayKey: myItem.bucketKey,
        bucketKey: myItem.bucketKey,
        triggerSec: Number(myItem.triggerSec.toFixed(1)),
        totalSec: Number(myItem.totalSec.toFixed(1)),
        count: myItem.count,
        percentUsed: Number(((myItem.triggerSec / myQuotaLimitSec) * 100).toFixed(1)),
        byProject: myItem.byProject,
        byProjectMax: myItem.byProjectMax,
        byProjectMaxFn: myItem.byProjectMaxFn
      };
    });

    const myLastFullDayQuotaPercent = Number(((myLastFullDayQuotaSec / myQuotaLimitSec) * 100).toFixed(1));

    return {
      summary: {
        totalRuns: myFilteredCount,
        totalDurationSec: Number(myTotalDurationSec.toFixed(1)),
        totalFailures: myTotalFailures,
        failureRate: myFilteredCount > 0 ? Number(((myTotalFailures / myFilteredCount) * 100).toFixed(1)) : 0,
        todayQuotaSec: Number(myLastFullDayQuotaSec.toFixed(1)),
        todayQuotaLimitSec: myQuotaLimitSec,
        todayQuotaPercent: myLastFullDayQuotaPercent,
        lastFullDayKey: myLastFullDayKey,
        lastFullDayQuotaSec: Number(myLastFullDayQuotaSec.toFixed(1)),
        lastFullDayQuotaPercent: myLastFullDayQuotaPercent
      },
      dailySeries: mySeriesList,
      resolution: myRequestedResolution || 'auto',
      effectiveResolution: myEffectiveResolution,
      effectiveStepMs: mySpec.stepMs,
      projects: myProjectsList
    };
  }

  /**
   * Update sync status display below manual sync button.
   * @param {string} [myTimestampIso] - ISO timestamp of last sync.
   * @param {string} [myErrorMessage] - Optional error message to display.
   */
  function myUpdateSyncStatusDisplay_(myTimestampIso, myErrorMessage) {
    const myStatusEl = document.getElementById('mySyncStatus');
    if (!myStatusEl) return;
    if (myErrorMessage) {
      myStatusEl.innerHTML = 'Ostatnia synchronizacja:<br><span style="color: var(--my-danger);">' + myErrorMessage + '</span>';
      return;
    }
    if (myTimestampIso) {
      const myDateStr = new Date(myTimestampIso).toLocaleString('pl-PL');
      myStatusEl.innerHTML = 'Ostatnia synchronizacja:<br><span>' + myDateStr + '</span>';
      return;
    }
    myStatusEl.innerHTML = 'Ostatnia synchronizacja:<br><span style="color: var(--my-text-muted);">Brak danych</span>';
  }

  /**
   * Render dashboard views using local in-memory dataset in 0 ms.
   * @param {string} myFromIso - Start ISO.
   * @param {string} myToIso - End ISO.
   * @param {string} [myResolution] - Target resolution.
   */
  function myRenderFromLocalCache_(myFromIso, myToIso, myResolution) {
    const myTargetFromIso = myFromIso || myGlobalFromIso;
    const myTargetToIso = myToIso || myGlobalToIso;
    myUpdateResolutionButtonsState_(myTargetFromIso, myTargetToIso);

    const myAggregated = myAggregateClientDataset_(
      myCachedProcesses_,
      myTargetFromIso,
      myTargetToIso,
      myResolution || myGlobalResolution
    );
    myEffectiveChartStepMs_ = myAggregated.effectiveStepMs || myGetClientBucketStepMs_(myAggregated.effectiveResolution);

    const myChartTitle = document.getElementById('myChartSectionTitle');
    if (myChartTitle) {
      myChartTitle.innerText = 'Miks zużycia kwoty wyzwalaczy per projekt (ziarnistość: ' + myAggregated.effectiveResolution + ')';
    }
    const myPeakTitle = document.getElementById('myChartPeakDurationTitle');
    if (myPeakTitle) {
      myPeakTitle.innerText = 'Maksymalny czas pojedynczego wykonania per projekt (ziarnistość: ' + myAggregated.effectiveResolution + ')';
    }

    const myDailyQuotaLimitBadge = document.getElementById('myChartDailyQuotaLimitBadge');
    if (myDailyQuotaLimitBadge) {
      const myLimitSec = (myLoadedSettings_ && myLoadedSettings_.quotaLimitSec) || (mySettings_ && mySettings_.quotaLimitSec) || 5400;
      const myLimitMin = Math.round(myLimitSec / 60);
      myDailyQuotaLimitBadge.innerText = 'Limit GAS: ' + myLimitMin + 'm / doba (' + myLimitSec + 's)';
    }

    if (myAggregated.projects) {
      myAggregated.projects.map(function (p) { return p.projectName; }).sort().forEach(function (pName) {
        myGetProjectColor_(pName);
      });
    }

    myRenderKpis(myAggregated.summary);
    myRenderDailyChart(myAggregated.dailySeries);
    myRenderPeakDurationChart(myAggregated.dailySeries);
    myRenderProjectsTable(myAggregated.projects);

    myUpdateSyncStatusDisplay_(myClientLastSync_);
  }

  /**
   * Check telemetry freshness on backend, merge delta if available, and render in-memory.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @param {string} [myResolution] - Target resolution.
   */
  async function myEnsureFreshnessAndRender_(myFromIso, myToIso, myResolution) {
    const myTargetToMs = myToIso ? new Date(myToIso).getTime() : Date.now();
    const myCachedMaxMs = myCachedMaxTime_ ? new Date(myCachedMaxTime_).getTime() : 0;
    const myNow = Date.now();

    const myTouchesPresent = myTargetToMs >= myCachedMaxMs;
    const myShouldCheckFreshness = myTouchesPresent && (myNow - myLastFreshnessCheckMs_ > 60000);

    if (myShouldCheckFreshness) {
      try {
        myLastFreshnessCheckMs_ = myNow;
        const myFreshness = await myCallServer('myApiCheckTelemetryFreshness', myClientLastSync_);
        if (myFreshness && myFreshness.isStale) {
          const myDeltaRes = await myCallServer('myApiGetDeltaProcesses', myCachedMaxTime_);
          if (myDeltaRes && myDeltaRes.delta && myDeltaRes.delta.length > 0) {
            const myExistingKeys = {};
            myCachedProcesses_.forEach(function (p) { myExistingKeys[p.key] = true; });
            myDeltaRes.delta.forEach(function (p) {
              if (!myExistingKeys[p.key]) {
                myCachedProcesses_.push(p);
                myExistingKeys[p.key] = true;
              }
            });
            myUpdateCachedMaxTime_();
            myClientLastSync_ = myDeltaRes.lastCollectionTime || myFreshness.serverLastSync;
            mySaveProcessesToStorage_();
          } else if (myFreshness.serverLastSync) {
            myClientLastSync_ = myFreshness.serverLastSync;
            mySaveProcessesToStorage_();
          }
        }
      } catch (myErr) {
        console.warn('Freshness check failed, rendering from memory:', myErr);
      }
    }

    myRenderFromLocalCache_(myFromIso, myToIso, myResolution);
  }

  /**
   * Bootstrap full initial dataset from server with visual loading overlay.
   * @param {string} myFromIso - Target from ISO.
   * @param {string} myToIso - Target to ISO.
   * @param {string} [myResolution] - Target resolution.
   */
  async function myBootstrapInitialDataset_(myFromIso, myToIso, myResolution) {
    myUpdateResolutionButtonsState_(myFromIso || myGlobalFromIso, myToIso || myGlobalToIso);
    mySetDashboardLoadingState_(true, 'Pobieranie bazy procesów z arkusza...');
    try {
      const myRes = await myCallServer('myApiGetInitialDataset');
      myCachedProcesses_ = myRes.processes || [];
      if (myRes.settings) {
        mySettings_ = myRes.settings;
        myLoadedSettings_ = {
          retentionDays: Number(mySettings_.retentionDays) || 30,
          quotaLimitSec: Number(mySettings_.quotaLimitSec) || 5400
        };
        const myRetEl = document.getElementById('myInputRetention');
        const myRetDisp = document.getElementById('myRetentionDisplay');
        const myQuotaEl = document.getElementById('myInputQuota');
        if (myRetEl) myRetEl.value = myLoadedSettings_.retentionDays;
        if (myRetDisp) myRetDisp.innerText = myLoadedSettings_.retentionDays;
        if (myQuotaEl) myQuotaEl.value = myLoadedSettings_.quotaLimitSec;
        myUpdateTimeWindowInputBounds_();
        myCheckSettingsDirtyState_();
      }
      myClientLastSync_ = myRes.lastCollectionTime || myRes.lastSync || '';
      myUpdateCachedMaxTime_();
      mySaveProcessesToStorage_();

      if (myGlobalPresetDays === 'all') {
        const myAllDays = (mySettings_ && mySettings_.retentionDays) ? mySettings_.retentionDays : 30;
        const myNow = new Date();
        const myStart = new Date();
        myStart.setDate(myStart.getDate() - myAllDays);
        myGlobalFromIso = myStart.toISOString();
        myGlobalToIso = myNow.toISOString();
        const myFromEl = document.getElementById('myInputTimeFrom');
        const myToEl = document.getElementById('myInputTimeTo');
        if (myFromEl) myFromEl.value = myToDatetimeInputValue(myStart);
        if (myToEl) myToEl.value = myToDatetimeInputValue(myNow);
        myAppliedFromInputValue_ = myFromEl ? myFromEl.value : '';
        myAppliedToInputValue_ = myToEl ? myToEl.value : '';
        myCheckTimeWindowDirtyState_();
      }

      myRenderFromLocalCache_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
    } catch (myErr) {
      console.error('Error bootstrapping initial dataset:', myErr);
      myUpdateSyncStatusDisplay_(null, 'Błąd pobierania: ' + myErr.message);
    } finally {
      mySetDashboardLoadingState_(false);
    }
  }

  /**
   * Load dashboard data. Uses local memory cache if present, otherwise bootstraps initial dataset.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @param {string} [myResolution] - Resolution code.
   */
  async function myLoadDashboard(myFromIso, myToIso, myResolution) {
    myUpdateResolutionButtonsState_(myFromIso || myGlobalFromIso, myToIso || myGlobalToIso);
    if (myCachedProcesses_ && myCachedProcesses_.length > 0) {
      await myEnsureFreshnessAndRender_(myFromIso, myToIso, myResolution);
      return;
    }
    await myBootstrapInitialDataset_(myFromIso, myToIso, myResolution);
  }

  /**
   * Trigger manual telemetry collection and refresh views.
   */
  async function myHandleManualSync() {
    const myBtn = document.getElementById('myBtnSyncNow');
    const mySpinnerText = document.getElementById('mySyncBtnText');

    myBtn.disabled = true;
    myBtn.classList.add('my-loading');
    mySpinnerText.innerText = 'Pobieranie procesów...';

    try {
      const myRes = await myCallServer('myApiTriggerManualSync');
      myCachedProcesses_ = myRes.processes || [];
      if (myRes.settings) {
        mySettings_ = myRes.settings;
      }
      myClientLastSync_ = myRes.lastCollectionTime || myRes.lastSync || '';
      myUpdateCachedMaxTime_();
      mySaveProcessesToStorage_();

      myRenderFromLocalCache_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
    } catch (myErr) {
      alert('Błąd synchronizacji: ' + myErr.message);
    } finally {
      myBtn.disabled = false;
      myBtn.classList.remove('my-loading');
      mySpinnerText.innerText = 'Synchronizuj teraz';
    }
  }

  /**
   * Check dirty state for configuration settings inputs.
   */
  function myCheckSettingsDirtyState_() {
    const myRetentionEl = document.getElementById('myInputRetention');
    const myQuotaEl = document.getElementById('myInputQuota');
    const mySaveBtn = document.getElementById('myBtnSaveSettings');
    const myCancelBtn = document.getElementById('myBtnCancelSettings');
    if (!myRetentionEl || !myQuotaEl || !mySaveBtn) return;

    const myCurrentRetention = Number(myRetentionEl.value);
    const myCurrentQuota = Number(myQuotaEl.value);

    const myIsDirty = !myLoadedSettings_ || (
      myCurrentRetention !== myLoadedSettings_.retentionDays ||
      myCurrentQuota !== myLoadedSettings_.quotaLimitSec
    );

    mySaveBtn.disabled = !myIsDirty;
    if (myCancelBtn) {
      myCancelBtn.style.display = myIsDirty ? 'inline-flex' : 'none';
    }
  }

  /**
   * Revert settings form inputs to last loaded baseline values.
   */
  function myCancelSettings() {
    if (!myLoadedSettings_) return;
    const myRetentionEl = document.getElementById('myInputRetention');
    const myQuotaEl = document.getElementById('myInputQuota');
    if (myRetentionEl) {
      myRetentionEl.value = myLoadedSettings_.retentionDays;
      document.getElementById('myRetentionDisplay').innerText = myLoadedSettings_.retentionDays;
    }
    if (myQuotaEl) {
      myQuotaEl.value = myLoadedSettings_.quotaLimitSec;
    }
    myCheckSettingsDirtyState_();
  }

  /**
   * Save configuration settings to backend.
   */
  async function myHandleSaveSettings() {
    const myRetention = Number(document.getElementById('myInputRetention').value);
    const myQuota = Number(document.getElementById('myInputQuota').value);
    const mySaveBtn = document.getElementById('myBtnSaveSettings');

    mySaveBtn.disabled = true;
    mySaveBtn.innerText = 'Zapisywanie...';

    try {
      await myCallServer('myApiUpdateSettings', {
        retentionDays: myRetention,
        quotaLimitSec: myQuota
      });
      myLoadedSettings_ = {
        retentionDays: myRetention,
        quotaLimitSec: myQuota
      };
      myUpdateTimeWindowInputBounds_();
      myValidateAndClampInputs_();
      myCheckSettingsDirtyState_();
      alert('Ustawienia zapisane pomyślnie.');
      myLoadDashboard(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
    } catch (myErr) {
      alert('Błąd zapisu ustawień: ' + myErr.message);
    } finally {
      mySaveBtn.innerText = 'Zapisz ustawienia';
      myCheckSettingsDirtyState_();
    }
  }

  /**
   * Ensure keyboard focus is captured by the application iframe.
   */
  function myEnsureWindowFocus_() {
    try {
      window.focus();
      if (document.body) {
        document.body.focus();
      }
    } catch (myErr) {
      // Ignore cross-origin frame focus restrictions
    }
  }

  const MY_NAV_TABS_LIST = ['overview', 'projects', 'settings'];

  /**
   * Initialize custom keyboard navigation (PageUp/PageDown for cards, ArrowLeft/ArrowRight for tabs).
   */
  function myInitKeyboardNavigation_() {
    const myKeyHandler = function (myEvent) {
      const myActiveEl = document.activeElement;
      if (myActiveEl && (
        myActiveEl.tagName === 'INPUT' ||
        myActiveEl.tagName === 'TEXTAREA' ||
        myActiveEl.tagName === 'SELECT' ||
        myActiveEl.isContentEditable
      )) {
        return;
      }

      if (myEvent.ctrlKey || myEvent.metaKey) {
        if ((myEvent.key === 'z' || myEvent.key === 'Z') && !myEvent.shiftKey) {
          myEvent.preventDefault();
          myUndoTimeWindow();
          return;
        }
        if ((myEvent.key === 'y' || myEvent.key === 'Y') || ((myEvent.key === 'z' || myEvent.key === 'Z') && myEvent.shiftKey)) {
          myEvent.preventDefault();
          myRedoTimeWindow();
          return;
        }
      }

      if (myEvent.key === 'Escape') {
        myDismissChartDragSelection_();
        return;
      }

      if (myEvent.key === 'Enter') {
        if (myCommitActiveChartSelection_()) {
          myEvent.preventDefault();
          return;
        }
      }

      const myAllowedKeys = ['PageDown', 'PageUp', 'ArrowLeft', 'ArrowRight'];
      if (!myAllowedKeys.includes(myEvent.key)) return;

      if (myEvent.key === 'ArrowRight' || myEvent.key === 'ArrowLeft') {
        const myCurrentIdx = MY_NAV_TABS_LIST.indexOf(myActiveViewName);
        if (myCurrentIdx === -1) return;
        const myStep = (myEvent.key === 'ArrowRight') ? 1 : -1;
        const myNextIdx = myCurrentIdx + myStep;
        if (myNextIdx < 0 || myNextIdx >= MY_NAV_TABS_LIST.length) {
          return;
        }
        myEvent.preventDefault();
        mySwitchView(MY_NAV_TABS_LIST[myNextIdx]);
        return;
      }

      const myActiveView = document.querySelector('.my-view.my-active');
      if (!myActiveView) return;

      const myCards = Array.from(myActiveView.querySelectorAll('.my-card')).filter(function (myCard) {
        return myCard.offsetParent !== null;
      });
      if (myCards.length === 0) return;

      const myThreshold = 35;

      if (myEvent.key === 'PageDown') {
        const myNextCard = myCards.find(function (myCard) {
          return myCard.getBoundingClientRect().top > myThreshold;
        });
        if (myNextCard) {
          myEvent.preventDefault();
          myNextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } else if (myEvent.key === 'PageUp') {
        const myPrevCards = myCards.filter(function (myCard) {
          return myCard.getBoundingClientRect().top < -myThreshold;
        });
        myEvent.preventDefault();
        if (myPrevCards.length > 0) {
          const myPrevCard = myPrevCards[myPrevCards.length - 1];
          myPrevCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
    };

    window.addEventListener('keydown', myKeyHandler, true);
  }

  // Initial load
  document.addEventListener('DOMContentLoaded', function () {
    myRestoreProjectColors_();
    myRestoreHiddenProjects_();
    myInitDatetimeWheelScrubbing_();
    myInitLimitLineToggles_();
    myInitKeyboardNavigation_();
    myEnsureWindowFocus_();

    [100, 400, 1000].forEach(function (myDelay) {
      setTimeout(myEnsureWindowFocus_, myDelay);
    });

    window.addEventListener('load', myEnsureWindowFocus_);
    window.addEventListener('pointerenter', myEnsureWindowFocus_);
    window.addEventListener('mousemove', function myFocusOnFirstMove_() {
      myEnsureWindowFocus_();
      window.removeEventListener('mousemove', myFocusOnFirstMove_);
    });

    const myHasCachedData = myRestoreProcessesFromStorage_();
    const myHasRestoredView = myRestoreViewState_();
    if (!myHasRestoredView) {
      mySetTimeWindowPreset(30);
    } else {
      myRecordTimeWindowHistory_();
    }
    myUpdateTimeWindowInputBounds_();
    myValidateAndClampInputs_();
    if (myHasCachedData) {
      myPruneClientExpiredRows_();
      if (myCachedProcesses_.length > 0) {
        myRenderFromLocalCache_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
        myEnsureFreshnessAndRender_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
        return;
      }
    }
    myBootstrapInitialDataset_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
  });

</script>
