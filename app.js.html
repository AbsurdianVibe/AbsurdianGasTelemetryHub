<script>
  /**
   * Client-side application controller for Absurdian Gas Telemetry Hub.
   */

  let myDailyQuotaChartInstance = null;
  let myProjectsShareChartInstance = null;
  let myActiveViewName = 'overview';

  /**
   * Promise wrapper for google.script.run server calls.
   * @param {string} myMethodName - Remote function name.
   * @param {...*} myArgs - Arguments to pass.
   * @return {Promise<*>} Server response promise.
   */
  function myCallServer(myMethodName, ...myArgs) {
    return new Promise(function (myResolve, myReject) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        myReject(new Error('google.script.run is not available in local mode.'));
        return;
      }
      const myRunner = google.script.run
        .withSuccessHandler(myResolve)
        .withFailureHandler(myReject);
      myRunner[myMethodName].apply(myRunner, myArgs);
    });
  }

  /**
   * Switch active navigation tab and section.
   * @param {string} myTabKey - Target tab key.
   */
  function mySwitchView(myTabKey) {
    myActiveViewName = myTabKey;
    ['overview', 'projects', 'settings'].forEach(function (myKey) {
      const myNavBtn = document.getElementById('myNavTab' + myKey.charAt(0).toUpperCase() + myKey.slice(1));
      const myViewSec = document.getElementById('myView' + myKey.charAt(0).toUpperCase() + myKey.slice(1));
      if (myKey === myTabKey) {
        if (myNavBtn) myNavBtn.classList.add('my-active');
        if (myViewSec) myViewSec.classList.add('my-active');
      } else {
        if (myNavBtn) myNavBtn.classList.remove('my-active');
        if (myViewSec) myViewSec.classList.remove('my-active');
      }
    });

    const myTimeBar = document.getElementById('myTimeWindowBar');
    if (myTimeBar) {
      myTimeBar.style.display = (myTabKey === 'settings') ? 'none' : 'flex';
    }

    mySaveViewState_();
  }

  /**
   * Format duration in seconds to human readable string.
   * @param {number} mySec - Duration in seconds.
   * @return {string} Formatted duration.
   */
  function myFormatDurationClient(mySec) {
    if (!mySec || isNaN(mySec)) return '0.0s';
    if (mySec < 60) return mySec.toFixed(1) + 's';
    const myMins = Math.floor(mySec / 60);
    const myRemainder = (mySec % 60).toFixed(0);
    if (myMins < 60) return myMins + 'm ' + myRemainder + 's';
    return Math.floor(myMins / 60) + 'h ' + (myMins % 60) + 'm';
  }

  /**
   * Render KPI summary cards and progress bars.
   * @param {Object} mySummary - Summary metrics object.
   */
  function myRenderKpis(mySummary) {
    const myQuotaPct = mySummary.todayQuotaPercent || 0;
    const myQuotaBadge = document.getElementById('myKpiQuotaBadge');
    const myQuotaVal = document.getElementById('myKpiQuotaVal');
    const myQuotaBar = document.getElementById('myKpiQuotaBar');

    myQuotaVal.innerText = mySummary.todayQuotaSec + 's (' + myQuotaPct + '%)';
    myQuotaBadge.innerText = myQuotaPct + '%';
    myQuotaBar.style.width = Math.min(100, myQuotaPct) + '%';

    myQuotaBar.className = 'my-progress-fill';
    myQuotaBadge.className = 'my-badge';
    if (myQuotaPct >= 90) {
      myQuotaBar.classList.add('my-crit');
      myQuotaBadge.classList.add('my-badge-danger');
    } else if (myQuotaPct >= 70) {
      myQuotaBar.classList.add('my-warn');
      myQuotaBadge.classList.add('my-badge-danger');
    } else {
      myQuotaBadge.classList.add('my-badge-success');
    }

    document.getElementById('myKpiTotalDurationVal').innerText = myFormatDurationClient(mySummary.totalDurationSec);
    document.getElementById('myKpiTotalRunsVal').innerText = mySummary.totalRuns.toLocaleString();
    document.getElementById('myKpiFailureRateVal').innerText = mySummary.failureRate + '%';
    document.getElementById('myKpiFailureRateSub').innerText = mySummary.totalFailures + ' awarii / timeoutów';
  }

  const MY_CHART_COLOR_PALETTE = Object.freeze([
    { fill: 'hsla(217, 91%, 60%, 0.45)', border: 'hsl(217, 91%, 60%)' },
    { fill: 'hsla(142, 71%, 45%, 0.45)', border: 'hsl(142, 71%, 45%)' },
    { fill: 'hsla(260, 80%, 65%, 0.45)', border: 'hsl(260, 80%, 65%)' },
    { fill: 'hsla(38, 92%, 50%, 0.45)', border: 'hsl(38, 92%, 50%)' },
    { fill: 'hsla(330, 80%, 60%, 0.45)', border: 'hsl(330, 80%, 60%)' },
    { fill: 'hsla(180, 70%, 45%, 0.45)', border: 'hsl(180, 70%, 45%)' }
  ]);

  /**
   * Render stacked area time-series chart for project metrics.
   * @param {string} myCanvasId - Canvas element ID.
   * @param {Object|null} myExistingInstance - Existing Chart.js instance.
   * @param {Array<Object>} myDailySeries - Time bucket series.
   * @param {string} myProjectFieldKey - Field in bucket holding project map.
   * @return {Object|null} New Chart.js instance.
   */
  function myRenderStackedTimeSeriesChart_(myCanvasId, myExistingInstance, myDailySeries, myProjectFieldKey) {
    const myCanvas = document.getElementById(myCanvasId);
    if (!myCanvas) return null;
    const myCtx = myCanvas.getContext('2d');

    if (myExistingInstance) {
      myExistingInstance.destroy();
    }

    const myLabels = myDailySeries.map(function (d) { return d.dayKey || d.bucketKey; });

    const myProjectNames = [];
    myDailySeries.forEach(function (myDay) {
      const myMap = myDay[myProjectFieldKey];
      if (!myMap) return;
      Object.keys(myMap).forEach(function (myP) {
        if (myProjectNames.indexOf(myP) === -1) {
          myProjectNames.push(myP);
        }
      });
    });

    const myDatasets = myProjectNames.map(function (myProjName, myIdx) {
      const myColor = MY_CHART_COLOR_PALETTE[myIdx % MY_CHART_COLOR_PALETTE.length];
      const myData = myDailySeries.map(function (myDay) {
        const myMap = myDay[myProjectFieldKey];
        return (myMap && myMap[myProjName]) ? Number(myMap[myProjName].toFixed(1)) : 0;
      });

      return {
        label: myProjName,
        data: myData,
        borderColor: myColor.border,
        backgroundColor: myColor.fill,
        fill: true,
        tension: 0.1,
        borderWidth: 2,
        pointRadius: myLabels.length > 50 ? 0 : 2
      };
    });

    if (myDatasets.length === 0) {
      myDatasets.push({
        label: 'Brak aktywności',
        data: myDailySeries.map(function () { return 0; }),
        borderColor: 'hsl(217, 91%, 60%)',
        backgroundColor: 'hsla(217, 91%, 60%, 0.1)',
        fill: true,
        tension: 0.1,
        borderWidth: 2,
        pointRadius: 0
      });
    }

    return new Chart(myCtx, {
      type: 'line',
      data: {
        labels: myLabels,
        datasets: myDatasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            position: 'top',
            labels: { color: 'hsl(215, 20%, 65%)', font: { size: 11 }, boxWidth: 10 }
          },
          tooltip: {
            callbacks: {
              label: function (myCtxItem) {
                return ' ' + myCtxItem.dataset.label + ': ' + myFormatDurationClient(myCtxItem.raw);
              }
            }
          }
        },
        scales: {
          x: {
            stacked: true,
            grid: { color: 'hsla(217, 33%, 30%, 0.2)' },
            ticks: {
              color: 'hsl(215, 20%, 65%)',
              font: { size: 11 },
              autoSkip: true,
              maxTicksLimit: 12
            }
          },
          y: {
            stacked: true,
            beginAtZero: true,
            grid: { color: 'hsla(217, 33%, 30%, 0.2)' },
            ticks: {
              color: 'hsl(215, 20%, 65%)',
              font: { size: 11 },
              callback: function (myVal) {
                const myM = Math.floor(myVal / 60);
                const myS = Math.round(myVal % 60);
                return myM + ':' + (myS < 10 ? '0' : '') + myS;
              }
            }
          }
        }
      }
    });
  }

  /**
   * Render daily quota usage stacked area chart using Chart.js.
   * @param {Array<Object>} myDailySeries - Daily quota points.
   */
  function myRenderDailyChart(myDailySeries) {
    myDailyQuotaChartInstance = myRenderStackedTimeSeriesChart_(
      'myChartDailyQuota',
      myDailyQuotaChartInstance,
      myDailySeries,
      'byProject'
    );
  }

  /**
   * Render projects duration share stacked area chart using Chart.js.
   * @param {Array<Object>} myDailySeries - Daily series with byProjectTotal.
   */
  function myRenderProjectsShareChart(myDailySeries) {
    myProjectsShareChartInstance = myRenderStackedTimeSeriesChart_(
      'myChartProjectsShare',
      myProjectsShareChartInstance,
      myDailySeries,
      'byProjectTotal'
    );
  }

  /**
   * Render projects and functions breakdown table rows.
   * @param {Array<Object>} myProjects - Projects list.
   */
  function myRenderProjectsTable(myProjects) {
    const myTbody = document.getElementById('myTableProjectsBody');
    if (!myTbody) return;

    if (!myProjects || myProjects.length === 0) {
      myTbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: var(--my-text-secondary);">Brak zarejestrowanych procesów w wybranym oknie.</td></tr>';
      return;
    }

    let myHtml = '';
    myProjects.forEach(function (myProj) {
      myProj.functions.forEach(function (myFn) {
        const myStatusPills = Object.keys(myFn.statuses).map(function (mySt) {
          const myBadgeClass = (mySt === 'FAILED' || mySt === 'TIMED_OUT') ? 'my-badge-danger' : 'my-badge-success';
          return '<span class="my-badge ' + myBadgeClass + '">' + mySt + ': ' + myFn.statuses[mySt] + '</span>';
        }).join(' ');

        myHtml += '<tr>' +
          '<td><strong>' + myProj.projectName + '</strong></td>' +
          '<td><code>' + myFn.functionName + '</code></td>' +
          '<td>' + myFn.count + '</td>' +
          '<td>' + myFormatDurationClient(myFn.totalSec) + '</td>' +
          '<td>' + myFn.avgSec + 's</td>' +
          '<td>' + myFn.minSec + 's</td>' +
          '<td>' + myFn.maxSec + 's</td>' +
          '<td>' + myFn.p95Sec + 's</td>' +
          '<td>' + myStatusPills + '</td>' +
          '</tr>';
      });
    });

    myTbody.innerHTML = myHtml;
  }

  const MY_STORAGE_KEY_VIEW_STATE = 'myGasTelemetryHub_viewState';
  const MY_STORAGE_KEY_PROCESSES = 'myGasTelemetryHub_cachedProcesses';
  const MY_STORAGE_KEY_LAST_SYNC = 'myGasTelemetryHub_lastSync';
  const MY_STORAGE_KEY_SETTINGS = 'myGasTelemetryHub_settings';

  let myGlobalFromIso = '';
  let myGlobalToIso = '';
  let myGlobalResolution = 'auto';
  let myGlobalPresetDays = 30;
  let myAppliedFromInputValue_ = '';
  let myAppliedToInputValue_ = '';
  let myLoadedSettings_ = null;

  let myCachedProcesses_ = [];
  let myCachedMaxTime_ = '';
  let myClientLastSync_ = '';
  let myLastFreshnessCheckMs_ = 0;
  let mySettings_ = { retentionDays: 30, quotaLimitSec: 5400 };

  /**
   * Toggle dashboard loading overlay.
   * @param {boolean} myIsLoading - Loading state.
   * @param {string} [myMessage] - Optional message.
   */
  function mySetDashboardLoadingState_(myIsLoading, myMessage) {
    const myOverlay = document.getElementById('myDashboardLoadingOverlay');
    const myText = document.getElementById('myDashboardLoadingText');
    if (myText && myMessage) myText.innerText = myMessage;
    if (myOverlay) {
      if (myIsLoading) myOverlay.classList.add('my-active');
      else myOverlay.classList.remove('my-active');
    }
  }

  /**
   * Save processes array and sync timestamp to localStorage.
   */
  function mySaveProcessesToStorage_() {
    try {
      localStorage.setItem(MY_STORAGE_KEY_LAST_SYNC, myClientLastSync_ || '');
      localStorage.setItem(MY_STORAGE_KEY_SETTINGS, JSON.stringify(mySettings_));
      localStorage.setItem(MY_STORAGE_KEY_PROCESSES, JSON.stringify(myCachedProcesses_));
    } catch (myErr) {
      // Ignore quota exceeded
    }
  }

  /**
   * Restore processes array from localStorage.
   * @return {boolean} True if restored.
   */
  function myRestoreProcessesFromStorage_() {
    try {
      const myRaw = localStorage.getItem(MY_STORAGE_KEY_PROCESSES);
      const mySync = localStorage.getItem(MY_STORAGE_KEY_LAST_SYNC);
      const mySettingsRaw = localStorage.getItem(MY_STORAGE_KEY_SETTINGS);
      if (mySettingsRaw) {
        mySettings_ = JSON.parse(mySettingsRaw);
        myLoadedSettings_ = {
          retentionDays: Number(mySettings_.retentionDays) || 30,
          quotaLimitSec: Number(mySettings_.quotaLimitSec) || 5400
        };
        const myRetEl = document.getElementById('myInputRetention');
        const myRetDisp = document.getElementById('myRetentionDisplay');
        const myQuotaEl = document.getElementById('myInputQuota');
        if (myRetEl) myRetEl.value = myLoadedSettings_.retentionDays;
        if (myRetDisp) myRetDisp.innerText = myLoadedSettings_.retentionDays;
        if (myQuotaEl) myQuotaEl.value = myLoadedSettings_.quotaLimitSec;
        myCheckSettingsDirtyState_();
      }
      if (myRaw) {
        myCachedProcesses_ = JSON.parse(myRaw);
        myClientLastSync_ = mySync || '';
        myUpdateCachedMaxTime_();
        return myCachedProcesses_.length > 0;
      }
    } catch (myErr) {
      myCachedProcesses_ = [];
    }
    return false;
  }

  /**
   * Prune cached processes older than retention threshold.
   */
  function myPruneClientExpiredRows_() {
    if (!mySettings_ || !mySettings_.retentionDays || !myCachedProcesses_ || myCachedProcesses_.length === 0) return;
    const myCutoffMs = Date.now() - (Number(mySettings_.retentionDays) * 86400000);
    const myInitialCount = myCachedProcesses_.length;
    myCachedProcesses_ = myCachedProcesses_.filter(function (p) {
      return new Date(p.startTime).getTime() >= myCutoffMs;
    });
    if (myCachedProcesses_.length !== myInitialCount) {
      myUpdateCachedMaxTime_();
      mySaveProcessesToStorage_();
    }
  }

  /**
   * Recalculate highest startTime in cached processes.
   */
  function myUpdateCachedMaxTime_() {
    let myMaxMs = 0;
    myCachedProcesses_.forEach(function (myP) {
      const myMs = new Date(myP.startTime).getTime();
      if (myMs > myMaxMs) myMaxMs = myMs;
    });
    myCachedMaxTime_ = myMaxMs > 0 ? new Date(myMaxMs).toISOString() : '';
  }

  /**
   * Highlight active preset button.
   * @param {number|string|null} myPresetKey - Preset key or null.
   */
  function myHighlightPresetBtn_(myPresetKey) {
    document.querySelectorAll('.my-time-presets .my-pill-btn').forEach(function (myBtn) {
      myBtn.classList.remove('my-active-preset');
    });
    if (myPresetKey) {
      const myId = (myPresetKey === 'all') ? 'myPresetBtnAll' : ('myPresetBtn' + myPresetKey + 'd');
      const myBtn = document.getElementById(myId);
      if (myBtn) myBtn.classList.add('my-active-preset');
    }
  }

  /**
   * Highlight active resolution button.
   * @param {string} myResKey - Resolution key.
   */
  function myHighlightResolutionBtn_(myResKey) {
    document.querySelectorAll('.my-res-btn').forEach(function (myBtn) {
      myBtn.classList.remove('my-active-preset');
    });
    const myBtnId = 'myResBtn' + (myResKey || 'auto').charAt(0).toUpperCase() + (myResKey || 'auto').slice(1);
    const myTargetBtn = document.getElementById(myBtnId);
    if (myTargetBtn) {
      myTargetBtn.classList.add('my-active-preset');
    }
  }

  /**
   * Persist current view state into browser localStorage.
   */
  function mySaveViewState_() {
    try {
      const myState = {
        activeTab: myActiveViewName,
        presetDays: myGlobalPresetDays,
        fromIso: myGlobalFromIso,
        toIso: myGlobalToIso,
        resolution: myGlobalResolution
      };
      localStorage.setItem(MY_STORAGE_KEY_VIEW_STATE, JSON.stringify(myState));
    } catch (myErr) {
      // Ignore storage errors in private browsing
    }
  }

  /**
   * Restore view state from browser localStorage.
   * @return {boolean} True if state was restored.
   */
  function myRestoreViewState_() {
    try {
      const myRaw = localStorage.getItem(MY_STORAGE_KEY_VIEW_STATE);
      if (!myRaw) return false;
      const myState = JSON.parse(myRaw);
      if (!myState || typeof myState !== 'object') return false;

      let myRestored = false;

      if (myState.resolution) {
        myGlobalResolution = myState.resolution;
        myHighlightResolutionBtn_(myGlobalResolution);
        myRestored = true;
      }

      if (myState.presetDays) {
        myGlobalPresetDays = myState.presetDays;
        const myDays = (myState.presetDays === 'all') ?
          ((mySettings_ && mySettings_.retentionDays) ? mySettings_.retentionDays : 30) :
          Number(myState.presetDays);
        const myNow = new Date();
        const myStart = new Date();
        myStart.setDate(myStart.getDate() - myDays);

        const myFromVal = myToDatetimeInputValue(myStart);
        const myToVal = myToDatetimeInputValue(myNow);

        document.getElementById('myInputTimeFrom').value = myFromVal;
        document.getElementById('myInputTimeTo').value = myToVal;

        myAppliedFromInputValue_ = myFromVal;
        myAppliedToInputValue_ = myToVal;

        myGlobalFromIso = myStart.toISOString();
        myGlobalToIso = myNow.toISOString();
        myHighlightPresetBtn_(myGlobalPresetDays);
        myRestored = true;
      } else if (myState.fromIso && myState.toIso) {
        myGlobalPresetDays = null;
        myHighlightPresetBtn_(null);
        myGlobalFromIso = myState.fromIso;
        myGlobalToIso = myState.toIso;
        const myFromVal = myToDatetimeInputValue(new Date(myGlobalFromIso));
        const myToVal = myToDatetimeInputValue(new Date(myGlobalToIso));
        document.getElementById('myInputTimeFrom').value = myFromVal;
        document.getElementById('myInputTimeTo').value = myToVal;
        myAppliedFromInputValue_ = myFromVal;
        myAppliedToInputValue_ = myToVal;
        myRestored = true;
      }

      if (myState.activeTab && ['overview', 'projects', 'settings'].includes(myState.activeTab)) {
        mySwitchView(myState.activeTab);
        myRestored = true;
      }

      return myRestored;
    } catch (myErr) {
      return false;
    }
    return false;
  }

  /**
   * Set dynamic or manual resolution and refresh views.
   * @param {string} myResKey - Target resolution (auto, 1d, 1h, 30m, 15m, 5m, 1m).
   */
  function mySetResolution(myResKey) {
    myGlobalResolution = myResKey || 'auto';
    myHighlightResolutionBtn_(myGlobalResolution);
    mySaveViewState_();
    myRenderFromLocalCache_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
  }

  /**
   * Convert Date object to datetime-local input string YYYY-MM-DDTHH:mm.
   * @param {Date} myDate - Date instance.
   * @return {string} Datetime string.
   */
  function myToDatetimeInputValue(myDate) {
    const myOffsetMs = myDate.getTimezoneOffset() * 60000;
    return new Date(myDate.getTime() - myOffsetMs).toISOString().slice(0, 16);
  }

  /**
   * Set time window inputs and refresh dashboard based on day preset.
   * @param {number} myDaysCount - Lookback days count.
   */
  function mySetTimeWindowPreset(myDaysCount) {
    let myDays = myDaysCount;
    if (myDaysCount === 'all') {
      myDays = (mySettings_ && mySettings_.retentionDays) ? mySettings_.retentionDays : 30;
    }
    myGlobalPresetDays = myDaysCount;
    const myNow = new Date();
    const myStart = new Date();
    myStart.setDate(myStart.getDate() - Number(myDays));

    const myFromVal = myToDatetimeInputValue(myStart);
    const myToVal = myToDatetimeInputValue(myNow);

    document.getElementById('myInputTimeFrom').value = myFromVal;
    document.getElementById('myInputTimeTo').value = myToVal;

    myAppliedFromInputValue_ = myFromVal;
    myAppliedToInputValue_ = myToVal;
    myUpdateTimeWindowInputBounds_();
    myCheckTimeWindowDirtyState_();

    myHighlightPresetBtn_(myDaysCount);

    myGlobalFromIso = myStart.toISOString();
    myGlobalToIso = myNow.toISOString();
    mySaveViewState_();

    myLoadDashboard(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
  }

  /**
   * Clamp date between lower and upper bounds.
   * @param {Date} myTargetDate - Target date.
   * @param {Date} myMinDate - Lower bound.
   * @param {Date} myMaxDate - Upper bound.
   * @return {Date} Clamped date.
   */
  function myClampDate_(myTargetDate, myMinDate, myMaxDate) {
    const myTargetMs = myTargetDate.getTime();
    if (myTargetMs < myMinDate.getTime()) return new Date(myMinDate.getTime());
    if (myTargetMs > myMaxDate.getTime()) return new Date(myMaxDate.getTime());
    return myTargetDate;
  }

  /**
   * Update min and max boundary constraints for datetime inputs based on retention and current time.
   */
  function myUpdateTimeWindowInputBounds_() {
    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    if (!myFromEl || !myToEl) return;

    const myRetention = (mySettings_ && mySettings_.retentionDays) ? Number(mySettings_.retentionDays) : 30;
    const myNow = new Date();
    const myMinDate = new Date(myNow.getTime() - (myRetention * 86400000));
    const myMinStr = myToDatetimeInputValue(myMinDate);
    const myMaxStr = myToDatetimeInputValue(myNow);

    myFromEl.min = myMinStr;
    myFromEl.max = myMaxStr;
    myToEl.min = myMinStr;
    myToEl.max = myMaxStr;
  }

  /**
   * Validate and clamp input values to allowable bounds.
   * @param {HTMLInputElement} [myActiveInputEl] - Input being edited if any.
   */
  function myValidateAndClampInputs_(myActiveInputEl) {
    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    if (!myFromEl || !myToEl) return;

    const myNow = new Date();
    const myRetention = (mySettings_ && mySettings_.retentionDays) ? Number(mySettings_.retentionDays) : 30;
    const myMinRetentionDate = new Date(myNow.getTime() - (myRetention * 86400000));

    let myFromDate = myFromEl.value ? new Date(myFromEl.value) : null;
    let myToDate = myToEl.value ? new Date(myToEl.value) : null;

    if (myToDate) {
      if (isNaN(myToDate.getTime()) || myToDate.getTime() > myNow.getTime()) {
        myToDate = new Date(myNow);
      } else if (myToDate.getTime() < myMinRetentionDate.getTime()) {
        myToDate = new Date(myMinRetentionDate);
      }
      myToEl.value = myToDatetimeInputValue(myToDate);
    }

    if (myFromDate) {
      if (isNaN(myFromDate.getTime()) || myFromDate.getTime() < myMinRetentionDate.getTime()) {
        myFromDate = new Date(myMinRetentionDate);
      } else if (myFromDate.getTime() > myNow.getTime()) {
        myFromDate = new Date(myNow);
      }
      myFromEl.value = myToDatetimeInputValue(myFromDate);
    }

    if (myFromDate && myToDate && myFromDate.getTime() > myToDate.getTime()) {
      if (myActiveInputEl && myActiveInputEl.id === 'myInputTimeFrom') {
        myToEl.value = myFromEl.value;
      } else {
        myFromEl.value = myToEl.value;
      }
    }

    myUpdateTimeWindowInputBounds_();
  }

  /**
   * Check dirty state for time window inputs.
   */
  function myCheckTimeWindowDirtyState_() {
    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    const myApplyBtn = document.getElementById('myBtnApplyTimeWindow');
    const myCancelBtn = document.getElementById('myBtnCancelTimeWindow');
    if (!myApplyBtn || !myFromEl || !myToEl) return;

    const myIsDirty = (myFromEl.value !== myAppliedFromInputValue_ || myToEl.value !== myAppliedToInputValue_);
    myApplyBtn.disabled = !myIsDirty;
    if (myCancelBtn) {
      myCancelBtn.style.display = myIsDirty ? 'inline-flex' : 'none';
    }
  }

  /**
   * Revert time window inputs to currently applied values.
   */
  function myCancelTimeWindow() {
    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');
    if (myFromEl) myFromEl.value = myAppliedFromInputValue_;
    if (myToEl) myToEl.value = myAppliedToInputValue_;
    if (myGlobalPresetDays) {
      myHighlightPresetBtn_(myGlobalPresetDays);
    }
    myCheckTimeWindowDirtyState_();
  }

  /**
   * Read time window inputs and apply global filter.
   */
  function myApplyTimeWindow() {
    myValidateAndClampInputs_();

    const myFromVal = document.getElementById('myInputTimeFrom').value;
    const myToVal = document.getElementById('myInputTimeTo').value;

    myGlobalPresetDays = null;
    myHighlightPresetBtn_(null);

    myGlobalFromIso = myFromVal ? new Date(myFromVal).toISOString() : '';
    myGlobalToIso = myToVal ? new Date(myToVal).toISOString() : '';

    myAppliedFromInputValue_ = myFromVal;
    myAppliedToInputValue_ = myToVal;
    myCheckTimeWindowDirtyState_();

    mySaveViewState_();
    myLoadDashboard(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
  }

  let myCachedMetricsBounds_ = null;

  window.addEventListener('resize', function () {
    myCachedMetricsBounds_ = null;
  });

  /**
   * Calculate and memoize text boundary metrics using offscreen Canvas.
   * @param {HTMLInputElement} myInputEl - Reference datetime input.
   * @return {Object} Cached boundary metrics.
   */
  function myGetMetricsBounds_(myInputEl) {
    if (myCachedMetricsBounds_) return myCachedMetricsBounds_;

    const myStyle = window.getComputedStyle(myInputEl);
    const myPaddingLeft = parseFloat(myStyle.paddingLeft) || 10;

    const myCanvas = document.createElement('canvas');
    const myCtx = myCanvas.getContext('2d');
    if (myCtx) {
      myCtx.font = myStyle.font || (myStyle.fontSize + ' ' + myStyle.fontFamily);
      myCachedMetricsBounds_ = {
        paddingLeft: myPaddingLeft,
        day: myCtx.measureText('03.').width,
        month: myCtx.measureText('03.06.').width,
        year: myCtx.measureText('03.06.2020 ').width,
        hour: myCtx.measureText('03.06.2020 23:').width,
        minute: myCtx.measureText('03.06.2020 23:24').width
      };
    } else {
      myCachedMetricsBounds_ = {
        paddingLeft: myPaddingLeft,
        day: 24,
        month: 48,
        year: 88,
        hour: 116,
        minute: 148
      };
    }
    return myCachedMetricsBounds_;
  }

  /**
   * Determine targeted date segment based on mouse offsetX and text metrics.
   * @param {number} myOffsetX - Mouse X offset.
   * @param {HTMLInputElement} myInputEl - Target input element.
   * @return {{ segment: string, label: string }|null} Segment info or null.
   */
  function myGetSegmentFromOffsetX_(myOffsetX, myInputEl) {
    const myBounds = myGetMetricsBounds_(myInputEl);
    const myTextX = myOffsetX - myBounds.paddingLeft;

    if (myTextX < 0) return null;
    if (myTextX > myBounds.minute + 10) return null;

    if (myTextX <= myBounds.day) {
      return { segment: 'day', label: 'Dzień (±1)' };
    }
    if (myTextX <= myBounds.month) {
      return { segment: 'month', label: 'Miesiąc (±1)' };
    }
    if (myTextX <= myBounds.year) {
      return { segment: 'year', label: 'Rok (±1)' };
    }
    if (myTextX <= myBounds.hour) {
      return { segment: 'hour', label: 'Godzina (±1)' };
    }
    return { segment: 'minute', label: 'Minuta (±1)' };
  }

  /**
   * Adjust date by segment and delta.
   * @param {Date} myDate - Target date.
   * @param {string} mySegment - Target segment (day, month, year, hour, minute).
   * @param {number} myDelta - Delta (+1, -1, +5, etc).
   * @return {Date} Modified date.
   */
  function myAdjustDateBySegment_(myDate, mySegment, myDelta) {
    const myNewDate = new Date(myDate.getTime());
    if (mySegment === 'day') {
      myNewDate.setDate(myNewDate.getDate() + myDelta);
    } else if (mySegment === 'month') {
      myNewDate.setMonth(myNewDate.getMonth() + myDelta);
    } else if (mySegment === 'year') {
      myNewDate.setFullYear(myNewDate.getFullYear() + myDelta);
    } else if (mySegment === 'hour') {
      myNewDate.setHours(myNewDate.getHours() + myDelta);
    } else if (mySegment === 'minute') {
      myNewDate.setMinutes(myNewDate.getMinutes() + myDelta);
    }
    return myNewDate;
  }

  /**
   * Handle wheel event on datetime input using mouse position heuristic.
   * Updates input field value only without triggering server filter action.
   * @param {WheelEvent} myEvt - Wheel event.
   * @param {HTMLInputElement} myInputEl - Target input element.
   */
  function myHandleDatetimeWheel_(myEvt, myInputEl) {
    const mySegmentData = myGetSegmentFromOffsetX_(myEvt.offsetX, myInputEl);
    if (!mySegmentData) return;

    myEvt.preventDefault();

    let myCurrDate = myInputEl.value ? new Date(myInputEl.value) : new Date();
    if (isNaN(myCurrDate.getTime())) myCurrDate = new Date();

    const myStep = (myEvt.shiftKey && mySegmentData.segment === 'minute') ? 5 : 1;
    const myDelta = (myEvt.deltaY < 0 ? 1 : -1) * myStep;

    const myUnclampedDate = myAdjustDateBySegment_(myCurrDate, mySegmentData.segment, myDelta);

    const myNow = new Date();
    const myRetention = (mySettings_ && mySettings_.retentionDays) ? Number(mySettings_.retentionDays) : 30;
    const myMinRetentionDate = new Date(myNow.getTime() - (myRetention * 86400000));

    let myMinBound = myMinRetentionDate;
    let myMaxBound = myNow;

    const myFromEl = document.getElementById('myInputTimeFrom');
    const myToEl = document.getElementById('myInputTimeTo');

    if (myInputEl.id === 'myInputTimeFrom') {
      if (myToEl && myToEl.value) {
        const myToDate = new Date(myToEl.value);
        if (!isNaN(myToDate.getTime())) myMaxBound = myToDate;
      }
    } else if (myInputEl.id === 'myInputTimeTo') {
      if (myFromEl && myFromEl.value) {
        const myFromDate = new Date(myFromEl.value);
        if (!isNaN(myFromDate.getTime())) myMinBound = myFromDate;
      }
    }

    const myNextDate = myClampDate_(myUnclampedDate, myMinBound, myMaxBound);
    myInputEl.value = myToDatetimeInputValue(myNextDate);

    myInputEl.title = 'Kółko myszy: ' + mySegmentData.label;

    myGlobalPresetDays = null;
    myHighlightPresetBtn_(null);
    myCheckTimeWindowDirtyState_();
  }

  /**
   * Update input title tooltip on mouse hover over segments.
   * @param {MouseEvent} myEvt - Mouse event.
   * @param {HTMLInputElement} myInputEl - Target input.
   */
  function myHandleDatetimeMouseMove_(myEvt, myInputEl) {
    const mySegmentData = myGetSegmentFromOffsetX_(myEvt.offsetX, myInputEl);
    if (!mySegmentData) {
      myInputEl.title = '';
      return;
    }
    myInputEl.title = 'Kółko myszy: ' + mySegmentData.label + (mySegmentData.segment === 'minute' ? ' (Shift = ±5 min)' : '');
  }

  /**
   * Attach mouse position heuristic wheel listeners to datetime inputs.
   */
  function myInitDatetimeWheelScrubbing_() {
    ['myInputTimeFrom', 'myInputTimeTo'].forEach(function (myId) {
      const myEl = document.getElementById(myId);
      if (!myEl) return;
      myEl.addEventListener('wheel', function (myEvt) {
        myHandleDatetimeWheel_(myEvt, myEl);
      }, { passive: false });

      myEl.addEventListener('mousemove', function (myEvt) {
        myHandleDatetimeMouseMove_(myEvt, myEl);
      });

      myEl.addEventListener('input', myCheckTimeWindowDirtyState_);
      myEl.addEventListener('change', function () {
        myValidateAndClampInputs_(myEl);
        myCheckTimeWindowDirtyState_();
      });
      myEl.addEventListener('blur', function () {
        myValidateAndClampInputs_(myEl);
        myCheckTimeWindowDirtyState_();
      });
    });
  }

  /**
   * Load dashboard data from backend and populate UI.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @param {string} [myResolution] - Resolution code.
   */
  /**
   * Calculate percentile from array of numbers.
   * @param {Array<number>} myNumbers - List of numbers.
   * @param {number} myPercentile - Target percentile.
   * @return {number} Percentile value.
   */
  function myClientCalculatePercentile_(myNumbers, myPercentile) {
    if (!myNumbers || myNumbers.length === 0) return 0;
    const mySorted = myNumbers.slice().sort(function (a, b) { return a - b; });
    const myIndex = Math.ceil((myPercentile / 100) * mySorted.length) - 1;
    return Number(mySorted[Math.max(0, myIndex)].toFixed(2));
  }

  /**
   * Resolve auto resolution for client duration.
   * @param {string} myFromIso - Start ISO.
   * @param {string} myToIso - End ISO.
   * @return {string} Resolution code.
   */
  function myResolveClientAutoResolution_(myFromIso, myToIso) {
    const myFromMs = myFromIso ? new Date(myFromIso).getTime() : 0;
    const myToMs = myToIso ? new Date(myToIso).getTime() : Date.now();
    const myDiffHours = Math.max(0, (myToMs - myFromMs) / 3600000);
    if (myDiffHours > 336) return '1d';
    if (myDiffHours > 72) return '1h';
    if (myDiffHours > 24) return '30m';
    if (myDiffHours > 6) return '15m';
    if (myDiffHours > 2) return '5m';
    return '1m';
  }

  /**
   * Get bucket step in milliseconds.
   * @param {string} myResolution - Resolution code.
   * @return {number} Milliseconds.
   */
  function myGetClientBucketStepMs_(myResolution) {
    if (myResolution === '1d') return 86400000;
    if (myResolution === '1h') return 3600000;
    if (myResolution === '30m') return 1800000;
    if (myResolution === '15m') return 900000;
    if (myResolution === '5m') return 300000;
    return 60000;
  }

  /**
   * Format date into bucket key in local timezone.
   * @param {Date|string|number} myDateVal - Date value.
   * @param {string} myResolution - Target resolution.
   * @return {string} Bucket key string.
   */
  function myGetClientBucketKey_(myDateVal, myResolution) {
    const myDate = new Date(myDateVal);
    if (isNaN(myDate.getTime())) return '';

    const myPad = function (n) { return n < 10 ? '0' + n : '' + n; };
    const myYmd = myDate.getFullYear() + '-' + myPad(myDate.getMonth() + 1) + '-' + myPad(myDate.getDate());

    if (myResolution === '1d') {
      return myYmd;
    }
    const myH = myPad(myDate.getHours());
    if (myResolution === '1h') {
      return myYmd + ' ' + myH + ':00';
    }

    let myStep = 1;
    if (myResolution === '30m') myStep = 30;
    else if (myResolution === '15m') myStep = 15;
    else if (myResolution === '5m') myStep = 5;

    const myBucketM = Math.floor(myDate.getMinutes() / myStep) * myStep;
    return myYmd + ' ' + myH + ':' + myPad(myBucketM);
  }

  /**
   * In-memory aggregation engine running in browser RAM.
   * @param {Array<Object>} myProcesses - Cached processes.
   * @param {string} myFromIso - Start ISO.
   * @param {string} myToIso - End ISO.
   * @param {string} myRequestedResolution - Resolution code.
   * @return {Object} Aggregated DTO identical to backend format.
   */
  function myAggregateClientDataset_(myProcesses, myFromIso, myToIso, myRequestedResolution) {
    const myProjects = {};
    const mySeriesBuckets = {};
    let myTotalDurationSec = 0;
    let myTotalFailures = 0;
    let myTodayTriggerSec = 0;

    const myPad = function (n) { return n < 10 ? '0' + n : '' + n; };
    const myNow = new Date();
    const myTodayKey = myNow.getFullYear() + '-' + myPad(myNow.getMonth() + 1) + '-' + myPad(myNow.getDate());

    let myEffectiveResolution = myRequestedResolution;
    if (!myEffectiveResolution || myEffectiveResolution === 'auto') {
      myEffectiveResolution = myResolveClientAutoResolution_(myFromIso, myToIso);
    }

    const myFromMs = myFromIso ? new Date(myFromIso).getTime() : 0;
    const myToMs = myToIso ? new Date(myToIso).getTime() : Infinity;

    // Pre-fill continuous buckets up to 1000 points
    if (myFromIso && myToIso && myToMs < Infinity) {
      const myStepMs = myGetClientBucketStepMs_(myEffectiveResolution);
      const myStepsCount = Math.floor((myToMs - myFromMs) / myStepMs);
      if (myStepsCount > 0 && myStepsCount <= 1000) {
        for (let myCurrMs = myFromMs; myCurrMs <= myToMs; myCurrMs += myStepMs) {
          const myFillKey = myGetClientBucketKey_(myCurrMs, myEffectiveResolution);
          if (myFillKey && !mySeriesBuckets[myFillKey]) {
            mySeriesBuckets[myFillKey] = {
              bucketKey: myFillKey,
              triggerSec: 0,
              totalSec: 0,
              count: 0,
              byProject: {},
              byProjectTotal: {}
            };
          }
        }
      }
    }

    let myFilteredCount = 0;
    myProcesses.forEach(function (myRow) {
      const myRowTimeMs = new Date(myRow.startTime).getTime();
      const myIsFail = myRow.processStatus === 'FAILED' || myRow.processStatus === 'TIMED_OUT';
      const myIsQuotaType = myRow.processType === 'TIME_DRIVEN' || myRow.processType === 'TRIGGER';

      const myRowDate = new Date(myRow.startTime);
      const myRowDay = myRowDate.getFullYear() + '-' + myPad(myRowDate.getMonth() + 1) + '-' + myPad(myRowDate.getDate());
      if (myRowDay === myTodayKey && myIsQuotaType) {
        myTodayTriggerSec += myRow.durationSec;
      }

      if (myRowTimeMs < myFromMs || myRowTimeMs > myToMs) return;

      myFilteredCount++;
      myTotalDurationSec += myRow.durationSec;
      if (myIsFail) myTotalFailures++;

      // 1. Time-series bucket accumulation
      const myBucketKey = myGetClientBucketKey_(myRow.startTime, myEffectiveResolution);
      if (myBucketKey) {
        if (!mySeriesBuckets[myBucketKey]) {
          mySeriesBuckets[myBucketKey] = {
            bucketKey: myBucketKey,
            triggerSec: 0,
            totalSec: 0,
            count: 0,
            byProject: {},
            byProjectTotal: {}
          };
        }
        mySeriesBuckets[myBucketKey].totalSec += myRow.durationSec;
        mySeriesBuckets[myBucketKey].count++;
        mySeriesBuckets[myBucketKey].byProjectTotal[myRow.projectName] =
          (mySeriesBuckets[myBucketKey].byProjectTotal[myRow.projectName] || 0) + myRow.durationSec;
        if (myIsQuotaType) {
          mySeriesBuckets[myBucketKey].triggerSec += myRow.durationSec;
          mySeriesBuckets[myBucketKey].byProject[myRow.projectName] =
            (mySeriesBuckets[myBucketKey].byProject[myRow.projectName] || 0) + myRow.durationSec;
        }
      }

      // 2. Project & function breakdown
      if (!myProjects[myRow.projectName]) {
        myProjects[myRow.projectName] = {
          projectName: myRow.projectName,
          totalSec: 0,
          count: 0,
          failCount: 0,
          functions: {}
        };
      }
      const myProj = myProjects[myRow.projectName];
      myProj.totalSec += myRow.durationSec;
      myProj.count++;
      if (myIsFail) myProj.failCount++;

      if (!myProj.functions[myRow.functionName]) {
        myProj.functions[myRow.functionName] = {
          functionName: myRow.functionName,
          totalSec: 0,
          count: 0,
          minSec: Infinity,
          maxSec: 0,
          durations: [],
          statuses: {}
        };
      }
      const myFn = myProj.functions[myRow.functionName];
      myFn.totalSec += myRow.durationSec;
      myFn.count++;
      myFn.minSec = Math.min(myFn.minSec, myRow.durationSec);
      myFn.maxSec = Math.max(myFn.maxSec, myRow.durationSec);
      myFn.durations.push(myRow.durationSec);
      myFn.statuses[myRow.processStatus] = (myFn.statuses[myRow.processStatus] || 0) + 1;
    });

    const myQuotaLimitSec = (mySettings_ && mySettings_.quotaLimitSec) ? mySettings_.quotaLimitSec : 5400;

    const myProjectsList = Object.keys(myProjects).map(function (myProjName) {
      const myP = myProjects[myProjName];
      const myFunctionsList = Object.keys(myP.functions).map(function (myFnName) {
        const myF = myP.functions[myFnName];
        return {
          functionName: myF.functionName,
          count: myF.count,
          totalSec: Number(myF.totalSec.toFixed(2)),
          avgSec: Number((myF.totalSec / myF.count).toFixed(2)),
          minSec: myF.minSec === Infinity ? 0 : Number(myF.minSec.toFixed(2)),
          maxSec: Number(myF.maxSec.toFixed(2)),
          p95Sec: myClientCalculatePercentile_(myF.durations, 95),
          statuses: myF.statuses
        };
      }).sort(function (a, b) { return b.totalSec - a.totalSec; });

      return {
        projectName: myP.projectName,
        totalSec: Number(myP.totalSec.toFixed(2)),
        count: myP.count,
        failCount: myP.failCount,
        functions: myFunctionsList
      };
    }).sort(function (a, b) { return b.totalSec - a.totalSec; });

    const mySeriesList = Object.keys(mySeriesBuckets).sort().map(function (myK) {
      const myItem = mySeriesBuckets[myK];
      return {
        dayKey: myItem.bucketKey,
        bucketKey: myItem.bucketKey,
        triggerSec: Number(myItem.triggerSec.toFixed(1)),
        totalSec: Number(myItem.totalSec.toFixed(1)),
        count: myItem.count,
        percentUsed: Number(((myItem.triggerSec / myQuotaLimitSec) * 100).toFixed(1)),
        byProject: myItem.byProject,
        byProjectTotal: myItem.byProjectTotal
      };
    });

    const myTodayQuotaPercent = Number(((myTodayTriggerSec / myQuotaLimitSec) * 100).toFixed(1));

    return {
      summary: {
        totalRuns: myFilteredCount,
        totalDurationSec: Number(myTotalDurationSec.toFixed(1)),
        totalFailures: myTotalFailures,
        failureRate: myFilteredCount > 0 ? Number(((myTotalFailures / myFilteredCount) * 100).toFixed(1)) : 0,
        todayQuotaSec: Number(myTodayTriggerSec.toFixed(1)),
        todayQuotaLimitSec: myQuotaLimitSec,
        todayQuotaPercent: myTodayQuotaPercent
      },
      dailySeries: mySeriesList,
      resolution: myRequestedResolution || 'auto',
      effectiveResolution: myEffectiveResolution,
      projects: myProjectsList
    };
  }

  /**
   * Render dashboard views using local in-memory dataset in 0 ms.
   * @param {string} myFromIso - Start ISO.
   * @param {string} myToIso - End ISO.
   * @param {string} [myResolution] - Target resolution.
   */
  function myRenderFromLocalCache_(myFromIso, myToIso, myResolution) {
    const myAggregated = myAggregateClientDataset_(
      myCachedProcesses_,
      myFromIso || myGlobalFromIso,
      myToIso || myGlobalToIso,
      myResolution || myGlobalResolution
    );

    const myChartTitle = document.getElementById('myChartSectionTitle');
    if (myChartTitle) {
      myChartTitle.innerText = 'Miks zużycia kwoty wyzwalaczy per projekt (ziarnistość: ' + myAggregated.effectiveResolution + ')';
    }
    const myShareTitle = document.getElementById('myChartProjectsShareTitle');
    if (myShareTitle) {
      myShareTitle.innerText = 'Udział projektów w czasie wykonania (ziarnistość: ' + myAggregated.effectiveResolution + ')';
    }

    myRenderKpis(myAggregated.summary);
    myRenderDailyChart(myAggregated.dailySeries);
    myRenderProjectsShareChart(myAggregated.dailySeries);
    myRenderProjectsTable(myAggregated.projects);

    if (myClientLastSync_) {
      document.getElementById('myStatusSubtitle').innerText = 'Ostatnia synchronizacja: ' + new Date(myClientLastSync_).toLocaleString('pl-PL');
    }
  }

  /**
   * Check telemetry freshness on backend, merge delta if available, and render in-memory.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @param {string} [myResolution] - Target resolution.
   */
  async function myEnsureFreshnessAndRender_(myFromIso, myToIso, myResolution) {
    const myTargetToMs = myToIso ? new Date(myToIso).getTime() : Date.now();
    const myCachedMaxMs = myCachedMaxTime_ ? new Date(myCachedMaxTime_).getTime() : 0;
    const myNow = Date.now();

    const myTouchesPresent = myTargetToMs >= myCachedMaxMs;
    const myShouldCheckFreshness = myTouchesPresent && (myNow - myLastFreshnessCheckMs_ > 60000);

    if (myShouldCheckFreshness) {
      try {
        myLastFreshnessCheckMs_ = myNow;
        const myFreshness = await myCallServer('myApiCheckTelemetryFreshness', myClientLastSync_);
        if (myFreshness && myFreshness.isStale) {
          const myDeltaRes = await myCallServer('myApiGetDeltaProcesses', myCachedMaxTime_);
          if (myDeltaRes && myDeltaRes.delta && myDeltaRes.delta.length > 0) {
            const myExistingKeys = {};
            myCachedProcesses_.forEach(function (p) { myExistingKeys[p.key] = true; });
            myDeltaRes.delta.forEach(function (p) {
              if (!myExistingKeys[p.key]) {
                myCachedProcesses_.push(p);
                myExistingKeys[p.key] = true;
              }
            });
            myUpdateCachedMaxTime_();
            myClientLastSync_ = myDeltaRes.lastCollectionTime || myFreshness.serverLastSync;
            mySaveProcessesToStorage_();
          } else if (myFreshness.serverLastSync) {
            myClientLastSync_ = myFreshness.serverLastSync;
            mySaveProcessesToStorage_();
          }
        }
      } catch (myErr) {
        console.warn('Freshness check failed, rendering from memory:', myErr);
      }
    }

    myRenderFromLocalCache_(myFromIso, myToIso, myResolution);
  }

  /**
   * Bootstrap full initial dataset from server with visual loading overlay.
   * @param {string} myFromIso - Target from ISO.
   * @param {string} myToIso - Target to ISO.
   * @param {string} [myResolution] - Target resolution.
   */
  async function myBootstrapInitialDataset_(myFromIso, myToIso, myResolution) {
    mySetDashboardLoadingState_(true, 'Pobieranie bazy procesów z arkusza...');
    try {
      const myRes = await myCallServer('myApiGetInitialDataset');
      myCachedProcesses_ = myRes.processes || [];
      if (myRes.settings) {
        mySettings_ = myRes.settings;
        myLoadedSettings_ = {
          retentionDays: Number(mySettings_.retentionDays) || 30,
          quotaLimitSec: Number(mySettings_.quotaLimitSec) || 5400
        };
        const myRetEl = document.getElementById('myInputRetention');
        const myRetDisp = document.getElementById('myRetentionDisplay');
        const myQuotaEl = document.getElementById('myInputQuota');
        if (myRetEl) myRetEl.value = myLoadedSettings_.retentionDays;
        if (myRetDisp) myRetDisp.innerText = myLoadedSettings_.retentionDays;
        if (myQuotaEl) myQuotaEl.value = myLoadedSettings_.quotaLimitSec;
        myUpdateTimeWindowInputBounds_();
        myCheckSettingsDirtyState_();
      }
      myClientLastSync_ = myRes.lastCollectionTime || myRes.lastSync || '';
      myUpdateCachedMaxTime_();
      mySaveProcessesToStorage_();

      if (myGlobalPresetDays === 'all') {
        const myAllDays = (mySettings_ && mySettings_.retentionDays) ? mySettings_.retentionDays : 30;
        const myNow = new Date();
        const myStart = new Date();
        myStart.setDate(myStart.getDate() - myAllDays);
        myGlobalFromIso = myStart.toISOString();
        myGlobalToIso = myNow.toISOString();
        const myFromEl = document.getElementById('myInputTimeFrom');
        const myToEl = document.getElementById('myInputTimeTo');
        if (myFromEl) myFromEl.value = myToDatetimeInputValue(myStart);
        if (myToEl) myToEl.value = myToDatetimeInputValue(myNow);
        myAppliedFromInputValue_ = myFromEl ? myFromEl.value : '';
        myAppliedToInputValue_ = myToEl ? myToEl.value : '';
        myCheckTimeWindowDirtyState_();
      }

      myRenderFromLocalCache_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
    } catch (myErr) {
      console.error('Error bootstrapping initial dataset:', myErr);
      document.getElementById('myStatusSubtitle').innerText = 'Błąd pobierania bazy: ' + myErr.message;
    } finally {
      mySetDashboardLoadingState_(false);
    }
  }

  /**
   * Load dashboard data. Uses local memory cache if present, otherwise bootstraps initial dataset.
   * @param {string} myFromIso - Start ISO timestamp.
   * @param {string} myToIso - End ISO timestamp.
   * @param {string} [myResolution] - Resolution code.
   */
  async function myLoadDashboard(myFromIso, myToIso, myResolution) {
    if (myCachedProcesses_ && myCachedProcesses_.length > 0) {
      await myEnsureFreshnessAndRender_(myFromIso, myToIso, myResolution);
      return;
    }
    await myBootstrapInitialDataset_(myFromIso, myToIso, myResolution);
  }

  /**
   * Trigger manual telemetry collection and refresh views.
   */
  async function myHandleManualSync() {
    const myBtn = document.getElementById('myBtnSyncNow');
    const mySpinnerText = document.getElementById('mySyncBtnText');

    myBtn.disabled = true;
    myBtn.classList.add('my-loading');
    mySpinnerText.innerText = 'Pobieranie procesów...';

    try {
      const myRes = await myCallServer('myApiTriggerManualSync');
      myCachedProcesses_ = myRes.processes || [];
      if (myRes.settings) {
        mySettings_ = myRes.settings;
      }
      myClientLastSync_ = myRes.lastCollectionTime || myRes.lastSync || '';
      myUpdateCachedMaxTime_();
      mySaveProcessesToStorage_();

      myRenderFromLocalCache_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
    } catch (myErr) {
      alert('Błąd synchronizacji: ' + myErr.message);
    } finally {
      myBtn.disabled = false;
      myBtn.classList.remove('my-loading');
      mySpinnerText.innerText = 'Synchronizuj teraz';
    }
  }

  /**
   * Check dirty state for configuration settings inputs.
   */
  function myCheckSettingsDirtyState_() {
    const myRetentionEl = document.getElementById('myInputRetention');
    const myQuotaEl = document.getElementById('myInputQuota');
    const mySaveBtn = document.getElementById('myBtnSaveSettings');
    const myCancelBtn = document.getElementById('myBtnCancelSettings');
    if (!myRetentionEl || !myQuotaEl || !mySaveBtn) return;

    const myCurrentRetention = Number(myRetentionEl.value);
    const myCurrentQuota = Number(myQuotaEl.value);

    const myIsDirty = !myLoadedSettings_ || (
      myCurrentRetention !== myLoadedSettings_.retentionDays ||
      myCurrentQuota !== myLoadedSettings_.quotaLimitSec
    );

    mySaveBtn.disabled = !myIsDirty;
    if (myCancelBtn) {
      myCancelBtn.style.display = myIsDirty ? 'inline-flex' : 'none';
    }
  }

  /**
   * Revert settings form inputs to last loaded baseline values.
   */
  function myCancelSettings() {
    if (!myLoadedSettings_) return;
    const myRetentionEl = document.getElementById('myInputRetention');
    const myQuotaEl = document.getElementById('myInputQuota');
    if (myRetentionEl) {
      myRetentionEl.value = myLoadedSettings_.retentionDays;
      document.getElementById('myRetentionDisplay').innerText = myLoadedSettings_.retentionDays;
    }
    if (myQuotaEl) {
      myQuotaEl.value = myLoadedSettings_.quotaLimitSec;
    }
    myCheckSettingsDirtyState_();
  }

  /**
   * Save configuration settings to backend.
   */
  async function myHandleSaveSettings() {
    const myRetention = Number(document.getElementById('myInputRetention').value);
    const myQuota = Number(document.getElementById('myInputQuota').value);
    const mySaveBtn = document.getElementById('myBtnSaveSettings');

    mySaveBtn.disabled = true;
    mySaveBtn.innerText = 'Zapisywanie...';

    try {
      await myCallServer('myApiUpdateSettings', {
        retentionDays: myRetention,
        quotaLimitSec: myQuota
      });
      myLoadedSettings_ = {
        retentionDays: myRetention,
        quotaLimitSec: myQuota
      };
      myUpdateTimeWindowInputBounds_();
      myValidateAndClampInputs_();
      myCheckSettingsDirtyState_();
      alert('Ustawienia zapisane pomyślnie.');
      myLoadDashboard(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
    } catch (myErr) {
      alert('Błąd zapisu ustawień: ' + myErr.message);
    } finally {
      mySaveBtn.innerText = 'Zapisz ustawienia';
      myCheckSettingsDirtyState_();
    }
  }

  // Initial load
  document.addEventListener('DOMContentLoaded', function () {
    myInitDatetimeWheelScrubbing_();
    const myHasCachedData = myRestoreProcessesFromStorage_();
    const myHasRestoredView = myRestoreViewState_();
    if (!myHasRestoredView) {
      mySetTimeWindowPreset(30);
    }
    myUpdateTimeWindowInputBounds_();
    myValidateAndClampInputs_();
    if (myHasCachedData) {
      myPruneClientExpiredRows_();
      if (myCachedProcesses_.length > 0) {
        myRenderFromLocalCache_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
        myEnsureFreshnessAndRender_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
        return;
      }
    }
    myBootstrapInitialDataset_(myGlobalFromIso, myGlobalToIso, myGlobalResolution);
  });

</script>
