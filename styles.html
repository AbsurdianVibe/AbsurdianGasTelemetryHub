<style>
  :root {
    --my-bg-base: hsl(222, 47%, 11%);
    --my-bg-surface: hsl(222, 40%, 15%);
    --my-bg-card: hsla(222, 40%, 18%, 0.7);
    --my-bg-card-hover: hsla(222, 40%, 22%, 0.85);
    --my-border: hsla(217, 33%, 30%, 0.5);
    --my-border-focus: hsl(217, 91%, 60%);

    --my-text-primary: hsl(210, 40%, 98%);
    --my-text-secondary: hsl(215, 20%, 65%);
    --my-text-muted: hsl(215, 16%, 47%);

    --my-accent: hsl(217, 91%, 60%);
    --my-accent-hover: hsl(217, 91%, 68%);
    --my-accent-glow: hsla(217, 91%, 60%, 0.25);

    --my-success: hsl(142, 71%, 45%);
    --my-warning: hsl(38, 92%, 50%);
    --my-danger: hsl(0, 84%, 60%);

    --my-radius-sm: 6px;
    --my-radius-md: 10px;
    --my-radius-lg: 16px;

    --my-shadow: 0 10px 30px -10px hsla(222, 47%, 5%, 0.6);
  }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 20px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--my-bg-base);
    color: var(--my-text-primary);
    min-height: 100vh;
    line-height: 1.5;
    padding: 24px;
    background-image: 
      radial-gradient(circle at 15% 15%, hsla(217, 91%, 60%, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, hsla(142, 71%, 45%, 0.05) 0%, transparent 40%);
  }

  body:focus {
    outline: none;
  }

  .my-container {
    max-width: 1280px;
    margin: 0 auto;
  }

  /* Header */
  .my-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--my-border);
    margin-bottom: 28px;
  }

  .my-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .my-brand-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--my-accent), hsl(260, 80%, 65%));
    border-radius: var(--my-radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    box-shadow: 0 0 20px var(--my-accent-glow);
  }

  .my-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--my-text-primary);
  }

  .my-actions {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    min-width: 160px;
  }

  .my-sync-status {
    font-size: 11px;
    color: var(--my-text-secondary);
    text-align: center;
    line-height: 1.35;
    user-select: none;
  }

  /* Buttons */
  .my-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--my-accent);
    color: #ffffff;
    border: none;
    padding: 10px 18px;
    border-radius: var(--my-radius-md);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px var(--my-accent-glow);
  }

  .my-btn:hover:not(:disabled) {
    background: var(--my-accent-hover);
  }

  .my-btn:disabled {
    opacity: 0.45;
    cursor: default;
    box-shadow: none;
  }

  .my-btn-secondary {
    background: var(--my-bg-surface);
    color: var(--my-text-primary);
    border: 1px solid var(--my-border);
    box-shadow: none;
  }

  .my-btn-secondary:hover:not(:disabled) {
    background: var(--my-bg-card-hover);
    border-color: var(--my-border-focus);
  }

  /* Navigation Tabs */
  .my-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--my-border);
    padding-bottom: 8px;
  }

  .my-nav-btn {
    background: transparent;
    border: none;
    color: var(--my-text-secondary);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: var(--my-radius-sm);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .my-nav-btn:hover {
    color: var(--my-text-primary);
    background: var(--my-bg-surface);
  }

  .my-nav-btn.my-active {
    color: #ffffff;
    background: var(--my-accent);
  }

  /* KPI Cards Grid */
  .my-kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }

  .my-card {
    background: var(--my-bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--my-border);
    border-radius: var(--my-radius-lg);
    padding: 20px;
    box-shadow: var(--my-shadow);
    transition: border-color 0.2s ease;
  }

  .my-card:hover {
    border-color: var(--my-border-focus);
  }

  .my-kpi-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .my-kpi-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--my-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .my-kpi-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--my-text-primary);
    letter-spacing: -1px;
    margin-bottom: 4px;
  }

  .my-kpi-sub {
    font-size: 12px;
    color: var(--my-text-muted);
  }

  /* Progress Bar */
  .my-progress-bar {
    width: 100%;
    height: 8px;
    background: var(--my-bg-surface);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 10px;
  }

  .my-progress-fill {
    height: 100%;
    background: var(--my-accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .my-progress-fill.my-warn {
    background: var(--my-warning);
  }

  .my-progress-fill.my-crit {
    background: var(--my-danger);
  }

  /* Chart & Section Containers */
  .my-section-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    margin-bottom: 28px;
  }

  .my-section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--my-text-primary);
  }

  .my-chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .my-chart-header .my-section-title {
    margin-bottom: 0;
  }

  .my-chart-header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .my-chart-option {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--my-text-secondary);
    background: var(--my-bg-surface);
    border: 1px solid var(--my-border);
    padding: 5px 11px;
    border-radius: var(--my-radius-sm);
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
  }

  .my-chart-option:hover {
    color: var(--my-text-primary);
    border-color: var(--my-border-focus);
    background: var(--my-bg-card-hover);
  }

  .my-chart-option input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    margin: 0;
    cursor: pointer;
    background: var(--my-bg-base);
    border: 1px solid var(--my-border);
    border-radius: 3px;
    display: inline-grid;
    place-content: center;
    transition: all 0.2s ease;
  }

  .my-chart-option input[type="checkbox"]::before {
    content: "";
    width: 8px;
    height: 8px;
    transform: scale(0);
    transition: 120ms transform ease-in-out;
    box-shadow: inset 1em 1em var(--my-accent);
    transform-origin: center;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  }

  .my-chart-option input[type="checkbox"]:checked {
    background: hsla(217, 91%, 60%, 0.15);
    border-color: var(--my-accent);
  }

  .my-chart-option input[type="checkbox"]:checked::before {
    transform: scale(1);
  }

  .my-chart-option:hover input[type="checkbox"] {
    border-color: var(--my-accent);
  }

  .my-limit-preview-dash {
    display: inline-block;
    width: 14px;
    height: 0;
    border-top: 2px dashed hsl(0, 84%, 60%);
    vertical-align: middle;
  }

  .my-chart-wrapper {
    position: relative;
    height: 280px;
    width: 100%;
  }

  .my-chart-range-badge {
    position: absolute;
    transform: translateX(-50%);
    background: var(--my-bg-surface);
    border: 1px solid var(--my-border);
    color: var(--my-text-primary);
    font-size: 11px;
    font-weight: 600;
    font-family: inherit;
    padding: 5px 12px;
    border-radius: var(--my-radius-sm);
    cursor: pointer;
    z-index: 15;
    white-space: nowrap;
    user-select: none;
    box-shadow: var(--my-shadow);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .my-chart-range-badge:hover {
    color: var(--my-text-primary);
    background: var(--my-bg-card-hover);
    border-color: var(--my-border-focus);
  }

  .my-chart-range-badge:active {
    background: var(--my-bg-surface);
    border-color: var(--my-accent);
  }


  /* Data Tables */
  .my-table-responsive {
    overflow-x: auto;
    border-radius: var(--my-radius-md);
  }

  .my-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
  }

  .my-table th {
    background: var(--my-bg-surface);
    color: var(--my-text-secondary);
    padding: 12px 16px;
    font-weight: 600;
    border-bottom: 1px solid var(--my-border);
    white-space: nowrap;
  }

  .my-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--my-border);
    color: var(--my-text-primary);
    white-space: nowrap;
  }

  .my-table tr:hover td {
    background: hsla(222, 40%, 25%, 0.4);
  }

  .my-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }

  .my-badge-success {
    background: hsla(142, 71%, 45%, 0.15);
    color: var(--my-success);
  }

  .my-badge-danger {
    background: hsla(0, 84%, 60%, 0.15);
    color: var(--my-danger);
  }

  .my-badge-neutral {
    background: var(--my-bg-surface);
    color: var(--my-text-secondary);
    border: 1px solid var(--my-border);
  }

  /* Project Cards in Projects & Functions View */
  .my-project-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--my-border);
  }

  .my-project-card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 700;
    color: var(--my-text-primary);
  }

  .my-project-color-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .my-project-card-metrics {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Form Elements */
  .my-form-group {
    margin-bottom: 20px;
  }

  .my-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--my-text-secondary);
    margin-bottom: 6px;
  }

  .my-input, .my-range {
    width: 100%;
    padding: 10px 14px;
    border-radius: var(--my-radius-md);
    background: var(--my-bg-surface);
    border: 1px solid var(--my-border);
    color: var(--my-text-primary);
    font-size: 14px;
  }

  .my-input:focus {
    outline: none;
    border-color: var(--my-border-focus);
    box-shadow: 0 0 0 2px var(--my-accent-glow);
  }

  /* Spinner */
  .my-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid #ffffff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: mySpin 0.6s linear infinite;
    display: none;
  }

  @keyframes mySpin {
    to { transform: rotate(360deg); }
  }

  .my-loading .my-spinner {
    display: inline-block;
  }

  /* Fullscreen Loading Overlay */
  .my-loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    z-index: 9999;
  }

  .my-loading-overlay.my-active {
    display: flex;
  }

  .my-loading-spinner {
    width: 38px;
    height: 38px;
    border: 3px solid var(--my-border);
    border-top-color: var(--my-accent);
    border-radius: 50%;
    animation: mySpin 0.8s linear infinite;
  }

  .my-loading-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--my-text-primary);
  }


  .my-view {
    display: none;
  }

  .my-view.my-active {
    display: block;
  }

  /* Global Time Window Toolbar */
  .my-time-window-bar {
    background: var(--my-bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--my-border);
    border-radius: var(--my-radius-lg);
    padding: 14px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    box-shadow: var(--my-shadow);
  }

  .my-time-window-inputs {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .my-window-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--my-text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .my-datetime-input {
    background: var(--my-bg-surface);
    border: 1px solid var(--my-border);
    border-radius: var(--my-radius-sm);
    color: var(--my-text-primary);
    font-size: 13px;
    font-family: inherit;
    padding: 7px 10px;
    color-scheme: dark;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .my-datetime-input:focus {
    outline: none;
    border-color: var(--my-border-focus);
    box-shadow: 0 0 0 2px var(--my-accent-glow);
  }

  .my-time-presets,
  .my-time-resolutions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .my-pill-btn {
    background: var(--my-bg-surface);
    border: 1px solid var(--my-border);
    color: var(--my-text-secondary);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .my-pill-btn:hover {
    color: var(--my-text-primary);
    background: var(--my-bg-card-hover);
    border-color: var(--my-border-focus);
  }

  .my-pill-btn.my-active-preset {
    color: #ffffff;
    background: var(--my-accent);
    border-color: var(--my-accent);
  }

</style>
